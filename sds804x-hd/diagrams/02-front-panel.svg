<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 560" role="img" aria-label="The SDS804X HD front panel, grouped by function" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><text x="24" y="30" font-size="15" font-weight="600" fill="#111111">The SDS804X HD front panel, by function</text><text x="24" y="50" font-size="11.5" fill="#444444">Groups of controls, not exact positions or a complete list: use the labels printed on your panel</text><rect x="20" y="64" width="720" height="470" rx="10" fill="none" stroke="#111111" stroke-width="2"></rect><rect x="36" y="80" width="330" height="220" rx="4" fill="#ececec" stroke="#111111" stroke-width="1.5"></rect><text x="201" y="180" text-anchor="middle" font-weight="600" fill="#111111">7-inch touch screen</text><text x="201" y="198" text-anchor="middle" font-size="11.5" fill="#444444">drag, pinch, tap the descriptor boxes</text><g><rect x="380" y="80" width="344" height="72" rx="6" fill="none" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="5 4"></rect><text x="388" y="95" font-size="11.5" font-weight="600" fill="#111111">Shortcut keys</text></g><g><rect x="390" y="100" width="74" height="20" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.2"></rect><text x="427" y="114" text-anchor="middle" font-size="10.5" fill="#111111">Auto Setup</text></g><g><rect x="470" y="100" width="52" height="20" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.2"></rect><text x="496" y="114" text-anchor="middle" font-size="10.5" fill="#111111">Default</text></g><g><rect x="528" y="100" width="52" height="20" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.2"></rect><text x="554" y="114" text-anchor="middle" font-size="10.5" fill="#111111">Touch</text></g><g><rect x="586" y="100" width="52" height="20" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.2"></rect><text x="612" y="114" text-anchor="middle" font-size="10.5" fill="#111111">Acquire</text></g><g><rect x="644" y="100" width="70" height="20" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.2"></rect><text x="679" y="114" text-anchor="middle" font-size="10.5" fill="#111111">Cursors</text></g><g><rect x="390" y="124" width="74" height="20" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.2"></rect><text x="427" y="138" text-anchor="middle" font-size="10.5" fill="#111111">Measure</text></g><g><rect x="470" y="124" width="70" height="20" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.2"></rect><text x="505" y="138" text-anchor="middle" font-size="10.5" fill="#111111">quick save</text></g><g><rect x="546" y="124" width="70" height="20" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.2"></rect><text x="581" y="138" text-anchor="middle" font-size="10.5" fill="#111111">Run/Stop</text></g><text x="626" y="138" font-size="10.5" fill="#444444">and others</text><g><rect x="380" y="160" width="120" height="140" rx="6" fill="none" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="5 4"></rect><text x="388" y="175" font-size="11.5" font-weight="600" fill="#111111">Universal knob</text></g><g><circle cx="440" cy="218" r="15" fill="#ececec" stroke="#111111" stroke-width="1.5"></circle><line x1="440" x2="440" y1="203" y2="212" stroke="#111111" stroke-width="1.5"></line><text x="440" y="248" text-anchor="middle" font-size="10.5" font-weight="600" fill="#111111">turn: set value</text><text x="440" y="261" text-anchor="middle" font-size="10" fill="#444444">push: select</text></g><g><rect x="510" y="160" width="214" height="140" rx="6" fill="none" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="5 4"></rect><text x="518" y="175" font-size="11.5" font-weight="600" fill="#111111">Trigger</text></g><g><rect x="520" y="182" width="52" height="20" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.2"></rect><text x="546" y="196" text-anchor="middle" font-size="10.5" fill="#111111">Setup</text></g><g><rect x="576" y="182" width="52" height="20" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.2"></rect><text x="602" y="196" text-anchor="middle" font-size="10.5" fill="#111111">Auto</text></g><g><rect x="520" y="206" width="52" height="20" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.2"></rect><text x="546" y="220" text-anchor="middle" font-size="10.5" fill="#111111">Normal</text></g><g><rect x="576" y="206" width="52" height="20" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.2"></rect><text x="602" y="220" text-anchor="middle" font-size="10.5" fill="#111111">Single</text></g><g><circle cx="670" cy="210" r="15" fill="#ececec" stroke="#111111" stroke-width="1.5"></circle><line x1="670" x2="670" y1="195" y2="204" stroke="#111111" stroke-width="1.5"></line><text x="670" y="240" text-anchor="middle" font-size="10.5" font-weight="600" fill="#111111">Level</text><text x="670" y="253" text-anchor="middle" font-size="10" fill="#444444">push: 50 %</text></g><g><rect x="36" y="312" width="330" height="140" rx="6" fill="none" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="5 4"></rect><text x="44" y="327" font-size="11.5" font-weight="600" fill="#111111">Vertical</text></g><g><rect x="46" y="334" width="34" height="20" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.2"></rect><text x="63" y="348" text-anchor="middle" font-size="10.5" fill="#111111">1</text></g><g><rect x="84" y="334" width="34" height="20" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.2"></rect><text x="101" y="348" text-anchor="middle" font-size="10.5" fill="#111111">2</text></g><g><rect x="122" y="334" width="34" height="20" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.2"></rect><text x="139" y="348" text-anchor="middle" font-size="10.5" fill="#111111">3</text></g><g><rect x="160" y="334" width="34" height="20" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.2"></rect><text x="177" y="348" text-anchor="middle" font-size="10.5" fill="#111111">4</text></g><g><rect x="46" y="358" width="50" height="20" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.2"></rect><text x="71" y="372" text-anchor="middle" font-size="10.5" fill="#111111">Math</text></g><g><rect x="100" y="358" width="44" height="20" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.2"></rect><text x="122" y="372" text-anchor="middle" font-size="10.5" fill="#111111">Ref</text></g><g><rect x="148" y="358" width="52" height="20" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.2"></rect><text x="174" y="372" text-anchor="middle" font-size="10.5" fill="#111111">Digital</text></g><g><circle cx="256" cy="350" r="15" fill="#ececec" stroke="#111111" stroke-width="1.5"></circle><line x1="256" x2="256" y1="335" y2="344" stroke="#111111" stroke-width="1.5"></line><text x="256" y="380" text-anchor="middle" font-size="10.5" font-weight="600" fill="#111111">Scale (V/div)</text><text x="256" y="393" text-anchor="middle" font-size="10" fill="#444444">push: fine</text></g><g><circle cx="332" cy="350" r="15" fill="#ececec" stroke="#111111" stroke-width="1.5"></circle><line x1="332" x2="332" y1="335" y2="344" stroke="#111111" stroke-width="1.5"></line><text x="332" y="380" text-anchor="middle" font-size="10.5" font-weight="600" fill="#111111">Position</text><text x="332" y="393" text-anchor="middle" font-size="10" fill="#444444">push: zero</text></g><text x="46" y="406" font-size="10.5" fill="#444444">A channel key turns the channel on</text><text x="46" y="420" font-size="10.5" fill="#444444">and selects it for the knobs;</text><text x="46" y="434" font-size="10.5" fill="#444444">press it again to turn it off.</text><g><rect x="380" y="312" width="344" height="140" rx="6" fill="none" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="5 4"></rect><text x="388" y="327" font-size="11.5" font-weight="600" fill="#111111">Horizontal</text></g><g><rect x="390" y="334" width="52" height="20" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.2"></rect><text x="416" y="348" text-anchor="middle" font-size="10.5" fill="#111111">Roll</text></g><g><rect x="390" y="358" width="52" height="20" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.2"></rect><text x="416" y="372" text-anchor="middle" font-size="10.5" fill="#111111">Zoom</text></g><g><circle cx="510" cy="362" r="15" fill="#ececec" stroke="#111111" stroke-width="1.5"></circle><line x1="510" x2="510" y1="347" y2="356" stroke="#111111" stroke-width="1.5"></line><text x="510" y="392" text-anchor="middle" font-size="10.5" font-weight="600" fill="#111111">Scale (time/div)</text><text x="510" y="405" text-anchor="middle" font-size="10" fill="#444444">push: zoom window</text></g><g><circle cx="640" cy="362" r="15" fill="#ececec" stroke="#111111" stroke-width="1.5"></circle><line x1="640" x2="640" y1="347" y2="356" stroke="#111111" stroke-width="1.5"></line><text x="640" y="392" text-anchor="middle" font-size="10.5" font-weight="600" fill="#111111">Position (delay)</text><text x="640" y="405" text-anchor="middle" font-size="10" fill="#444444">push: zero</text></g><g><rect x="36" y="462" width="688" height="62" rx="6" fill="none" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="5 4"></rect><text x="44" y="477" font-size="11.5" font-weight="600" fill="#111111">Inputs and connectors</text></g><g><circle cx="70" cy="500" r="13" fill="#ffffff" stroke="#111111" stroke-width="2"></circle><circle cx="70" cy="500" r="4" fill="#111111"></circle><text x="92" y="504" font-size="10.5" fill="#111111">CH1</text></g><g><circle cx="140" cy="500" r="13" fill="#ffffff" stroke="#111111" stroke-width="2"></circle><circle cx="140" cy="500" r="4" fill="#111111"></circle><text x="162" y="504" font-size="10.5" fill="#111111">CH2</text></g><g><circle cx="210" cy="500" r="13" fill="#ffffff" stroke="#111111" stroke-width="2"></circle><circle cx="210" cy="500" r="4" fill="#111111"></circle><text x="232" y="504" font-size="10.5" fill="#111111">CH3</text></g><g><circle cx="280" cy="500" r="13" fill="#ffffff" stroke="#111111" stroke-width="2"></circle><circle cx="280" cy="500" r="4" fill="#111111"></circle><text x="302" y="504" font-size="10.5" fill="#111111">CH4</text></g><rect x="350" y="486" width="26" height="14" fill="#ffffff" stroke="#111111" stroke-width="1.2"></rect><circle cx="363" cy="512" r="4" fill="none" stroke="#111111" stroke-width="1.5"></circle><text x="384" y="498" font-size="10.5" fill="#111111">probe compensation 1 kHz, 3 V</text><text x="384" y="515" font-size="10.5" fill="#111111">and ground terminal</text><text x="600" y="498" font-size="10.5" fill="#111111">USB host, SBUS,</text><text x="600" y="515" font-size="10.5" fill="#111111">power switch</text></svg>
