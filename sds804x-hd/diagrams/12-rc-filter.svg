<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 420" role="img" aria-label="An RC low-pass filter turns PWM into a DC level" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><text x="24" y="30" font-size="15" font-weight="600" fill="#111111">RC low-pass filter: from PWM to DC</text><text x="24" y="50" font-size="11.5" fill="#444444">Corner frequency f = 1 / (2π × R × C) = 1 / (2π × 10 kΩ × 1 µF) ≈ 16 Hz</text><rect x="40" y="96" width="110" height="70" rx="4" fill="#ececec" stroke="#111111" stroke-width="1.5"></rect><text x="95" y="124" text-anchor="middle" font-weight="600" fill="#111111">ESP32</text><text x="142" y="150" text-anchor="end" font-size="11.5" fill="#111111">GPIO25</text><path d="M150 146H300" stroke="#111111" stroke-width="1.5"></path><circle cx="220" cy="146" r="3.5" fill="#111111"></circle><g><path d="M220 142L212 120L228 120z" fill="#111111"></path><text x="220" y="114" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111111">CH1</text></g><rect x="300" y="138" width="60" height="16" fill="#ffffff" stroke="#111111" stroke-width="1.5"></rect><text x="330" y="176" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111111">R 10 kΩ</text><path d="M360 146H520" stroke="#111111" stroke-width="1.5"></path><circle cx="440" cy="146" r="3.5" fill="#111111"></circle><text x="452" y="166" font-size="11.5" fill="#111111">node A</text><g><path d="M500 142L492 120L508 120z" fill="#111111"></path><text x="500" y="114" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111111">CH2</text></g><circle cx="500" cy="146" r="3.5" fill="#111111"></circle><path d="M440 146V186" stroke="#111111" stroke-width="1.5"></path><g stroke="#111111" stroke-width="2"><line x1="428" x2="452" y1="186" y2="186"></line><line x1="428" x2="452" y1="194" y2="194"></line></g><text x="460" y="194" font-size="11.5" font-weight="600" fill="#111111">C 1 µF</text><path d="M440 194V214" stroke="#111111" stroke-width="1.5"></path><g stroke="#111111" stroke-width="1.5"><line x1="428" x2="452" y1="214" y2="214"></line><line x1="432" x2="448" y1="219" y2="219"></line><line x1="436" x2="444" y1="224" y2="224"></line></g><path d="M95 166V214" stroke="#111111" stroke-width="1.5"></path><g stroke="#111111" stroke-width="1.5"><line x1="83" x2="107" y1="214" y2="214"></line><line x1="87" x2="103" y1="219" y2="219"></line><line x1="91" x2="99" y1="224" y2="224"></line></g><text x="106" y="206" font-size="11.5" fill="#111111">GND</text><text x="60" y="258" font-weight="600" fill="#111111">CH1: PWM, 50 %, 1 kHz</text><path d="M60 330H60V270H80V330H100V270H120V330H140V270H160V330H180V270H200V330H220V270H240V330H260V270H280V330H300V270H320V330H340" fill="none" stroke="#111111" stroke-width="2"></path><line x1="60" x2="340" y1="300" y2="300" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="4 4"></line><text x="60" y="352" font-size="11.5" fill="#444444">0 V to 3.3 V</text><text x="420" y="258" font-weight="600" fill="#111111">CH2: DC with a small ripple</text><line x1="420" x2="700" y1="330" y2="330" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="4 4"></line><path d="M420 300L440 292L460 300L480 292L500 300L520 292L540 300L560 292L580 300L600 292L620 300L640 292L660 300L680 292L700 300" fill="none" stroke="#111111" stroke-width="2"></path><text x="420" y="352" font-size="11.5" fill="#444444">about 1.65 V = duty × 3.3 V; ripple shown much enlarged</text><text x="24" y="396" font-size="11.5" fill="#111111">Higher PWM frequency or larger R × C: less ripple, but a slower response when the duty changes.</text></svg>
