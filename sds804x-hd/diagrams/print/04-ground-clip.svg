<svg viewBox="0 0 760 470" role="img" aria-label="The probe ground clip is connected to mains earth" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><text x="24" y="30" font-size="15" font-weight="700" fill="#000000">The probe ground clip is mains earth</text><text x="24" y="50" font-size="12.5" fill="#000000">On a mains-powered scope every probe ground is wired to the earth pin of the power cord</text><line x1="380" x2="380" y1="70" y2="460" stroke="#000000" stroke-width="1.5"></line><g><text x="24" y="84" font-weight="700" fill="#000000">Right</text><text x="24" y="101" font-size="12.5" fill="#000000">ground clip on circuit GND</text><rect x="24" y="120" width="120" height="96" rx="6" fill="#dedede" stroke="#000000" stroke-width="2.25"></rect><text x="84" y="146" text-anchor="middle" font-weight="700" fill="#000000">Scope</text><text x="84" y="163" text-anchor="middle" font-size="12.5" fill="#000000">probe ground</text><text x="84" y="178" text-anchor="middle" font-size="12.5" fill="#000000">= BNC shell</text><text x="84" y="193" text-anchor="middle" font-size="12.5" fill="#000000">= earth pin</text><path d="M54 216V246" stroke="#000000" stroke-width="2.25"></path><g stroke="#000000" stroke-width="2.25"><line x1="54" x2="54" y1="246" y2="256"></line><line x1="42" x2="66" y1="256" y2="256"></line><line x1="46" x2="62" y1="261" y2="261"></line><line x1="50" x2="58" y1="266" y2="266"></line></g><rect x="224" y="120" width="140" height="130" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><text x="294" y="140" text-anchor="middle" font-weight="700" fill="#000000">Circuit</text><circle cx="244" cy="166" r="4" fill="#000000"></circle><text x="254" y="170" font-size="12.5" fill="#000000">+12 V</text><circle cx="244" cy="226" r="4" fill="#000000"></circle><text x="254" y="230" font-size="12.5" fill="#000000">GND</text><rect x="224" y="290" width="140" height="54" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><text x="294" y="312" text-anchor="middle" font-weight="700" fill="#000000">Supply</text><text x="294" y="330" text-anchor="middle" font-size="12.5" fill="#000000">minus may be earthed</text><path d="M334 250V290" stroke="#000000" stroke-width="2.25"></path><path d="M254 344V372" stroke="#000000" stroke-width="2.25" stroke-dasharray="4 3"></path><g stroke="#000000" stroke-width="2.25"><line x1="254" x2="254" y1="372" y2="382"></line><line x1="242" x2="266" y1="382" y2="382"></line><line x1="246" x2="262" y1="387" y2="387"></line><line x1="250" x2="258" y1="392" y2="392"></line></g><path d="M144 150H194V160H238" fill="none" stroke="#000000" stroke-width="2.25"></path><text x="152" y="143" font-size="12.5" fill="#000000">probe tip</text><path d="M144 196H184V226H238" fill="none" stroke="#000000" stroke-width="3.75"></path><text x="150" y="246" font-size="12.5" fill="#000000">ground clip</text><text x="24" y="420" font-size="12.5" fill="#000000">Clip on GND: no current flows in the ground lead.</text></g><g><text x="404" y="84" font-weight="700" fill="#000000">Wrong</text><text x="404" y="101" font-size="12.5" fill="#000000">ground clip on any other node</text><rect x="404" y="120" width="120" height="96" rx="6" fill="#dedede" stroke="#000000" stroke-width="2.25"></rect><text x="464" y="146" text-anchor="middle" font-weight="700" fill="#000000">Scope</text><text x="464" y="163" text-anchor="middle" font-size="12.5" fill="#000000">probe ground</text><text x="464" y="178" text-anchor="middle" font-size="12.5" fill="#000000">= BNC shell</text><text x="464" y="193" text-anchor="middle" font-size="12.5" fill="#000000">= earth pin</text><path d="M434 216V246" stroke="#000000" stroke-width="2.25"></path><g stroke="#000000" stroke-width="2.25"><line x1="434" x2="434" y1="246" y2="256"></line><line x1="422" x2="446" y1="256" y2="256"></line><line x1="426" x2="442" y1="261" y2="261"></line><line x1="430" x2="438" y1="266" y2="266"></line></g><rect x="604" y="120" width="140" height="130" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><text x="674" y="140" text-anchor="middle" font-weight="700" fill="#000000">Circuit</text><circle cx="624" cy="166" r="4" fill="#000000"></circle><text x="634" y="170" font-size="12.5" fill="#000000">+12 V</text><circle cx="624" cy="226" r="4" fill="#000000"></circle><text x="634" y="230" font-size="12.5" fill="#000000">GND</text><rect x="604" y="290" width="140" height="54" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><text x="674" y="312" text-anchor="middle" font-weight="700" fill="#000000">Supply</text><text x="674" y="330" text-anchor="middle" font-size="12.5" fill="#000000">minus may be earthed</text><path d="M714 250V290" stroke="#000000" stroke-width="2.25"></path><path d="M634 344V372" stroke="#000000" stroke-width="2.25" stroke-dasharray="4 3"></path><g stroke="#000000" stroke-width="2.25"><line x1="634" x2="634" y1="372" y2="382"></line><line x1="622" x2="646" y1="382" y2="382"></line><line x1="626" x2="642" y1="387" y2="387"></line><line x1="630" x2="638" y1="392" y2="392"></line></g><path d="M524 150H574V166H618" fill="none" stroke="#000000" stroke-width="2.25"></path><text x="532" y="143" font-size="12.5" fill="#000000">probe tip</text><path d="M524 196H564V166H618" fill="none" stroke="#000000" stroke-width="3.75"></path><text x="530" y="246" font-size="12.5" fill="#000000">ground clip</text><g><path d="M434 268C434 400 634 410 634 394" fill="none" stroke="#000000" stroke-width="3" stroke-dasharray="6 4"></path><text x="496" y="418" font-size="12.5" font-weight="700" fill="#000000">fault current through earth</text><text x="404" y="440" font-size="12.5" fill="#000000">Clip on +12 V: +12 V is shorted to earth</text><text x="404" y="456" font-size="12.5" fill="#000000">through the thin ground lead.</text></g></g></svg>
