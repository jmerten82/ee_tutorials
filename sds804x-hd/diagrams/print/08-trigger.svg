">before the trigger</text><text x="440" y="420" text-anchor="middle" font-size="12.5" fill="#000000">after the trigger</text><text x="380" y="222" text-anchor="middle" font-size="12.5" font-weight="700" fill="#000000">trigger point</text><text x="24" y="262" font-weight="700" fill="#000000">The screen</text><text x="24" y="280" font-size="12.5" fill="#000000">All captures line up at the</text><text x="24" y="295" font-size="12.5" fill="#000000">trigger point, so a repeating</text><text x="24" y="310" font-size="12.5" fill="#000000">signal stands still.</text><text x="520" y="262" font-weight="700" fill="#000000">Trigger modes</text><text x="520" y="282" font-size="12.5" fill="#000000">Auto: draws anyway if no trigger</text><text x="520" y="300" font-size="12.5" fill="#000000">Normal: draws only on a trigger</text><text x="520" y="318" font-size="12.5" fill="#000000">Single: one trigger, then stops</text><text x="24" y="456" font-size="12.5" fill="#000000">Push the trigger level knob to set the level to 50 % of the signal.</text></svg>
