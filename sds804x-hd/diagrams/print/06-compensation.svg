<svg viewBox="0 0 760 310" role="img" aria-label="Probe compensation: under, correct and over" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><text x="24" y="30" font-size="15" font-weight="700" fill="#000000">Probe compensation on the 1 kHz calibration signal</text><text x="24" y="50" font-size="12.5" fill="#000000">Turn the probe's trimmer with a non-metallic screwdriver until the corners are square</text><g><rect x="24" y="86" width="236" height="140" rx="6" fill="none" stroke="#000000" stroke-width="1.5"></rect><path d="M38 200L38 150L40.9 136.4L43.8 127.4L46.8 121.5L49.7 117.6L52.6 115.0L55.5 113.3L58.4 112.2L61.3 111.4L64.3 110.9L67.2 110.6L70.1 110.4L73.0 110.3L108 110L108 160L110.9 173.6L113.8 182.6L116.8 188.5L119.7 192.4L122.6 195.0L125.5 196.7L128.4 197.8L131.3 198.6L134.3 199.1L137.2 199.4L140.1 199.6L143.0 199.7L178 200L178 150L180.9 136.4L183.8 127.4L186.8 121.5L189.7 117.6L192.6 115.0L195.5 113.3L198.4 112.2L201.3 111.4L204.3 110.9L207.2 110.6L210.1 110.4L213.0 110.3L248 110" fill="none" stroke="#000000" stroke-width="3"></path><text x="142" y="254" text-anchor="middle" font-weight="700" fill="#000000">Under-compensated</text><text x="142" y="272" text-anchor="middle" font-size="12.5" fill="#000000">rounded, creeping corners</text></g><g><rect x="274" y="86" width="236" height="140" rx="6" fill="#dedede" stroke="#000000" stroke-width="1.5"></rect><path d="M288 200L288 110L290.9 110.0L293.8 110.0L296.8 110.0L299.7 110.0L302.6 110.0L305.5 110.0L308.4 110.0L311.3 110.0L314.3 110.0L317.2 110.0L320.1 110.0L323.0 110.0L358 110L358 200L360.9 200.0L363.8 200.0L366.8 200.0L369.7 200.0L372.6 200.0L375.5 200.0L378.4 200.0L381.3 200.0L384.3 200.0L387.2 200.0L390.1 200.0L393.0 200.0L428 200L428 110L430.9 110.0L433.8 110.0L436.8 110.0L439.7 110.0L442.6 110.0L445.5 110.0L448.4 110.0L451.3 110.0L454.3 110.0L457.2 110.0L460.1 110.0L463.0 110.0L498 110" fill="none" stroke="#000000" stroke-width="3"></path><text x="392" y="2