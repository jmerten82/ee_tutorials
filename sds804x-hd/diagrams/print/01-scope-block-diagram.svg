<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 420" role="img" aria-label="Inside a digital oscilloscope" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><defs><marker id="blk-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#000000"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="700" fill="#000000">Inside a digital oscilloscope</text><text x="24" y="50" font-size="12.5" fill="#000000">The signal path, left to right; the trigger decides which part of the stream is shown</text><rect x="120" y="72" width="200" height="130" rx="8" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="5 4"></rect><text x="220" y="88" text-anchor="middle" font-size="12.5" fill="#000000">vertical system</text><g><rect x="20" y="100" width="84" height="74" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><text x="62" y="124" text-anchor="middle" font-weight="700" fill="#000000">Probe</text><text x="62" y="142" text-anchor="middle" font-size="12.5" fill="#000000">10 : 1</text><text x="62" y="157" text-anchor="middle" font-size="12.5" fill="#000000">divider</text></g><g><rect x="134" y="100" width="172" height="74" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><text x="220" y="124" text-anchor="middle" font-weight="700" fill="#000000">Attenuator + amp</text><text x="220" y="142" text-anchor="middle" font-size="12.5" fill="#000000">V/div, offset, coupling,</text><text x="220" y="157" text-anchor="middle" font-size="12.5" fill="#000000">20 MHz BW limit</text></g><g><rect x="340" y="100" width="120" height="74" rx="6" fill="#dedede" stroke="#000000" stroke-width="2.25"></rect><text x="400" y="124" text-anchor="middle" font-weight="700" fill="#000000">ADC</text><text x="400" y="142" text-anchor="middle" font-size="12.5" fill="#000000">12 bit</text><text x="400" y="157" text-anchor="middle" font-size="12.5" fill="#000000">samples</text></g><g><rect x="494" y="100" width="120" height="74" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><text x="554" y="124" text-anchor="middle" font-weight="700" fill="#000000">Memory</text><text x="554" y="142" text-anchor="middle" font-size="12.5" fill="#000000">up to 50 Mpts</text><text x="554" y="157" text-anchor="middle" font-size="12.5" fill="#000000">(10 Mpts × 4 ch)</text></g><g><rect x="640" y="100" width="100" height="74" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><text x="690" y="124" text-anchor="middle" font-weight="700" fill="#000000">Screen</text><text x="690" y="142" text-anchor="middle" font-size="12.5" fill="#000000">grid, math,</text><text x="690" y="157" text-anchor="middle" font-size="12.5" fill="#000000">measurements</text></g><path d="M104 137H132" fill="none" stroke="#000000" stroke-width="2.25" marker-end="url(#blk-arrow)"></path><path d="M306 137H338" fill="none" stroke="#000000" stroke-width="2.25" marker-end="url(#blk-arrow)"></path><path d="M460 137H492" fill="none" stroke="#000000" stroke-width="2.25" marker-end="url(#blk-arrow)"></path><path d="M614 137H638" fill="none" stroke="#000000" stroke-width="2.25" marker-end="url(#blk-arrow)"></path><g><rect x="340" y="250" width="120" height="66" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><text x="400" y="274" text-anchor="middle" font-weight="700" fill="#000000">Sample clock</text><text x="400" y="292" text-anchor="middle" font-size="12.5" fill="#000000">up to 2 GSa/s</text></g><path d="M400 250V176" fill="none" stroke="#000000" stroke-width="2.25" marker-end="url(#blk-arrow)"></path><text x="392" y="226" text-anchor="end" font-size="12.5" fill="#000000">time/div sets</text><text x="392" y="241" text-anchor="end" font-size="12.5" fill="#000000">the sample rate</text><g><rect x="494" y="250" width="140" height="66" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><text x="564" y="274" text-anchor="middle" font-weight="700" fill="#000000">Trigger</text><text x="564" y="292" text-anchor="middle" font-size="12.5" fill="#000000">level, slope, type,</text><text x="564" y="307" text-anchor="middle" font-size="12.5" fill="#000000">mode</text></g><path d="M440 176C470 200 520 210 540 248" fill="none" stroke="#000000" stroke-width="2.25" marker-end="url(#blk-arrow)"></path><text x="500" y="238" text-anchor="end" font-size="12.5" fill="#000000">watches samples</text><path d="M580 250V176" fill="none" stroke="#000000" stroke-width="2.25" marker-end="url(#blk-arrow)"></path><text x="588" y="226" font-size="12.5" fill="#000000">"keep this part"</text><rect x="120" y="340" width="520" height="58" rx="6" fill="#dedede"></rect><text x="380" y="364" text-anchor="middle" fill="#000000">memory used = sample rate × time on screen (10 div × time/div)</text><text x="380" y="384" text-anchor="middle" font-size="12.5" fill="#000000">Slow timebase + limited memory = lower sample rate. Check it in the timebase box.</text></svg>
