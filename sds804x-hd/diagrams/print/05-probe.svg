<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 470" role="img" aria-label="The 10x passive probe and its equivalent circuit" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><text x="24" y="30" font-size="15" font-weight="700" fill="#000000">The 10× passive probe</text><text x="24" y="50" font-size="12.5" fill="#000000">A 9 MΩ tip resistor and the scope's 1 MΩ input form a 10 : 1 divider; a trimmer matches the capacitances</text><path d="M40 130L70 124L70 136z" fill="#000000"></path><rect x="70" y="116" width="40" height="28" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><text x="90" y="108" text-anchor="middle" font-size="12.5" fill="#000000">hook tip</text><rect x="110" y="112" width="170" height="36" rx="10" fill="#dedede" stroke="#000000" stroke-width="2.25"></rect><rect x="164" y="120" width="52" height="16" rx="3" fill="#ffffff" stroke="#000000" stroke-width="1.8"></rect><text x="190" y="132" text-anchor="middle" font-size="12.5" fill="#000000">1× 10×</text><text x="195" y="104" text-anchor="middle" font-size="12.5" font-weight="700" fill="#000000">switch: keep on 10×</text><path d="M130 148C130 190 100 196 70 200" fill="none" stroke="#000000" stroke-width="3"></path><path d="M58 194L74 194L74 208L58 208z" fill="#000000"></path><text x="54" y="226" font-size="12.5" fill="#000000">ground lead + clip (about 15 cm)</text><path d="M280 130H560" fill="none" stroke="#000000" stroke-width="4.5"></path><text x="420" y="120" text-anchor="middle" font-size="12.5" fill="#000000">coaxial cable, about 1.2 m</text><rect x="560" y="114" width="60" height="32" rx="4" fill="#dedede" stroke="#000000" stroke-width="2.25"></rect><circle cx="590" cy="130" r="5" fill="#ffffff" stroke="#000000" stroke-width="2.25"></circle><line x1="587" x2="593" y1="130" y2="130" stroke="#000000" stroke-width="2.25"></line><text x="590" y="164" text-anchor="middle" font-size="12.5" fill="#000000">trimmer (here or in the</text><text x="590" y="178" text-anchor="middle" font-size="12.5" fill="#000000">probe body)</text><rect x="620" y="118" width="34" height="24" rx="3" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><text x="637" y="108" text-anchor="middle" font-size="12.5" font-weight="700" fill="#000000">BNC</text><g><circle cx="330" cy="210" r="10" fill="none" stroke="#000000" stroke-width="2.25"></circle><path d="M322 204C326 200 334 200 338 204M322 210C326 206 334 206 338 210M322 216C326 212 334 212 338 216" fill="none" stroke="#000000" stroke-width="1.8"></path><text x="348" y="206" font-size="12.5" font-weight="700" fill="#000000">ground spring</text><text x="348" y="221" font-size="12.5" fill="#000000">replaces the lead for fast edges (Lesson 5)</text></g><rect x="24" y="252" width="712" height="1" fill="#000000"></rect><text x="24" y="282" font-weight="700" fill="#000000">Equivalent circuit at 10×</text><path d="M60 350H120" stroke="#000000" stroke-width="2.25"></path><circle cx="60" cy="350" r="4" fill="#000000"></circle><text x="60" y="336" text-anchor="middle" font-size="12.5" fill="#000000">tip</text><g><rect x="120" y="342" width="44" height="16" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><text x="142" y="374" text-anchor="middle" font-size="12.5" font-weight="700" fill="#000000">9 MΩ</text></g><path d="M110 350V316H142" stroke="#000000" stroke-width="2.25" fill="none"></path><path d="M150 316H176V350" stroke="#000000" stroke-width="2.25" fill="none"></path><g stroke="#000000" stroke-width="3"><line x1="142" x2="142" y1="304" y2="328"></line><line x1="150" x2="150" y1="304" y2="328"></line></g><text x="146" y="300" text-anchor="middle" font-size="12.5" fill="#000000">tip C</text><path d="M164 350H420" stroke="#000000" stroke-width="2.25"></path><text x="300" y="340" text-anchor="middle" font-size="12.5" fill="#000000">cable capacitance</text><path d="M300 350V372" stroke="#000000" stroke-width="2.25"></path><g stroke="#000000" stroke-width="3"><line x1="288" x2="312" y1="372" y2="372"></line><line x1="288" x2="312" y1="380" y2="380"></line></g><path d="M300 380V400" stroke="#000000" stroke-width="2.25"></path><g stroke="#000000" stroke-width="2.25"><line x1="290" x2="310" y1="400" y2="400"></line><line x1="294" x2="306" y1="405" y2="405"></line><line x1="298" x2="302" y1="410" y2="410"></line></g><path d="M380 350V372" stroke="#000000" stroke-width="2.25"></path><g stroke="#000000" stroke-width="3"><line x1="368" x2="392" y1="372" y2="372"></line><line x1="368" x2="392" y1="380" y2="380"></line></g><path d="M380 380V400" stroke="#000000" stroke-width="2.25"></path><g stroke="#000000" stroke-width="2.25"><line x1="370" x2="390" y1="400" y2="400"></line><line x1="374" x2="386" y1="405" y2="405"></line><line x1="378" x2="382" y1="410" y2="410"></line></g><text x="394" y="380" font-size="12.5" fill="#000000">trimmer</text><rect x="440" y="300" width="190" height="120" rx="6" fill="#dedede" stroke="#000000" stroke-width="2.25"></rect><text x="535" y="320" text-anchor="middle" font-weight="700" fill="#000000">Scope input</text><path d="M420 350H480" stroke="#000000" stroke-width="2.25"></path><path d="M480 350V362" stroke="#000000" stroke-width="2.25"></path><rect x="472" y="362" width="16" height="34" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><path d="M480 396V404" stroke="#000000" stroke-width="2.25"></path><g stroke="#000000" stroke-width="2.25"><line x1="470" x2="490" y1="404" y2="404"></line><line x1="474" x2="486" y1="409" y2="409"></line><line x1="478" x2="482" y1="414" y2="414"></line></g><text x="496" y="378" font-size="12.5" fill="#000000">1 MΩ</text><path d="M480 350H560V372" stroke="#000000" stroke-width="2.25" fill="none"></path><g stroke="#000000" stroke-width="3"><line x1="548" x2="572" y1="372" y2="372"></line><line x1="548" x2="572" y1="380" y2="380"></line></g><path d="M560 380V404" stroke="#000000" stroke-width="2.25"></path><g stroke="#000000" stroke-width="2.25"><line x1="550" x2="570" y1="404" y2="404"></line><line x1="554" x2="566" y1="409" y2="409"></line><line x1="558" x2="562" y1="414" y2="414"></line></g><text x="576" y="378" font-size="12.5" fill="#000000">17 pF</text><text x="24" y="452" font-size="12.5" fill="#000000">9 MΩ + 1 MΩ = 10 : 1. Correctly compensated, the divider is 10 : 1 at every frequency, and the circuit sees about 10 MΩ.</text></svg>
