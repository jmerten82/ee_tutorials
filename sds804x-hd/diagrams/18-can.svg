<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 470" role="img" aria-label="CAN high, CAN low and their difference" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><defs><marker id="can-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111111"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#111111">CAN on the scope</text><text x="24" y="50" font-size="11.5" fill="#444444">Two wires, opposite movements. Recessive (1): both near 2.3 V. Dominant (0): CANH up, CANL down. Levels typical</text><rect x="218" y="120" width="44" height="280" fill="#ececec"></rect><rect x="262" y="120" width="44" height="280" fill="#ececec"></rect><rect x="350" y="120" width="44" height="280" fill="#ececec"></rect><rect x="482" y="120" width="44" height="280" fill="#ececec"></rect><rect x="526" y="120" width="44" height="280" fill="#ececec"></rect><rect x="570" y="120" width="44" height="280" fill="#ececec"></rect><rect x="658" y="120" width="44" height="280" fill="#ececec"></rect><text x="262" y="112" text-anchor="middle" font-size="11.5" fill="#111111">dominant</text><text x="152" y="112" text-anchor="middle" font-size="11.5" fill="#111111">recessive</text><path d="M130 200H130V200H174V200H218V160H262V160H306V200H350V160H394V200H438V200H482V160H526V160H570V160H614V200H658V160H702V200H746" fill="none" stroke="#111111" stroke-width="2"></path><path d="M130 200H130V200H174V200H218V240H262V240H306V200H350V240H394V200H438V200H482V240H526V240H570V240H614V200H658V240H702V200H746" fill="none" stroke="#111111" stroke-width="2" stroke-dasharray="7 3"></path><text x="120" y="164" text-anchor="end" font-size="11.5" font-weight="600" fill="#111111">CH1 CANH</text><text x="120" y="244" text-anchor="end" font-size="11.5" font-weight="600" fill="#111111">CH2 CANL</text><text x="120" y="204" text-anchor="end" font-size="11" fill="#444444">≈ 2.3 V</text><path d="M130 380H130V380H174V380H218V320H262V320H306V380H350V320H394V380H438V380H482V320H526V320H570V320H614V380H658V320H702V380H746" fill="none" stroke="#111111" stroke-width="2.5"></path><text x="120" y="324" text-anchor="end" font-size="11.5" font-weight="600" fill="#111111">F1 = C1 − C2</text><text x="120" y="384" text-anchor="end" font-size="11" fill="#444444">≈ 0 V</text><text x="262" y="312" text-anchor="middle" font-size="11" fill="#111111">≈ 2 V</text><path d="M350 420H394" stroke="#111111" stroke-width="1.2" marker-start="url(#can-arrow)" marker-end="url(#can-arrow)"></path><text x="372" y="440" text-anchor="middle" font-size="11.5" fill="#111111">1 bit = 2 µs at 500 kbit/s</text><text x="24" y="462" font-size="11.5" fill="#111111">Noise that hits both wires cancels in F1: that is why CAN is differential. Decode on the transceiver's RX pin.</text></svg>
