<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 470" role="img" aria-label="Low-side and high-side current shunts" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><text x="24" y="30" font-size="15" font-weight="600" fill="#111111">Measuring current with a shunt</text><text x="24" y="50" font-size="11.5" fill="#444444">I = V / R. With 1 Ω, 1 mV = 1 mA. The scope's probe grounds are all earth, which decides where the shunt goes</text><line x1="380" x2="380" y1="70" y2="420" stroke="#bbbbbb" stroke-width="1"></line><text x="24" y="90" font-weight="600" fill="#111111">Low side: one probe</text><rect x="40" y="120" width="90" height="170" rx="6" fill="#ececec" stroke="#111111" stroke-width="1.5"></rect><text x="85" y="206" text-anchor="middle" font-weight="600" fill="#111111">Supply</text><text x="122" y="140" text-anchor="end" font-size="11.5" fill="#111111">+</text><text x="122" y="282" text-anchor="end" font-size="11.5" fill="#111111">−</text><rect x="230" y="120" width="110" height="170" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.5"></rect><text x="285" y="206" text-anchor="middle" font-weight="600" fill="#111111">Circuit</text><text x="238" y="282" font-size="11.5" fill="#111111">GND</text><path d="M130 136H230" stroke="#111111" stroke-width="1.5"></path><path d="M130 276H150" stroke="#111111" stroke-width="1.5"></path><rect x="150" y="268" width="50" height="16" fill="#ffffff" stroke="#111111" stroke-width="1.5"></rect><path d="M200 276H230" stroke="#111111" stroke-width="1.5"></path><text x="175" y="304" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111111">R shunt</text><circle cx="215" cy="276" r="3.5" fill="#111111"></circle><g><path d="M215 272L207 250L223 250z" fill="#111111"></path><text x="215" y="244" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111111">CH1</text></g><circle cx="140" cy="276" r="3.5" fill="#111111"></circle><path d="M140 276V330" stroke="#111111" stroke-width="1.5" stroke-dasharray="4 3"></path><g><path d="M134 330h12v10h-12z" fill="#111111"></path></g><text x="156" y="340" font-size="11.5" fill="#111111">ground clip: supply side</text><text x="24" y="376" font-size="11.5" fill="#111111">CH1 reads −I × R (invert it). Simple, but any other</text><text x="24" y="392" font-size="11.5" fill="#111111">ground clip on the circuit's GND shorts the shunt</text><text x="24" y="408" font-size="11.5" fill="#111111">through earth.</text><text x="404" y="90" font-weight="600" fill="#111111">High side: two probes and math</text><rect x="420" y="120" width="90" height="170" rx="6" fill="#ececec" stroke="#111111" stroke-width="1.5"></rect><text x="465" y="206" text-anchor="middle" font-weight="600" fill="#111111">Supply</text><text x="502" y="140" text-anchor="end" font-size="11.5" fill="#111111">+</text><text x="502" y="282" text-anchor="end" font-size="11.5" fill="#111111">−</text><rect x="620" y="120" width="110" height="170" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.5"></rect><text x="675" y="206" text-anchor="middle" font-weight="600" fill="#111111">Circuit</text><text x="628" y="282" font-size="11.5" fill="#111111">GND</text><path d="M510 136H540" stroke="#111111" stroke-width="1.5"></path><rect x="540" y="128" width="50" height="16" fill="#ffffff" stroke="#111111" stroke-width="1.5"></rect><path d="M590 136H620" stroke="#111111" stroke-width="1.5"></path><circle cx="528" cy="136" r="3.5" fill="#111111"></circle><circle cx="604" cy="136" r="3.5" fill="#111111"></circle><g><path d="M528 132L520 110L536 110z" fill="#111111"></path><text x="528" y="104" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111111">CH1</text></g><g><path d="M604 132L596 110L612 110z" fill="#111111"></path><text x="604" y="104" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111111">CH2</text></g><text x="565" y="164" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111111">R shunt</text><path d="M510 276H620" stroke="#111111" stroke-width="1.5"></path><circle cx="565" cy="276" r="3.5" fill="#111111"></circle><path d="M565 276V330" stroke="#111111" stroke-width="1.5" stroke-dasharray="4 3"></path><g><path d="M559 330h12v10h-12z" fill="#111111"></path></g><text x="581" y="340" font-size="11.5" fill="#111111">both ground clips on GND</text><text x="404" y="376" font-size="11.5" fill="#111111">Math F1 = C1 − C2 = I × R. Ground stays ground for</text><text x="404" y="392" font-size="11.5" fill="#111111">every probe. Zero F1 with the load unplugged; set both</text><text x="404" y="408" font-size="11.5" fill="#111111">channels to the same small V/div with offset −5 V.</text><rect x="24" y="428" width="712" height="30" rx="6" fill="#ececec"></rect><text x="380" y="448" text-anchor="middle" font-size="11.5" fill="#111111">Lesson 6 uses the high side: a 1 Ω shunt in the VBUS wire of a USB lead.</text></svg>
