<svg viewBox="0 0 760 470" role="img" aria-label="Where to probe the MOSFET driver" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><text x="24" y="30" font-size="15" font-weight="600" fill="#111111">Where to probe the MOSFET driver</text><text x="24" y="50" font-size="11.5" fill="#444444">The ESP32 course circuit with a 0.1 Ω shunt added under the source. All ground clips on GND</text><g fill="none" stroke="#111111" stroke-width="1.5"><path d="M200 90H320V130"></path><path d="M200 90V120"></path><path d="M200 170V220"></path><path d="M200 104H260V124"></path><path d="M260 144V196H200"></path><path d="M60 250H100"></path><path d="M140 250H178"></path><path d="M200 280V300"></path><path d="M200 340V380"></path><path d="M320 180V380H40"></path></g><circle cx="200" cy="145" r="22" fill="#ffffff" stroke="#111111" stroke-width="1.5"></circle><text x="200" y="150" text-anchor="middle" font-weight="600" fill="#111111">M</text><polygon points="248,144 272,144 260,124" fill="none" stroke="#111111" stroke-width="1.5"></polygon><line x1="246" x2="274" y1="122" y2="122" stroke="#111111" stroke-width="2.5"></line><text x="280" y="118" font-size="11.5" fill="#111111">D1</text><rect x="290" y="130" width="60" height="50" rx="4" fill="#ececec" stroke="#111111" stroke-width="1.5"></rect><text x="320" y="160" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111111">12 V</text><rect x="100" y="242" width="40" height="16" fill="#ffffff" stroke="#111111" stroke-width="1.5"></rect><text x="120" y="234" text-anchor="middle" font-size="11.5" fill="#111111">R1 100 Ω</text><text x="56" y="254" text-anchor="end" font-size="11.5" fill="#111111">GPIO19</text><g stroke="#111111" fill="none"><line x1="178" x2="178" y1="226" y2="274" stroke-width="2"></line><line x1="188" x2="188" y1="222" y2="278" stroke-width="2.5"></line><path d="M188 230H200V220M188 270H200V280" stroke-width="1.5"></path></g><text x="206" y="256" font-size="11.5" fill="#111111">Q1</text><rect x="192" y="300" width="16" height="40" fill="#ffffff" stroke="#111111" stroke-width="1.5"></rect><text x="214" y="324" font-size="11.5" fill="#111111">0.1 Ω shunt</text><g stroke="#111111" stroke-width="1.5"><line x1="168" x2="192" y1="380" y2="380"></line><line x1="172" x2="188" y1="385" y2="385"></line><line x1="176" x2="184" y1="390" y2="390"></line></g><circle cx="160" cy="250" r="3.5" fill="#111111"></circle><circle cx="200" cy="210" r="3.5" fill="#111111"></circle><circle cx="200" cy="290" r="3.5" fill="#111111"></circle><g><path d="M160 250L182 242L182 258z" fill="#111111"></path><text x="188" y="254" text-anchor="start" font-size="11.5" font-weight="600" fill="#111111"></text></g><text x="150" y="286" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111111">CH1 gate</text><path d="M160 250V272" stroke="#111111" stroke-width="1" stroke-dasharray="3 2"></path><g><path d="M200 210L178 202L178 218z" fill="#111111"></path><text x="172" y="214" text-anchor="end" font-size="11.5" font-weight="600" fill="#111111">CH2 drain</text></g><g><path d="M200 290L222 282L222 298z" fill="#111111"></path><text x="228" y="294" text-anchor="start" font-size="11.5" font-weight="600" fill="#111111">CH3 current</text></g><text x="440" y="92" font-weight="600" fill="#111111">At turn-off</text><text x="440" y="126" font-size="11.5" fill="#111111">CH1 gate</text><path d="M440 140H520V170H720" fill="none" stroke="#111111" stroke-width="2"></path><text x="440" y="206" font-size="11.5" fill="#111111">CH2 drain, with D1: clamped near 12.5 V</text><path d="M440 270H522L526 236H720" fill="none" stroke="#111111" stroke-width="2"></path><text x="440" y="306" font-size="11.5" fill="#111111">CH2 drain, without D1: a spike, flat-topped</text><text x="440" y="322" font-size="11.5" fill="#111111">at the MOSFET's breakdown voltage</text><path d="M440 410H522L526 340H560L568 376H720" fill="none" stroke="#111111" stroke-width="2"></path><line x1="440" x2="720" y1="376" y2="376" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="4 4"></line><text x="724" y="380" font-size="11" fill="#444444">12 V</text><text x="24" y="452" font-size="11.5" fill="#111111">CH3 shows the shunt voltage: 10 mA per mV. Remove D1 only for single switching events, and put it back at once.</text></svg>
