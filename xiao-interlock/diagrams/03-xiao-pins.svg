<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 462" role="img" aria-label="XIAO RP2040 pins as used in this course" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><text x="24" y="30" font-size="15" font-weight="600" fill="#111111">XIAO RP2040 pins in this course</text><text x="24" y="50" font-size="11.5" fill="#444444">Top view, USB-C at the top. Labels on the board, GPIO numbers for the sketches. 3.3 V logic, not 5 V tolerant</text><rect x="300" y="80" width="160" height="300" rx="14" fill="#ececec" stroke="#111111" stroke-width="2"></rect><rect x="355" y="68" width="50" height="24" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.5"></rect><text x="380" y="84" text-anchor="middle" font-size="10.5" fill="#111111">USB-C</text><text x="380" y="103" text-anchor="middle" font-size="10.5" font-weight="600" fill="#111111">XIAO RP2040</text><g><circle cx="314" cy="120" r="7" fill="#ffffff" stroke="#111111" stroke-width="1.5"></circle><text x="328" y="124" font-size="11.5" font-weight="600" fill="#111111">D0</text><text x="290" y="124" text-anchor="end" font-size="11" fill="#111111">GPIO26  A0</text></g><g><circle cx="314" cy="158" r="7" fill="#ffffff" stroke="#111111" stroke-width="1.5"></circle><text x="328" y="162" font-size="11.5" font-weight="600" fill="#111111">D1</text><text x="290" y="162" text-anchor="end" font-size="11" fill="#111111">GPIO27  A1</text><g><rect x="24" y="147" width="120" height="22" rx="4" fill="#111111"></rect><text x="84" y="162" text-anchor="middle" font-size="11.5" font-weight="600" fill="#ffffff">ARM</text><line x1="144" x2="196" y1="158" y2="158" stroke="#111111" stroke-width="1.2"></line></g></g><g><circle cx="314" cy="196" r="7" fill="#ffffff" stroke="#111111" stroke-width="1.5"></circle><text x="328" y="200" font-size="11.5" font-weight="600" fill="#111111">D2</text><text x="290" y="200" text-anchor="end" font-size="11" fill="#111111">GPIO28  A2</text><g><rect x="24" y="185" width="120" height="22" rx="4" fill="#111111"></rect><text x="84" y="200" text-anchor="middle" font-size="11.5" font-weight="600" fill="#ffffff">FIRE</text><line x1="144" x2="196" y1="196" y2="196" stroke="#111111" stroke-width="1.2"></line></g></g><g><circle cx="314" cy="234" r="7" fill="#ffffff" stroke="#111111" stroke-width="1.5"></circle><text x="328" y="238" font-size="11.5" font-weight="600" fill="#111111">D3</text><text x="290" y="238" text-anchor="end" font-size="11" fill="#111111">GPIO29  A3</text><g><rect x="24" y="223" width="120" height="22" rx="4" fill="#111111"></rect><text x="84" y="238" text-anchor="middle" font-size="11.5" font-weight="600" fill="#ffffff">drain sense</text><line x1="144" x2="196" y1="234" y2="234" stroke="#111111" stroke-width="1.2"></line></g></g><g><circle cx="314" cy="272" r="7" fill="#ffffff" stroke="#111111" stroke-width="1.5"></circle><text x="328" y="276" font-size="11.5" font-weight="600" fill="#111111">D4</text><text x="290" y="276" text-anchor="end" font-size="11" fill="#111111">GPIO6  SDA</text></g><g><circle cx="314" cy="310" r="7" fill="#ffffff" stroke="#111111" stroke-width="1.5"></circle><text x="328" y="314" font-size="11.5" font-weight="600" fill="#111111">D5</text><text x="290" y="314" text-anchor="end" font-size="11" fill="#111111">GPIO7  SCL</text></g><g><circle cx="314" cy="348" r="7" fill="#ffffff" stroke="#111111" stroke-width="1.5"></circle><text x="328" y="352" font-size="11.5" font-weight="600" fill="#111111">D6</text><text x="290" y="352" text-anchor="end" font-size="11" fill="#111111">GPIO0  TX</text></g><g><circle cx="446" cy="120" r="7" fill="#ffffff" stroke="#111111" stroke-width="1.5"></circle><text x="432" y="124" text-anchor="end" font-size="11.5" font-weight="600" fill="#111111">5V</text></g><g><circle cx="446" cy="158" r="7" fill="#ffffff" stroke="#111111" stroke-width="1.5"></circle><text x="432" y="162" text-anchor="end" font-size="11.5" font-weight="600" fill="#111111">GND</text></g><g><circle cx="446" cy="196" r="7" fill="#ffffff" stroke="#111111" stroke-width="1.5"></circle><text x="432" y="200" text-anchor="end" font-size="11.5" font-weight="600" fill="#111111">3V3</text></g><g><circle cx="446" cy="234" r="7" fill="#ffffff" stroke="#111111" stroke-width="1.5"></circle><text x="432" y="238" text-anchor="end" font-size="11.5" font-weight="600" fill="#111111">D10</text><text x="470" y="238" font-size="11" fill="#111111">GPIO3  MOSI</text><g><line x1="584" x2="616" y1="234" y2="234" stroke="#111111" stroke-width="1.2"></line><rect x="616" y="223" width="120" height="22" rx="4" fill="#111111"></rect><text x="676" y="238" text-anchor="middle" font-size="11.5" font-weight="600" fill="#ffffff">RING</text></g></g><g><circle cx="446" cy="272" r="7" fill="#ffffff" stroke="#111111" stroke-width="1.5"></circle><text x="432" y="276" text-anchor="end" font-size="11.5" font-weight="600" fill="#111111">D9</text><text x="470" y="276" font-size="11" fill="#111111">GPIO4  MISO</text></g><g><circle cx="446" cy="310" r="7" fill="#ffffff" stroke="#111111" stroke-width="1.5"></circle><text x="432" y="314" text-anchor="end" font-size="11.5" font-weight="600" fill="#111111">D8</text><text x="470" y="314" font-size="11" fill="#111111">GPIO2  SCK</text></g><g><circle cx="446" cy="348" r="7" fill="#ffffff" stroke="#111111" stroke-width="1.5"></circle><text x="432" y="352" text-anchor="end" font-size="11.5" font-weight="600" fill="#111111">D7</text><text x="470" y="352" font-size="11" fill="#111111">GPIO1  RX</text><g><line x1="584" x2="616" y1="348" y2="348" stroke="#111111" stroke-width="1.2"></line><rect x="616" y="337" width="120" height="22" rx="4" fill="#111111"></rect><text x="676" y="352" text-anchor="middle" font-size="11.5" font-weight="600" fill="#ffffff">CHAIN</text></g></g><text x="24" y="408" font-size="11.5" fill="#111111">ARM and CHAIN arrive through 12 V dividers; FIRE drives the MOSFET module; RING goes through the 74AHCT125.</text><text x="24" y="426" font-size="11.5" fill="#111111">Onboard: B (boot) and R (reset) buttons; RGB LED on GPIO 17, 16, 25 (on when LOW); pixel on GPIO 12, its power on GPIO 11.</text><text x="24" y="444" font-size="11.5" fill="#444444">D7 is also the UART RX pin: do not start Serial1. Serial is USB.</text></svg>
