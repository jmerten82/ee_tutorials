<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 470" role="img" aria-label="The controller state machine" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><defs><marker id="xi-sm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111111"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#111111">States and transitions</text><text x="24" y="50" font-size="11.5" fill="#444444">The output is on only in FIRING. Every arrow is checked once per loop, in well under a millisecond</text><g><rect x="60" y="120" width="140" height="60" rx="30" fill="#ececec" stroke="#111111" stroke-width="2"></rect><text x="130" y="148" text-anchor="middle" font-size="14" font-weight="600" fill="#111111">SAFE</text><text x="130" y="165" text-anchor="middle" font-size="10.5" fill="#444444">output off</text></g><g><rect x="330" y="120" width="140" height="60" rx="30" fill="#ececec" stroke="#111111" stroke-width="2"></rect><text x="400" y="148" text-anchor="middle" font-size="14" font-weight="600" fill="#111111">ARMED</text><text x="400" y="165" text-anchor="middle" font-size="10.5" fill="#444444">output off</text></g><g><rect x="570" y="120" width="140" height="60" rx="30" fill="#111111" stroke="#111111" stroke-width="2"></rect><text x="640" y="148" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">FIRING</text><text x="640" y="165" text-anchor="middle" font-size="10.5" fill="#ffffff">output ON</text></g><g><rect x="330" y="330" width="140" height="60" rx="30" fill="#ececec" stroke="#111111" stroke-width="2"></rect><text x="400" y="358" text-anchor="middle" font-size="14" font-weight="600" fill="#111111">FAULT</text><text x="400" y="375" text-anchor="middle" font-size="10.5" fill="#444444">output off, latched</text></g><g><path d="M200 140H330" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#xi-sm-arrow)"></path><text x="265" y="130" text-anchor="middle" font-size="11" fill="#111111">interlock closed 0.5 s</text></g><text x="265" y="112" text-anchor="middle" font-size="11" fill="#111111">and host alive</text><g><path d="M330 166H200" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#xi-sm-arrow)"></path><text x="265" y="186" text-anchor="middle" font-size="11" fill="#111111">interlock open or host lost</text></g><g><path d="M470 140H570" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#xi-sm-arrow)"></path><text x="520" y="130" text-anchor="middle" font-size="11" fill="#111111">FIRE &lt;ms&gt;</text></g><text x="520" y="112" text-anchor="middle" font-size="11" fill="#444444">re-arm time over</text><g><path d="M570 166H470" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#xi-sm-arrow)"></path><text x="520" y="186" text-anchor="middle" font-size="11" fill="#111111">time up or STOP</text></g><g><path d="M640 120C640 64 130 64 130 118" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#xi-sm-arrow)"></path><text x="385" y="72" text-anchor="middle" font-size="11" fill="#111111">interlock open or host lost</text></g><g><path d="M400 180V330" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#xi-sm-arrow)"></path><text x="0" y="0" text-anchor="middle" font-size="11" fill="#111111"></text></g><g><path d="M150 180C170 290 280 340 330 352" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#xi-sm-arrow)"></path><text x="0" y="0" text-anchor="middle" font-size="11" fill="#111111"></text></g><g><path d="M620 182C600 290 520 340 470 352" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#xi-sm-arrow)"></path><text x="0" y="0" text-anchor="middle" font-size="11" fill="#111111"></text></g><text x="408" y="290" font-size="11" fill="#111111">ARM and CHAIN disagree</text><text x="408" y="305" font-size="11" fill="#111111">longer than 50 ms</text><g><path d="M330 375C200 390 110 300 118 182" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#xi-sm-arrow)"></path><text x="0" y="0" text-anchor="middle" font-size="11" fill="#111111"></text></g><text x="120" y="400" font-size="11" fill="#111111">CLEAR with the key off</text><text x="120" y="415" font-size="11" fill="#444444">(a person looked first)</text><path d="M24 150H58" stroke="#111111" stroke-width="1.5" marker-end="url(#xi-sm-arrow)"></path><text x="24" y="140" font-size="11" fill="#111111">boot</text><text x="24" y="452" font-size="11.5" fill="#111111">Limits: pulse 1 to 500 ms, ended by time; no new pulse within 2 s of the last; heartbeat timeout 1 s; watchdog 0.5 s.</text></svg>
