<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 440" role="img" aria-label="The 12 V divider for ARM and CHAIN" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><text x="24" y="30" font-size="15" font-weight="700" fill="#000000">The divider: 12 V in, under 3.3 V out</text><text x="24" y="50" font-size="12.5" fill="#000000">22 kΩ + 10 kΩ on top, 10 kΩ to GND: the pin sees 10 / 42 of the input. Same circuit for ARM and CHAIN</text><circle cx="120" cy="90" r="4" fill="#000000"></circle><text x="132" y="94" font-size="12" font-weight="700" fill="#000000">12 V rail or coil feed</text><path d="M120 94V110" stroke="#000000" stroke-width="2.25"></path><g><rect x="112" y="110" width="16" height="40" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><text x="136" y="134" font-size="12" font-weight="700" fill="#000000">22 kΩ</text></g><path d="M120 150V160" stroke="#000000" stroke-width="2.25"></path><g><rect x="112" y="160" width="16" height="40" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><text x="136" y="184" font-size="12" font-weight="700" fill="#000000">10 kΩ</text></g><path d="M120 200V230" stroke="#000000" stroke-width="2.25"></path><circle cx="120" cy="215" r="3.5" fill="#000000"></circle><path d="M120 215H230" stroke="#000000" stroke-width="2.25"></path><rect x="230" y="203" width="90" height="24" rx="4" fill="#dedede" stroke="#000000" stroke-width="2.25"></rect><text x="275" y="219" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">XIAO pin</text><text x="175" y="207" text-anchor="middle" font-size="12.5" fill="#000000">2.86 V</text><g><rect x="112" y="230" width="16" height="40" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><text x="136" y="254" font-size="12" font-weight="700" fill="#000000">10 kΩ</text></g><path d="M120 270V290" stroke="#000000" stroke-width="2.25"></path><g stroke="#000000" stroke-width="2.25"><line x1="108" x2="132" y1="290" y2="290"></line><line x1="112" x2="128" y1="295" y2="295"></line><line x1="116" x2="124" y1="300" y2="300"></line></g><text x="24" y="336" font-size="12.5" fill="#000000">Current: 12 V / 42 kΩ = 0.29 mA</text><text x="24" y="354" font-size="12.5" fill="#000000">Two resistors on top: one shorted still</text><text x="24" y="370" font-size="12.5" fill="#000000">leaves 10 kΩ to limit the current.</text><rect x="380" y="129" width="342" height="91" fill="#dedede"></rect><line x1="380" x2="722" y1="129" y2="129" stroke="#000000" stroke-width="1.8" stroke-dasharray="6 4"></line><text x="726" y="133" font-size="12.5" fill="#000000">3.3 V</text><line x1="380" x2="722" y1="220" y2="220" stroke="#000000" stroke-width="1.5" stroke-dasharray="2 3"></line><text x="726" y="224" font-size="12.5" fill="#000000">2 V</text><text x="386" y="145" font-size="12.5" fill="#000000">reads HIGH safely</text><line x1="380" x2="380" y1="94" y2="360" stroke="#000000" stroke-width="1.8"></line><line x1="380" x2="722" y1="360" y2="360" stroke="#000000" stroke-width="1.8"></line><g><rect x="413" y="210" width="24" height="150" fill="#000000" stroke="#000000" stroke-width="2.25"></rect><text x="425" y="204" text-anchor="middle" font-size="12.5" font-weight="700" fill="#000000">2.14</text><text x="425" y="376" text-anchor="middle" font-size="12.5" fill="#000000">9 V</text></g><g><rect x="503" y="176.66666666666666" width="24" height="183.33333333333334" fill="#000000" stroke="#000000" stroke-width="2.25"></rect><text x="515" y="170.66666666666666" text-anchor="middle" font-size="12.5" font-weight="700" fill="#000000">2.62</text><text x="515" y="376" text-anchor="middle" font-size="12.5" fill="#000000">11 V</text></g><g><rect x="548" y="160" width="24" height="200" fill="#000000" stroke="#000000" stroke-width="2.25"></rect><text x="560" y="154" text-anchor="middle" font-size="12.5" font-weight="700" fill="#000000">2.86</text><text x="560" y="376" text-anchor="middle" font-size="12.5" fill="#000000">12 V</text></g><g><rect x="629" y="130" width="24" height="230" fill="#000000" stroke="#000000" stroke-width="2.25"></rect><text x="641" y="124" text-anchor="middle" font-size="12.5" font-weight="700" fill="#000000">3.29</text><text x="641" y="376" text-anchor="middle" font-size="12.5" fill="#000000">13.8 V</text></g><g><rect x="683" y="110" width="24" height="250" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><text x="695" y="104" text-anchor="middle" font-size="12.5" font-weight="700" fill="#000000">3.57</text><text x="695" y="376" text-anchor="middle" font-size="12.5" fill="#000000">15 V</text></g><text x="537.5" y="394" text-anchor="middle" font-size="12.5" fill="#000000">input voltage → pin voltage</text><text x="24" y="410" font-size="12.5" fill="#000000">Above 13.8 V the pin exceeds 3.3 V (open bar): if your supply can run that high, use 8.2 kΩ at the bottom.</text><text x="24" y="428" font-size="12.5" fill="#000000">Measure every divider output with the meter before connecting it to the XIAO.</text></svg>
