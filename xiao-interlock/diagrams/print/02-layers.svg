<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 430" role="img" aria-label="Three layers of protection" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><defs><marker id="xi-lay-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#000000"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="700" fill="#000000">Three layers of protection</text><text x="24" y="50" font-size="12.5" fill="#000000">Each layer may refuse what the layer above asks. Only layer 1 can guarantee that nothing fires</text><g><rect x="24" y="70" width="712" height="96" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><circle cx="60" cy="118" r="18" fill="#000000"></circle><text x="60" y="124" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">3</text><text x="96" y="98" font-size="14" font-weight="700" fill="#000000">Host software on the Mac</text><text x="96" y="122" font-size="12" fill="#000000">Decides when to ask for a pulse: FIRE &lt;ms&gt;.</text><text x="96" y="144" font-size="12" fill="#000000">Can crash, hang, lose USB or send nonsense. Trusted least.</text></g><g><rect x="24" y="182" width="712" height="96" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><circle cx="60" cy="230" r="18" fill="#000000"></circle><text x="60" y="236" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">2</text><text x="96" y="210" font-size="14" font-weight="700" fill="#000000">Controller firmware on the XIAO</text><text x="96" y="234" font-size="12" fill="#000000">Fires only when ARM and CHAIN agree, for a bounded time, with a live host. Watchdog.</text><text x="96" y="256" font-size="12" fill="#000000">Cannot cut the rail. A bug can set the output high, which is harmless only because of layer 1.</text></g><g><rect x="24" y="294" width="712" height="96" rx="8" fill="#dedede" stroke="#000000" stroke-width="3.75"></rect><circle cx="60" cy="342" r="18" fill="#000000"></circle><text x="60" y="348" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">1</text><text x="96" y="322" font-size="14" font-weight="700" fill="#000000">Hardware interlock: key, E-stop, relay</text><text x="96" y="346" font-size="12" fill="#000000">No key or E-stop pressed: no coil current, no rail, no energy at the actuator.</text><text x="96" y="368" font-size="12" fill="#000000">Fails only through a welded contact or a defeated switch: test it every session.</text></g><path d="M700 166V182" stroke="#000000" stroke-width="2.25" marker-end="url(#xi-lay-arrow)"></path><path d="M700 278V294" stroke="#000000" stroke-width="2.25" marker-end="url(#xi-lay-arrow)"></path><text x="24" y="418" font-size="12.5" fill="#000000">Never let a higher layer bypass a lower one: no jumper across the key, no "test mode" that ignores ARM and CHAIN.</text></svg>
