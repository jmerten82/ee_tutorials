<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 420" role="img" aria-label="The fire output stays off in every phase except FIRING" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><text x="24" y="30" font-size="15" font-weight="700" fill="#000000">A fail-safe output: off unless the sketch says FIRING</text><text x="24" y="50" font-size="12.5" fill="#000000">D2 → 330 Ω → module input, 10 kΩ from the input to GND. The resistor holds the gate low when nothing drives it</text><g><rect x="60" y="80" width="80" height="56" fill="#ffffff" stroke="#000000" stroke-width="1.5"></rect><text x="100" y="103" text-anchor="middle" font-size="12.5" font-weight="700" fill="#000000">power off</text><text x="100" y="122" text-anchor="middle" font-size="12.5" fill="#000000">no supply</text></g><g><rect x="140" y="80" width="100" height="56" fill="#dedede" stroke="#000000" stroke-width="1.5"></rect><text x="190" y="103" text-anchor="middle" font-size="12.5" font-weight="700" fill="#000000">boot</text><text x="190" y="122" text-anchor="middle" font-size="12.5" fill="#000000">pins are inputs</text></g><g><rect x="240" y="80" width="160" height="56" fill="#ffffff" stroke="#000000" stroke-width="1.5"></rect><text x="320" y="103" text-anchor="middle" font-size="12.5" font-weight="700" fill="#000000">running SAFE / ARMED</text><text x="320" y="122" text-anchor="middle" font-size="12.5" fill="#000000">sketch drives LOW</text></g><g><rect x="400" y="80" width="50" height="56" fill="#000000" stroke="#000000" stroke-width="1.5"></rect><text x="425" y="103" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">FIRING</text><text x="425" y="122" text-anchor="middle" font-size="12.5" fill="#ffffff">HIGH</text></g><g><rect x="450" y="80" width="90" height="56" fill="#ffffff" stroke="#000000" stroke-width="1.5"></rect><text x="495" y="103" text-anchor="middle" font-size="12.5" font-weight="700" fill="#000000">ARMED</text><text x="495" y="122" text-anchor="middle" font-size="12.5" fill="#000000">LOW</text></g><g><rect x="540" y="80" width="100" height="56" fill="#dedede" stroke="#000000" stroke-width="1.5"></rect><text x="590" y="103" text-anchor="middle" font-size="12.5" font-weight="700" fill="#000000">upload or reset</text><text x="590" y="122" text-anchor="middle" font-size="12.5" fill="#000000">pins are inputs</text></g><g><rect x="640" y="80" width="90" height="56" fill="#ffffff" stroke="#000000" stroke-width="1.5"></rect><text x="685" y="103" text-anchor="middle" font-size="12.5" font-weight="700" fill="#000000">running</text><text x="685" y="122" text-anchor="middle" font-size="12.5" fill="#000000">LOW</text></g><text x="52" y="180" text-anchor="end" font-size="12.5" font-weight="700" fill="#000000">D2 pin</text><path d="M60 210H140" stroke="#000000" stroke-width="3"></path><path d="M140 190H240" stroke="#000000" stroke-width="3" stroke-dasharray="4 4"></path><text x="190" y="182" text-anchor="middle" font-size="12.5" fill="#000000">floating</text><path d="M240 210H400V170H450V210H540" fill="none" stroke="#000000" stroke-width="3"></path><path d="M540 190H640" stroke="#000000" stroke-width="3" stroke-dasharray="4 4"></path><text x="590" y="182" text-anchor="middle" font-size="12.5" fill="#000000">floating</text><path d="M640 210H730" stroke="#000000" stroke-width="3"></path><text x="52" y="270" text-anchor="end" font-size="12.5" font-weight="700" fill="#000000">gate</text><text x="52" y="284" text-anchor="end" font-size="12.5" fill="#000000">with</text><text x="52" y="296" text-anchor="end" font-size="12.5" fill="#000000">10 kΩ</text><path d="M60 300H400V260H450V300H730" fill="none" stroke="#000000" stroke-width="3.75"></path><line x1="60" x2="730" y1="301" y2="301" stroke="#000000" stroke-width="1.5"></line><text x="425" y="320" text-anchor="middle" font-size="12.5" fill="#000000">the only pulse</text><text x="24" y="360" font-size="12.5" fill="#000000">In code: digitalWrite(FIRE_PIN, LOW) before pinMode(FIRE_PIN, OUTPUT), so the pin never drives HIGH by accident.</text><text x="24" y="378" font-size="12.5" fill="#000000">Check it on the scope: Normal trigger on the gate, then power-cycle, reset and upload. The scope must stay silent.</text><text x="24" y="404" font-size="12.5" fill="#000000">Illustration, not to scale.</text></svg>
