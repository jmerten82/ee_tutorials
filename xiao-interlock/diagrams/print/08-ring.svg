<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 470" role="img" aria-label="Ring wiring through the 74AHCT125" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><text x="24" y="30" font-size="15" font-weight="700" fill="#000000">The status ring: 3.3 V data, 5 V pixels</text><text x="24" y="50" font-size="12.5" fill="#000000">One buffer of the 74AHCT125 accepts 3.3 V as HIGH and drives a full 5 V signal. Pin numbers for the DIP-14 part</text><rect x="24" y="150" width="120" height="60" rx="6" fill="#dedede" stroke="#000000" stroke-width="2.25"></rect><text x="84" y="176" text-anchor="middle" font-weight="700" fill="#000000">XIAO</text><text x="84" y="196" text-anchor="middle" font-size="12.5" fill="#000000">D10 (GPIO 3)</text><path d="M144 180H250" stroke="#000000" stroke-width="2.25"></path><text x="196" y="172" text-anchor="middle" font-size="12.5" fill="#000000">3.3 V data</text><text x="244" y="198" text-anchor="end" font-size="12.5" font-weight="700" fill="#000000">pin 2 (1A)</text><polygon points="250,130 250,230 340,180" fill="#dedede" stroke="#000000" stroke-width="3"></polygon><text x="278" y="186" font-size="12.5" font-weight="700" fill="#000000">AHCT</text><path d="M296 106V155" stroke="#000000" stroke-width="2.25"></path><circle cx="296" cy="159" r="4" fill="#ffffff" stroke="#000000" stroke-width="2.25"></circle><text x="304" y="120" font-size="12.5" font-weight="700" fill="#000000">pin 1 (1OE): to GND</text><text x="304" y="134" font-size="12.5" fill="#000000">low enables the buffer</text><text x="296" y="100" text-anchor="middle" font-size="12.5" font-weight="700" fill="#000000">GND</text><path d="M340 180H440" stroke="#000000" stroke-width="2.25"></path><text x="346" y="198" font-size="12.5" font-weight="700" fill="#000000">pin 3 (1Y)</text><text x="390" y="172" text-anchor="middle" font-size="12.5" fill="#000000">5 V data</text><rect x="440" y="172" width="44" height="16" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><text x="462" y="166" text-anchor="middle" font-size="12.5" font-weight="700" fill="#000000">330 Ω</text><path d="M484 180H540" stroke="#000000" stroke-width="2.25"></path><text x="536" y="198" text-anchor="end" font-size="12.5" fill="#000000">DIN</text><circle cx="600" cy="180" r="60" fill="none" stroke="#000000" stroke-width="3"></circle><rect x="655" y="175" width="10" height="10" fill="#dedede" stroke="#000000" stroke-width="1.5"></rect><rect x="646.9615242270663" y="205" width="10" height="10" fill="#dedede" stroke="#000000" stroke-width="1.5"></rect><rect x="625" y="226.96152422706632" width="10" height="10" fill="#dedede" stroke="#000000" stroke-width="1.5"></rect><rect x="595" y="235" width="10" height="10" fill="#dedede" stroke="#000000" stroke-width="1.5"></rect><rect x="565" y="226.96152422706632" width="10" height="10" fill="#dedede" stroke="#000000" stroke-width="1.5"></rect><rect x="543.0384757729337" y="205" width="10" height="10" fill="#dedede" stroke="#000000" stroke-width="1.5"></rect><rect x="535" y="175" width="10" height="10" fill="#dedede" stroke="#000000" stroke-width="1.5"></rect><rect x="543.0384757729337" y="145" width="10" height="10" fill="#dedede" stroke="#000000" stroke-width="1.5"></rect><rect x="565" y="123.03847577293368" width="10" height="10" fill="#dedede" stroke="#000000" stroke-width="1.5"></rect><rect x="595" y="115" width="10" height="10" fill="#dedede" stroke="#000000" stroke-width="1.5"></rect><rect x="625" y="123.03847577293368" width="10" height="10" fill="#dedede" stroke="#000000" stroke-width="1.5"></rect><rect x="646.9615242270663" y="144.99999999999997" width="10" height="10" fill="#dedede" stroke="#000000" stroke-width="1.5"></rect><text x="600" y="176" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">WS2812</text><text x="600" y="192" text-anchor="middle" font-size="12.5" fill="#000000">ring</text><path d="M660 150H720V280" fill="none" stroke="#000000" stroke-width="2.25"></path><path d="M660 210H700V300" fill="none" stroke="#000000" stroke-width="2.25"></path><text x="724" y="160" font-size="12.5" fill="#000000">5V</text><text x="696" y="250" text-anchor="end" font-size="12.5" fill="#000000">GND</text><rect x="560" y="280" width="176" height="46" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><text x="648" y="299" text-anchor="middle" font-size="12.5" font-weight="700" fill="#000000">5 V buck, not the XIAO</text><text x="648" y="316" text-anchor="middle" font-size="12.5" fill="#000000">1000 µF across 5 V and GND</text><rect x="24" y="262" width="500" height="120" rx="6" fill="#dedede"></rect><text x="36" y="284" font-size="12" font-weight="700" fill="#000000">74AHCT125, DIP-14: every pin</text><text x="36" y="304" font-size="12.5" fill="#000000">14 VCC to 5 V, 7 GND to GND, 100 nF from 14 to 7 next to the chip</text><text x="36" y="322" font-size="12.5" fill="#000000">1 (1OE) to GND, 2 (1A) from D10, 3 (1Y) to the ring through 330 Ω</text><text x="36" y="340" font-size="12.5" fill="#000000">Unused inputs 5, 9, 12 to GND; unused enables 4, 10, 13 to 5 V</text><text x="36" y="358" font-size="12.5" fill="#000000">Unused outputs 6, 8, 11 left open</text><text x="36" y="374" font-size="12.5" fill="#000000">Check against the pin configuration in your part's datasheet.</text><text x="24" y="414" font-size="12.5" fill="#000000">The 330 Ω goes at the ring's end of the data wire. One common ground for XIAO, chip, ring and 12 V.</text><text x="24" y="434" font-size="12.5" fill="#000000">WS2812 needs a HIGH of about 0.7 × 5 V = 3.5 V: the XIAO's 3.3 V alone is not enough.</text><text x="24" y="454" font-size="12.5" fill="#000000">The ring is an indicator only. A dark ring proves nothing about the state of the fire rail.</text></svg>
