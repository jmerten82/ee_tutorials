<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 480" role="img" aria-label="Tower 2: the hardware interlock and the controller" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><text x="24" y="30" font-size="15" font-weight="600" fill="#111111">Tower 2: the interlock and the controller</text><text x="24" y="50" font-size="11.5" fill="#444444">Only the relay contact can power the fire rail. The XIAO reads the interlock and switches the actuator's low side</text><g><rect x="24" y="76" width="96" height="48" rx="4" fill="#ececec" stroke="#111111" stroke-width="1.5"></rect><text x="72" y="94" text-anchor="middle" font-size="12" font-weight="600" fill="#111111">12 V supply</text><text x="72" y="109" text-anchor="middle" font-size="11" fill="#444444">current limit</text></g><path d="M120 100H150" stroke="#111111" stroke-width="1.5"></path><rect x="150" y="92" width="60" height="16" fill="#ffffff" stroke="#111111" stroke-width="1.5"></rect><text x="180" y="86" text-anchor="middle" font-size="11" fill="#111111">fuse, rocker</text><path d="M210 100H420V128" fill="none" stroke="#111111" stroke-width="1.5"></path><circle cx="260" cy="100" r="3.5" fill="#111111"></circle><path d="M260 100V128" stroke="#111111" stroke-width="1.5"></path><g stroke="#111111" stroke-width="1.8" fill="none"><circle cx="260" cy="131" r="3" fill="#ffffff"></circle><circle cx="260" cy="159" r="3" fill="#ffffff"></circle><path d="M260 134L262 156"></path></g><text x="272" y="150" font-size="11.5" fill="#111111">E-stop (NC)</text><path d="M260 162V176" stroke="#111111" stroke-width="1.5"></path><g stroke="#111111" stroke-width="1.8" fill="none"><circle cx="260" cy="179" r="3" fill="#ffffff"></circle><circle cx="260" cy="207" r="3" fill="#ffffff"></circle><path d="M260 182L274 201"></path></g><text x="280" y="198" font-size="11.5" fill="#111111">key</text><path d="M260 210V250" stroke="#111111" stroke-width="1.5"></path><circle cx="260" cy="215" r="3.5" fill="#111111"></circle><text x="206" y="219" text-anchor="end" font-size="11.5" font-weight="600" fill="#111111">coil feed</text><path d="M230 215H260" stroke="#111111" stroke-width="1" stroke-dasharray="3 2"></path><rect x="244" y="250" width="32" height="40" fill="#ececec" stroke="#111111" stroke-width="1.5"></rect><text x="236" y="266" text-anchor="end" font-size="11.5" font-weight="600" fill="#111111">relay coil</text><text x="236" y="281" text-anchor="end" font-size="11" fill="#444444">G5LE, 33 mA</text><path d="M260 290V330" stroke="#111111" stroke-width="1.5"></path><path d="M260 240H300V300H260" fill="none" stroke="#111111" stroke-width="1.2"></path><polygon points="292,276 308,276 300,262" fill="none" stroke="#111111" stroke-width="1.5"></polygon><line x1="290" x2="310" y1="261" y2="261" stroke="#111111" stroke-width="2"></line><text x="312" y="290" font-size="10.5" fill="#444444">1N4007</text><g stroke="#111111" stroke-width="1.5"><line x1="248" x2="272" y1="330" y2="330"></line><line x1="252" x2="268" y1="335" y2="335"></line><line x1="256" x2="264" y1="340" y2="340"></line></g><path d="M276 270C330 270 370 200 412 146" fill="none" stroke="#111111" stroke-width="1" stroke-dasharray="4 3"></path><g stroke="#111111" stroke-width="1.8" fill="none"><circle cx="420" cy="131" r="3" fill="#ffffff"></circle><circle cx="420" cy="159" r="3" fill="#ffffff"></circle><path d="M420 134L434 153"></path></g><text x="438" y="138" font-size="11.5" fill="#111111">relay contact</text><path d="M420 162V230" stroke="#111111" stroke-width="2.5"></path><circle cx="420" cy="190" r="3.5" fill="#111111"></circle><text x="430" y="181" font-size="11.5" font-weight="600" fill="#111111">fire rail</text><g><rect x="380" y="230" width="80" height="40" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.5"></rect><text x="420" y="248" text-anchor="middle" font-size="12" font-weight="600" fill="#111111">actuator</text><text x="420" y="263" text-anchor="middle" font-size="11" fill="#444444">dummy load</text></g><path d="M420 270V300" stroke="#111111" stroke-width="1.5"></path><g><rect x="370" y="300" width="100" height="44" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.5"></rect><text x="420" y="318" text-anchor="middle" font-size="12" font-weight="600" fill="#111111">MOSFET</text><text x="420" y="333" text-anchor="middle" font-size="11" fill="#444444">module</text></g><path d="M420 344V370" stroke="#111111" stroke-width="1.5"></path><g stroke="#111111" stroke-width="1.5"><line x1="408" x2="432" y1="370" y2="370"></line><line x1="412" x2="428" y1="375" y2="375"></line><line x1="416" x2="424" y1="380" y2="380"></line></g><path d="M420 190H490" stroke="#111111" stroke-width="1.2"></path><path d="M260 215H412A8 8 0 0 1 428 215H490" fill="none" stroke="#111111" stroke-width="1.2"></path><g><rect x="490" y="182" width="60" height="16" fill="#ffffff" stroke="#111111" stroke-width="1.2"></rect><text x="520" y="194" text-anchor="middle" font-size="10.5" fill="#111111">÷ 4.2</text><path d="M550 190H600" stroke="#111111" stroke-width="1.2"></path></g><g><rect x="490" y="207" width="60" height="16" fill="#ffffff" stroke="#111111" stroke-width="1.2"></rect><text x="520" y="219" text-anchor="middle" font-size="10.5" fill="#111111">÷ 4.2</text><path d="M550 215H600" stroke="#111111" stroke-width="1.2"></path></g><text x="520" y="240" text-anchor="middle" font-size="10.5" fill="#444444">dividers</text><rect x="600" y="160" width="136" height="220" rx="6" fill="#ececec" stroke="#111111" stroke-width="1.5"></rect><text x="668" y="262" text-anchor="middle" font-weight="600" fill="#111111">XIAO</text><text x="668" y="278" text-anchor="middle" font-weight="600" fill="#111111">RP2040</text><text x="608" y="194" font-size="11.5" fill="#111111">D1 ARM</text><text x="608" y="219" font-size="11.5" fill="#111111">D7 CHAIN</text><text x="608" y="326" font-size="11.5" fill="#111111">D2 FIRE</text><text x="608" y="362" font-size="11.5" fill="#111111">D10 RING</text><path d="M600 322H470" stroke="#111111" stroke-width="1.2"></path><text x="535" y="316" text-anchor="middle" font-size="10.5" fill="#444444">10 kΩ pull-down</text><path d="M600 358H580V420" fill="none" stroke="#111111" stroke-width="1.2"></path><g><rect x="500" y="420" width="160" height="40" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.5"></rect><text x="580" y="438" text-anchor="middle" font-size="12" font-weight="600" fill="#111111">74AHCT125 → ring</text><text x="580" y="453" text-anchor="middle" font-size="11" fill="#444444">5 V status ring</text></g><path d="M668 160V128" stroke="#111111" stroke-width="1.2"></path><g><rect x="620" y="76" width="96" height="52" rx="4" fill="#ececec" stroke="#111111" stroke-width="1.5"></rect><text x="668" y="94" text-anchor="middle" font-size="12" font-weight="600" fill="#111111">Mac</text><text x="668" y="109" text-anchor="middle" font-size="11" fill="#444444">USB: host</text></g><text x="24" y="420" font-size="11.5" fill="#111111">Key off or E-stop pressed: no coil current,</text><text x="24" y="436" font-size="11.5" fill="#111111">relay open, fire rail dead. Whatever the</text><text x="24" y="452" font-size="11.5" fill="#111111">XIAO does, the actuator has no energy.</text></svg>
