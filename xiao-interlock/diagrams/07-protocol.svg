<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 500" role="img" aria-label="Commands, replies and the heartbeat" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><defs><marker id="xi-pr-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111111"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#111111">Commands, replies and the heartbeat</text><text x="24" y="50" font-size="11.5" fill="#444444">One line per message, ASCII, newline at the end. Time runs downwards</text><rect x="90" y="64" width="120" height="30" rx="4" fill="#ececec" stroke="#111111" stroke-width="1.5"></rect><text x="150" y="84" text-anchor="middle" font-weight="600" fill="#111111">Mac host</text><rect x="550" y="64" width="120" height="30" rx="4" fill="#ececec" stroke="#111111" stroke-width="1.5"></rect><text x="610" y="84" text-anchor="middle" font-weight="600" fill="#111111">XIAO</text><line x1="150" x2="150" y1="94" y2="470" stroke="#111111" stroke-width="1" stroke-dasharray="4 3"></line><line x1="610" x2="610" y1="94" y2="470" stroke="#111111" stroke-width="1" stroke-dasharray="4 3"></line><g><path d="M150 122H608" stroke="#111111" stroke-width="1.5" marker-end="url(#xi-pr-arrow)"></path><text x="380" y="116" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111111">PING</text><text x="620" y="126" text-anchor="start" font-size="10.5" fill="#444444">every 200 ms</text></g><g><path d="M610 146H152" stroke="#111111" stroke-width="1.5" marker-end="url(#xi-pr-arrow)"></path><text x="380" y="140" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111111">OK PONG SAFE</text></g><g><path d="M610 176H152" stroke="#111111" stroke-width="1.5" marker-end="url(#xi-pr-arrow)"></path><text x="380" y="170" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111111">EVT STATE ARMED ready</text><text x="140" y="180" text-anchor="end" font-size="10.5" fill="#444444">key turned</text></g><g><path d="M150 206H608" stroke="#111111" stroke-width="1.5" marker-end="url(#xi-pr-arrow)"></path><text x="380" y="200" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111111">FIRE 150</text></g><g><path d="M610 230H152" stroke="#111111" stroke-width="1.5" marker-end="url(#xi-pr-arrow)"></path><text x="380" y="224" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111111">OK FIRE 150</text></g><g><path d="M610 254H152" stroke="#111111" stroke-width="1.5" marker-end="url(#xi-pr-arrow)"></path><text x="380" y="248" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111111">EVT STATE FIRING command</text></g><g><path d="M610 284H152" stroke="#111111" stroke-width="1.5" marker-end="url(#xi-pr-arrow)"></path><text x="380" y="278" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111111">EVT STATE ARMED pulse_done</text><text x="140" y="288" text-anchor="end" font-size="10.5" fill="#444444">150 ms later</text></g><g><path d="M150 314H608" stroke="#111111" stroke-width="1.5" marker-end="url(#xi-pr-arrow)"></path><text x="380" y="308" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111111">FIRE 150</text></g><g><path d="M610 338H152" stroke="#111111" stroke-width="1.5" marker-end="url(#xi-pr-arrow)"></path><text x="380" y="332" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111111">ERR REARM</text><text x="140" y="342" text-anchor="end" font-size="10.5" fill="#444444">within 2 s</text></g><g><path d="M150 368H608" stroke="#111111" stroke-width="1.5" marker-end="url(#xi-pr-arrow)"></path><text x="380" y="362" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111111">PING</text><text x="620" y="372" text-anchor="start" font-size="10.5" fill="#444444">last one</text></g><rect x="190" y="384" width="380" height="40" fill="#ececec"></rect><text x="380" y="408" text-anchor="middle" font-size="11.5" fill="#111111">host silent for 1 s: crash, unplugged cable, Mac asleep</text><g><path d="M610 452H152" stroke="#111111" stroke-width="1.5" marker-end="url(#xi-pr-arrow)"></path><text x="380" y="446" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111111">EVT STATE SAFE host_lost</text><text x="140" y="456" text-anchor="end" font-size="10.5" fill="#444444">output off</text></g><text x="24" y="490" font-size="11.5" fill="#111111">The controller never needs the host to be safe; it needs the host only to fire.</text></svg>
