<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 460" role="img" aria-label="Timing to measure when the E-stop is pressed during a pulse" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><defs><marker id="xi-tm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111111"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#111111">E-stop during a pulse: what to measure</text><text x="24" y="50" font-size="11.5" fill="#444444">Single trigger on CH1 falling. Times are examples; your measurement becomes the reference value</text><line x1="160" x2="160" y1="70" y2="350" stroke="#111111" stroke-width="1" stroke-dasharray="6 4"></line><text x="160" y="66" text-anchor="middle" font-size="11" font-weight="600" fill="#111111">trigger</text><g><text x="24" y="102" font-size="12" font-weight="600" fill="#111111">CH1 coil feed</text><text x="24" y="118" font-size="11" fill="#444444">E-stop opens</text><path d="M132 90H160V124H720" fill="none" stroke="#111111" stroke-width="2"></path></g><g><text x="24" y="172" font-size="12" font-weight="600" fill="#111111">CH2 fire rail</text><text x="24" y="188" font-size="11" fill="#444444">relay releases</text><path d="M132 160H286L300 194H720" fill="none" stroke="#111111" stroke-width="2"></path></g><g><text x="24" y="242" font-size="12" font-weight="600" fill="#111111">CH4 CHAIN at D7</text><text x="24" y="258" font-size="11" fill="#444444">divider, same edge</text><path d="M132 230H162.8V264H720" fill="none" stroke="#111111" stroke-width="2"></path></g><g><text x="24" y="312" font-size="12" font-weight="600" fill="#111111">CH3 module input</text><text x="24" y="328" font-size="11" fill="#444444">firmware turns off</text><path d="M132 300H454L468 334H720" fill="none" stroke="#111111" stroke-width="2"></path></g><path d="M160 210H286" stroke="#111111" stroke-width="1.2" marker-start="url(#xi-tm-arrow)" marker-end="url(#xi-tm-arrow)"></path><text x="223" y="226" text-anchor="middle" font-size="11" fill="#111111">rail-off time</text><path d="M160 350H454" stroke="#111111" stroke-width="1.2" marker-start="url(#xi-tm-arrow)" marker-end="url(#xi-tm-arrow)"></path><text x="307" y="366" text-anchor="middle" font-size="11" fill="#111111">output-off time: debounce 20 ms + one loop</text><text x="160" y="390" text-anchor="middle" font-size="11" fill="#111111">0</text><text x="300" y="390" text-anchor="middle" font-size="11" fill="#111111">10</text><text x="440" y="390" text-anchor="middle" font-size="11" fill="#111111">20</text><text x="580" y="390" text-anchor="middle" font-size="11" fill="#111111">30</text><text x="720" y="390" text-anchor="middle" font-size="11" fill="#111111">40</text><text x="720" y="406" text-anchor="end" font-size="11" fill="#444444">time after the E-stop (ms)</text><text x="24" y="430" font-size="11.5" fill="#111111">The rail is off before the firmware even notices: the hardware stops the actuator, the firmware only follows.</text><text x="24" y="448" font-size="11.5" fill="#444444">The flyback diode makes the relay release more slowly than its 5 ms datasheet value.</text></svg>
