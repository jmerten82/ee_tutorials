<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 340" role="img" aria-label="A good joint is a concave fillet that wets both lead and pad" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><text x="24" y="30" font-size="15" font-weight="700" fill="#000000">A good joint is a concave fillet that wets both lead and pad</text><text x="24" y="50" font-size="12.5" fill="#000000">Cross-section through a plated hole, solder side up</text><g><rect x="24" y="64" width="168" height="252" rx="8" fill="none" stroke="#000000" stroke-width="3.75"></rect><g><rect x="32" y="200" width="70" height="24" fill="#dedede" stroke="#000000" stroke-width="1.5"></rect><rect x="114" y="200" width="70" height="24" fill="#dedede" stroke="#000000" stroke-width="1.5"></rect><rect x="68" y="196" width="34" height="4" fill="#000000"></rect><rect x="114" y="196" width="34" height="4" fill="#000000"></rect><rect x="104" y="90" width="8" height="150" fill="none" stroke="#000000" stroke-width="1.88"></rect></g><path d="M68 196 Q100 194 104 150 L112 150 Q116 194 148 196 Z" fill="#000000" fill-opacity="0.3" stroke="#000000" stroke-width="1.88"></path><path d="M102 196 H114 V224 H102 Z" fill="#000000" fill-opacity="0.3" stroke="#000000" stroke-width="1.88"></path><text x="118" y="102" font-size="12.5" fill="#000000">lead</text><text x="134" y="166" font-size="12.5" fill="#000000">fillet</text><text x="152" y="193" font-size="12.5" fill="#000000">pad</text><text x="150" y="216" font-size="12.5" fill="#000000">board</text><text x="108" y="266" text-anchor="middle" font-weight="700" fill="#000000">Good</text><text x="108" y="286" text-anchor="middle" font-size="12.5" fill="#000000">Concave, low angle</text><text x="108" y="302" text-anchor="middle" font-size="12.5" fill="#000000">Lead outline visible</text></g><g><rect x="204" y="64" width="168" height="252" rx="8" fill="none" stroke="#000000" stroke-width="1.5"></rect><g><rect x="212" y="200" width="70" height="24" fill="#dedede" stroke="#000000" stroke-width="1.5"></rect><rect x="294" y="200" width="70" height="24" fill="#dedede" stroke="#000000" stroke-width="1.5"></rect><rect x="248" y="196" width="34" height="4" fill="#000000"></rect><rect x="294" y="196" width="34" height="4" fill="#000000"></rect><rect x="284" y="90" width="8" height="150" fill="none" stroke="#000000" stroke-width="1.88"></rect></g><path d="M248 196 C236 150 266 124 284 126 L292 126 C310 124 340 150 328 196 Z" fill="#000000" fill-opacity="0.3" stroke="#000000" stroke-width="1.88"></path><path d="M282 196 H294 V224 H282 Z" fill="#000000" fill-opacity="0.3" stroke="#000000" stroke-width="1.88"></path><text x="288" y="266" text-anchor="middle" font-weight="700" fill="#000000">Excess</text><text x="288" y="286" text-anchor="middle" font-size="12.5" fill="#000000">Convex blob hides lead</text><text x="288" y="302" text-anchor="middle" font-size="12.5" fill="#000000">Wick off the excess</text></g><g><rect x="384" y="64" width="168" height="252" rx="8" fill="none" stroke="#000000" stroke-width="1.5"></rect><g><rect x="392" y="200" width="70" height="24" fill="#dedede" stroke="#000000" stroke-width="1.5"></rect><rect x="474" y="200" width="70" height="24" fill="#dedede" stroke="#000000" stroke-width="1.5"></rect><rect x="428" y="196" width="34" height="4" fill="#000000"></rect><rect x="474" y="196" width="34" height="4" fill="#000000"></rect><rect x="464" y="90" width="8" height="150" fill="none" stroke="#000000" stroke-width="1.88"></rect></g><path d="M450 196 Q462 194 464 182 L472 182 Q474 194 486 196 Z" fill="#000000" fill-opacity="0.3" stroke="#000000" stroke-width="1.88"></path><path d="M462 196 H474 V206 H462 Z" fill="#000000" fill-opacity="0.3" stroke="#000000" stroke-width="1.88"></path><text x="468" y="266" text-anchor="middle" font-weight="700" fill="#000000">Insufficient</text><text x="468" y="286" text-anchor="middle" font-size="12.5" fill="#000000">Pad not covered</text><text x="468" y="302" text-anchor="middle" font-size="12.5" fill="#000000">Add flux and solder</text></g><g><rect x="564" y="64" width="168" height="252" rx="8" fill="none" stroke="#000000" stroke-width="1.5"></rect><g><rect x="572" y="200" width="70" height="24" fill="#dedede" stroke="#000000" stroke-width="1.5"></rect><rect x="654" y="200" width="70" height="24" fill="#dedede" stroke="#000000" stroke-width="1.5"></rect><rect x="608" y="196" width="34" height="4" fill="#000000"></rect><rect x="654" y="196" width="34" height="4" fill="#000000"></rect><rect x="644" y="90" width="8" height="150" fill="none" stroke="#000000" stroke-width="1.88"></rect></g><ellipse cx="648" cy="176" rx="17" ry="15" fill="#000000" fill-opacity="0.3" stroke="#000000" stroke-width="1.88"></ellipse><text x="648" y="266" text-anchor="middle" font-weight="700" fill="#000000">Non-wetted</text><text x="648" y="286" text-anchor="middle" font-size="12.5" fill="#000000">Ball on lead, pad dry</text><text x="648" y="302" text-anchor="middle" font-size="12.5" fill="#000000">Heat pad, add flux</text></g></svg>
