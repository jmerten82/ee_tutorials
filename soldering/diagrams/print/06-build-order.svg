<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 410" role="img" aria-label="Solder low parts first, then power up with a current limit" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><defs><marker id="build-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#000000"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="700" fill="#000000">Solder low parts first, then power up with a current limit</text><text x="24" y="50" font-size="12.5" fill="#000000">Kit build order by part height (side view), then the first power-up sequence</text><g><path d="M70 92H650" fill="none" stroke="#000000" stroke-width="2.25" marker-end="url(#build-arrow)"></path><text x="70" y="82" font-size="12.5" fill="#000000">order of soldering: lowest to tallest</text></g><g><rect x="24" y="200" width="712" height="14" fill="#dedede" stroke="#000000" stroke-width="1.5"></rect></g><g><path d="M56 200V194H84V200Z" fill="#dedede" stroke="#000000" stroke-width="2.25"></path><path d="M166 200V188H206V200Z" fill="#dedede" stroke="#000000" stroke-width="2.25"></path><path d="M272 200V188H332V200Z" fill="#dedede" stroke="#000000" stroke-width="2.25"></path><path d="M406 200V176A12 12 0 0 1 430 176V200Z" fill="#dedede" stroke="#000000" stroke-width="2.25"></path><path d="M518 200V150H550V200Z" fill="#dedede" stroke="#000000" stroke-width="2.25"></path><path d="M620 200V128H680V200Z" fill="#dedede" stroke="#000000" stroke-width="2.25"></path><path d="M644 128V108H656V128Z" fill="#dedede" stroke="#000000" stroke-width="2.25"></path></g><g><text x="70" y="236" text-anchor="middle" font-weight="700" fill="#000000">1 SMD</text><text x="70" y="252" text-anchor="middle" font-size="12.5" fill="#000000">lowest</text><text x="186" y="236" text-anchor="middle" font-weight="700" fill="#000000">2 Resistors</text><text x="186" y="252" text-anchor="middle" font-size="12.5" fill="#000000">and diodes</text><text x="302" y="236" text-anchor="middle" font-weight="700" fill="#000000">3 Sockets</text><text x="302" y="252" text-anchor="middle" font-size="12.5" fill="#000000">tack 2 corners</text><text x="418" y="236" text-anchor="middle" font-weight="700" fill="#000000">4 Small caps</text><text x="418" y="252" text-anchor="middle" font-size="12.5" fill="#000000">transistors</text><text x="534" y="236" text-anchor="middle" font-weight="700" fill="#000000">5 Electrolytics</text><text x="534" y="252" text-anchor="middle" font-size="12.5" fill="#000000">and headers</text><text x="650" y="236" text-anchor="middle" font-weight="700" fill="#000000">6 Connectors</text><text x="650" y="252" text-anchor="middle" font-size="12.5" fill="#000000">jacks, pots</text></g><text x="24" y="284" font-weight="700" fill="#000000">First power-up</text><g fill="none" stroke="#000000" stroke-width="1.88"><path d="M184 332H208" marker-end="url(#build-arrow)"></path><path d="M368 332H392" marker-end="url(#build-arrow)"></path><path d="M552 332H576" marker-end="url(#build-arrow)"></path></g><g><rect x="24" y="296" width="160" height="72" rx="8" fill="none" stroke="#000000" stroke-width="3.75"></rect><text x="104" y="320" text-anchor="middle" font-weight="700" fill="#000000">1 No-power check</text><text x="104" y="340" text-anchor="middle" font-size="12.5" fill="#000000">Meter: +V to GND</text><text x="104" y="356" text-anchor="middle" font-size="12.5" fill="#000000">must not beep</text></g><g><rect x="208" y="296" width="160" height="72" rx="8" fill="none" stroke="#000000" stroke-width="1.88"></rect><text x="288" y="320" text-anchor="middle" font-weight="700" fill="#000000">2 Current-limited</text><text x="288" y="340" text-anchor="middle" font-size="12.5" fill="#000000">Supply at 50 to 100 mA</text><text x="288" y="356" text-anchor="middle" font-size="12.5" fill="#000000">with ICs out</text></g><g><rect x="392" y="296" width="160" height="72" rx="8" fill="none" stroke="#000000" stroke-width="1.88"></rect><text x="472" y="320" text-anchor="middle" font-weight="700" fill="#000000">3 Check sockets</text><text x="472" y="340" text-anchor="middle" font-size="12.5" fill="#000000">Supply voltage on</text><text x="472" y="356" text-anchor="middle" font-size="12.5" fill="#000000">each power pin</text></g><g><rect x="576" y="296" width="160" height="72" rx="8" fill="none" stroke="#000000" stroke-width="1.88"></rect><text x="656" y="320" text-anchor="middle" font-weight="700" fill="#000000">4 ICs in, power on</text><text x="656" y="340" text-anchor="middle" font-size="12.5" fill="#000000">Watch, smell, feel</text><text x="656" y="356" text-anchor="middle" font-size="12.5" fill="#000000">for 10 seconds</text></g><text x="104" y="390" text-anchor="middle" font-size="12.5" fill="#000000">Beeps? Find the short first</text><text x="656" y="390" text-anchor="middle" font-size="12.5" fill="#000000">Hot part or smell? Disconnect</text></svg>
