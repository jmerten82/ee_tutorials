<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 370" role="img" aria-label="Bend leads away from the body, splay them, clip above the fillet" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><text x="24" y="30" font-size="15" font-weight="700" fill="#000000">Bend away from the body, splay the leads, clip above the fillet</text><text x="24" y="50" font-size="12.5" fill="#000000">Axial resistor on single-sided perfboard, side views</text><g><rect x="24" y="66" width="224" height="290" rx="8" fill="none" stroke="#000000" stroke-width="1.5"></rect><path d="M78 230 V140 H194 V230" fill="none" stroke="#000000" stroke-width="3.75" stroke-linejoin="round"></path><g><rect x="98" y="127" width="76" height="26" rx="12" fill="#dedede" stroke="#000000" stroke-width="1.88"></rect><g stroke="#000000" stroke-width="4.5"><line x1="118" y1="128" x2="118" y2="152"></line><line x1="130" y1="128" x2="130" y2="152"></line><line x1="142" y1="128" x2="142" y2="152"></line></g></g><path d="M174 116 V108 M194 116 V108 M174 112 H194" fill="none" stroke="#000000" stroke-width="1.5"></path><text x="184" y="100" text-anchor="middle" font-size="12.5" fill="#000000">1.5 mm or more</text><text x="136" y="190" text-anchor="middle" font-size="12.5" fill="#000000">never bend</text><text x="136" y="206" text-anchor="middle" font-size="12.5" fill="#000000">at the body seal</text><g><text x="136" y="298" text-anchor="middle" font-weight="700" fill="#000000">1 Bend the leads 90°</text><text x="136" y="318" text-anchor="middle" font-size="12.5" fill="#000000">Use pliers as a former,</text><text x="136" y="334" text-anchor="middle" font-size="12.5" fill="#000000">not your fingers</text></g></g><g><rect x="268" y="66" width="224" height="290" rx="8" fill="none" stroke="#000000" stroke-width="1.5"></rect><rect x="280" y="150" width="200" height="20" fill="#dedede" stroke="#000000" stroke-width="1.88"></rect><rect x="310" y="146" width="24" height="4" fill="#000000"></rect><rect x="426" y="146" width="24" height="4" fill="#000000"></rect><path d="M342 196 H322 V146 L294 106" fill="none" stroke="#000000" stroke-width="3.75" stroke-linejoin="round"></path><path d="M418 196 H438 V146 L466 106" fill="none" stroke="#000000" stroke-width="3.75" stroke-linejoin="round"></path><g><rect x="342" y="183" width="76" height="26" rx="12" fill="#dedede" stroke="#000000" stroke-width="1.88"></rect><g stroke="#000000" stroke-width="4.5"><line x1="362" y1="184" x2="362" y2="208"></line><line x1="374" y1="184" x2="374" y2="208"></line><line x1="386" y1="184" x2="386" y2="208"></line></g></g><line x1="438" y1="146" x2="438" y2="96" stroke="#000000" stroke-width="1.5" stroke-dasharray="4 3"></line><path d="M438 116 A30 30 0 0 1 455 121" fill="none" stroke="#000000" stroke-width="1.5"></path><text x="430" y="104" text-anchor="end" font-size="12.5" fill="#000000">30 to 45°</text><text x="380" y="140" text-anchor="middle" font-size="12.5" fill="#000000">copper pads</text><text x="380" y="240" text-anchor="middle" font-size="12.5" fill="#000000">part underneath, flat</text><text x="380" y="256" text-anchor="middle" font-size="12.5" fill="#000000">against the board</text><g><text x="380" y="298" text-anchor="middle" font-weight="700" fill="#000000">2 Insert, flip, splay</text><text x="380" y="318" text-anchor="middle" font-size="12.5" fill="#000000">Splay each lead 30 to 45°</text><text x="380" y="334" text-anchor="middle" font-size="12.5" fill="#000000">outward, never bend it flat</text></g></g><g><rect x="512" y="66" width="224" height="290" rx="8" fill="none" stroke="#000000" stroke-width="3.75"></rect><rect x="534" y="200" width="180" height="22" fill="#dedede" stroke="#000000" stroke-width="1.88"></rect><rect x="588" y="196" width="72" height="4" fill="#000000"></rect><rect x="620" y="92" width="8" height="48" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="3 3"></rect><path d="M589 196 Q616 194 620 152 L628 152 Q632 194 659 196 Z" fill="#000000" fill-opacity="0.3" stroke="#000000" stroke-width="1.88"></path><rect x="620" y="140" width="8" height="120" fill="none" stroke="#000000" stroke-width="1.88"></rect><polygon points="631,140 724,140 724,114" fill="#000000" fill-opacity="0.55" stroke="#000000" stroke-width="1.88"></polygon><text x="724" y="104" text-anchor="end" font-size="12.5" fill="#000000">cutter</text><line x1="564" y1="140" x2="616" y2="140" stroke="#000000" stroke-width="1.5" stroke-dasharray="4 3"></line><text x="524" y="132" font-size="12.5" fill="#000000">cut here</text><text x="524" y="170" font-size="12.5" fill="#000000">fillet</text><text x="664" y="170" font-size="12.5" fill="#000000">flat face</text><text x="664" y="186" font-size="12.5" fill="#000000">down</text><g><text x="624" y="298" text-anchor="middle" font-weight="700" fill="#000000">3 Solder, then clip</text><text x="624" y="318" text-anchor="middle" font-size="12.5" fill="#000000">Clip just above the fillet,</text><text x="624" y="334" text-anchor="middle" font-size="12.5" fill="#000000">finger over the lead end</text></g></g></svg>
