.75"></line><line x1="92" x2="108" y1="238" y2="238" stroke="#000000" stroke-width="3.75"></line><text x="122" y="222" fill="#000000">+</text><text x="76" y="228" text-anchor="end" font-weight="700" fill="#000000">9 V</text><text x="76" y="244" text-anchor="end" font-size="12.5" fill="#000000">battery</text></g><g><rect x="232" y="100" width="16" height="40" fill="none" stroke="#000000" stroke-width="2.25"></rect><text x="222" y="116" text-anchor="end" font-weight="700" fill="#000000">R1</text><text x="222" y="132" text-anchor="end" font-size="12.5" fill="#000000">1 kΩ</text></g><g><rect x="232" y="180" width="16" height="40" fill="none" stroke="#000000" stroke-width="2.25"></rect><text x="222" y="196" text-anchor="end" font-weight="700" fill="#000000">R2</text><text x="222" y="212" text-anchor="end" font-size="12.5" fill="#000000">68 kΩ</text></g><g><line x1="224" x2="256" y1="300" y2="300" stroke="#000000" stroke-width="3.75"></line><line x1="224" x2="256" y1="312" y2="312" stroke="#000000" stroke-width="3.75"></line><text x="260" y="296" fill="#000000">+</text><text x="216" y="304" text-anchor="end" font-weight="700" fill="#000000">C1</text><text x="216" y="322" text-anchor="end" font-size="12.5" fill="#000000">10 µF</text></g><g><rect x="320" y="120" width="140" height="200" rx="4" fill="#dedede" stroke="#000000" stroke-width="2.25"></rect><text x="392" y="184" text-anchor="middle" font-weight="700" fill="#000000">NE555</text><text x="392" y="200" text-anchor="middle" font-size="12.5" fill="#000000">timer</text><text x="328" y="164" font-size="12.5" fill="#000000">7 DISCH</text><text x="328" y="224" font-size="12.5" fill="#000000">6 THRES</text><text x="328" y="264" font-size="12.5" fill="#000000">2 TRIG</text><text x="452" y="204" text-anchor="end" font-size="12.5" fill="#000000">OUT 3</text><text x="360" y="140" text-anchor="middle" font-size="12.5" fill="#000000">VCC 8</text><text x="420" y="140" text-anchor="middle" font-size="12.5" fill="#000000">RESET 4</text><text x="360" y="308" text-anchor="middle" font-size="12.5" fill="#000000">GND 1</text><text x="420" y="308" text-anchor="middle" font-size="12.5" fill="#000000">CTRL 5</text></g><g><line x1="404" x2="436" y1="350" y2="350" stroke="#000000" stroke-width="3.75"></line><line x1="404" x2="436" y1="360" y2="360" stroke="#000000" stroke-width="3.75"></line><text x="444" y="354" font-weight="700" fill="#000000">C2</text><text x="444" y="370" font-size="12.5" fill="#000000">10 nF</text></g><g><rect x="500" y="192" width="60" height="16" fill="none" stroke="#000000" stroke-width="2.25"></rect><text x="530" y="184" text-anchor="middle" font-weight="700" fill="#000000">R3</text><text x="530" y="226" text-anchor="middle" font-size="12.5" fill="#000000">470 Ω</text></g><g><polygon points="606,250 634,250 620,276" fill="none" stroke="#000000" stroke-width="2.25"></polygon><line x1="606" x2="634" y1="276" y2="276" stroke="#000000" stroke-width="3"></line><path d="M640 258l12 -10" fill="none" stroke="#000000" stroke-width="1.88" marker-end="url(#sch-arrow)"></path><path d="M640 270l12 -10" fill="none" stroke="#000000" stroke-width="1.88" marker-end="url(#sch-arrow)"></path><text x="598" y="258" text-anchor="end" font-weight="700" fill="#000000">LED</text><text x="598" y="274" text-anchor="end" font-size="12.5" fill="#000000">flat side down</text></g><g><text x="480" y="108" font-weight="700" fill="#000000">Blink rate</text><text x="480" y="126" font-size="12.5" fill="#000000">f ≈ 1.44 / ((R1 + 2 × R2) × C1)</text><text x="480" y="142" font-size="12.5" fill="#000000">≈ 1.05 Hz with these values</text></g></svg>
