<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 400" role="img" aria-label="Heat pad and lead together, feed solder from the opposite side" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><defs><marker id="core-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#000000"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="700" fill="#000000">Heat pad and lead together, feed solder from the opposite side</text><text x="24" y="50" font-size="12.5" fill="#000000">Side view of one through-hole joint, solder side up</text><g><rect x="200" y="200" width="174" height="28" fill="#dedede" stroke="#000000" stroke-width="1.5"></rect><rect x="386" y="200" width="174" height="28" fill="#dedede" stroke="#000000" stroke-width="1.5"></rect><rect x="330" y="195" width="44" height="5" fill="#000000"></rect><rect x="386" y="195" width="44" height="5" fill="#000000"></rect><rect x="376" y="110" width="8" height="140" fill="none" stroke="#000000" stroke-width="1.88"></rect><text x="392" y="126" font-size="12.5" fill="#000000">lead</text><text x="436" y="193" font-size="12.5" fill="#000000">pad</text><text x="480" y="219" font-size="12.5" fill="#000000">board</text></g><g><polygon points="232,82 252,70 380,184 366,196" fill="#000000" fill-opacity="0.18" stroke="#000000" stroke-width="1.88"></polygon><text x="24" y="96" font-weight="700" fill="#000000">Iron tip</text><text x="24" y="114" font-size="12.5" fill="#000000">touches pad and lead</text><text x="24" y="130" font-size="12.5" fill="#000000">at the same time</text></g><g><ellipse cx="371" cy="191" rx="6" ry="4" fill="#000000" fill-opacity="0.6"></ellipse><line x1="366" y1="196" x2="334" y2="250" stroke="#000000" stroke-width="1.5"></line><text x="328" y="262" text-anchor="end" font-size="12.5" fill="#000000">Small solder bead = heat bridge</text></g><g><line x1="500" y1="104" x2="390" y2="190" stroke="#000000" stroke-width="7.5" stroke-linecap="round"></line><text x="528" y="96" font-weight="700" fill="#000000">Solder wire</text><text x="528" y="114" font-size="12.5" fill="#000000">touches the joint on</text><text x="528" y="130" font-size="12.5" fill="#000000">the side opposite the tip</text></g><text x="24" y="290" font-weight="700" fill="#000000">The five steps: about 3 seconds of heat per joint</text><g fill="none" stroke="#000000" stroke-width="1.88"><path d="M152 340H170" marker-end="url(#core-arrow)"></path><path d="M298 340H316" marker-end="url(#core-arrow)"></path><path d="M444 340H462" marker-end="url(#core-arrow)"></path><path d="M590 340H608" marker-end="url(#core-arrow)"></path></g><g><rect x="24" y="304" width="128" height="72" rx="8" fill="none" stroke="#000000" stroke-width="1.88"></rect><text x="88" y="328" text-anchor="middle" font-weight="700" fill="#000000">1 Clean, load</text><text x="88" y="348" text-anchor="middle" font-size="12.5" fill="#000000">Wipe the tip,</text><text x="88" y="364" text-anchor="middle" font-size="12.5" fill="#000000">add a tiny bead</text></g><g><rect x="170" y="304" width="128" height="72" rx="8" fill="none" stroke="#000000" stroke-width="1.88"></rect><text x="234" y="328" text-anchor="middle" font-weight="700" fill="#000000">2 Heat both</text><text x="234" y="348" text-anchor="middle" font-size="12.5" fill="#000000">Pad and lead</text><text x="234" y="364" text-anchor="middle" font-size="12.5" fill="#000000">about 1 s</text></g><g><rect x="316" y="304" width="128" height="72" rx="8" fill="none" stroke="#000000" stroke-width="1.88"></rect><text x="380" y="328" text-anchor="middle" font-weight="700" fill="#000000">3 Feed solder</text><text x="380" y="348" text-anchor="middle" font-size="12.5" fill="#000000">Opposite the tip</text><text x="380" y="364" text-anchor="middle" font-size="12.5" fill="#000000">1 to 2 s</text></g><g><rect x="462" y="304" width="128" height="72" rx="8" fill="none" stroke="#000000" stroke-width="1.88"></rect><text x="526" y="328" text-anchor="middle" font-weight="700" fill="#000000">4 Solder off</text><text x="526" y="348" text-anchor="middle" font-size="12.5" fill="#000000">then iron off,</text><text x="526" y="364" text-anchor="middle" font-size="12.5" fill="#000000">0.5 s later</text></g><g><rect x="608" y="304" width="128" height="72" rx="8" fill="none" stroke="#000000" stroke-width="1.88"></rect><text x="672" y="328" text-anchor="middle" font-weight="700" fill="#000000">5 Hold still</text><text x="672" y="348" text-anchor="middle" font-size="12.5" fill="#000000">Let it freeze</text><text x="672" y="364" text-anchor="middle" font-size="12.5" fill="#000000">2 to 3 s</text></g></svg>
