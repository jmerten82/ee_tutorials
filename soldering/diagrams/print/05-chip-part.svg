rt into the</text><text x="380" y="336" text-anchor="middle" font-size="12.5" fill="#000000">molten blob, hold 2 s</text></g><g><rect x="512" y="64" width="224" height="286" rx="8" fill="none" stroke="#000000" stroke-width="1.5"></rect><g><rect x="568" y="108" width="34" height="44" fill="#dedede" stroke="#000000" stroke-width="1.88"></rect><rect x="646" y="108" width="34" height="44" fill="#dedede" stroke="#000000" stroke-width="1.88"></rect></g><g><rect x="590" y="116" width="68" height="28" fill="#dedede" stroke="#000000" stroke-width="2.25"></rect><rect x="590" y="116" width="10" height="28" fill="#000000" fill-opacity="0.55"></rect><rect x="648" y="116" width="10" height="28" fill="#000000" fill-opacity="0.55"></rect></g><rect x="568" y="112" width="22" height="36" fill="#000000" fill-opacity="0.3"></rect><rect x="658" y="112" width="22" height="36" fill="#000000" fill-opacity="0.3"></rect><polygon points="722,86 712,78 670,112 678,120" fill="#000000" fill-opacity="0.18" stroke="#000000" stroke-width="1.88"></polygon><g><rect x="528" y="260" width="192" height="14" fill="#dedede" stroke="#000000" stroke-width="1.5"></rect><rect x="568" y="256" width="34" height="4" fill="#000000"></rect><rect x="646" y="256" width="34" height="4" fill="#000000"></rect></g><g><rect x="590" y="238" width="68" height="18" fill="#dedede" stroke="#000000" stroke-width="2.25"></rect><rect x="590" y="238" width="10" height="18" fill="#000000" fill-opacity="0.55"></rect><rect x="648" y="238" width="10" height="18" fill="#000000" fill-opacity="0.55"></rect></g><path d="M568 256 Q586 254 590 243 L590 256 Z" fill="#000000" fill-opacity="0.35" stroke="#000000" stroke-width="1.88"></path><path d="M680 256 Q662 254 658 243 L658 256 Z" fill="#000000" fill-opacity="0.35" stroke="#000000" stroke-width="1.88"></path><text x="686" y="252" font-size="12.5" fill="#000000">fillet</text><text x="624" y="302" text-anchor="middle" font-weight="700" fill="#000000">3 Solder second end</text><text x="624" y="320" text-anchor="middle" font-size="12.5" fill="#000000">Then re-flux and</text><text x="624" y="336" text-anchor="middle" font-size="12.5" fill="#000000">reflow the first end</text></g></svg>
