<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 470" role="img" aria-label="Bench layout seen from above, for a right-handed person" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><defs><marker id="bench-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#000000"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="700" fill="#000000">Set the bench up the same way every time</text><text x="24" y="50" font-size="12.5" fill="#000000">Top view for a right-handed person; left-handers mirror it</text><rect x="40" y="70" width="540" height="300" rx="10" fill="none" stroke="#000000" stroke-width="2.25" stroke-dasharray="8 5"></rect><text x="52" y="88" font-size="12.5" fill="#000000">silicone mat</text><rect x="350" y="84" width="120" height="50" rx="6" fill="#dedede" stroke="#000000" stroke-width="1.88"></rect><g><text x="410" y="105" text-anchor="middle" font-weight="700" fill="#000000">Extractor</text><text x="410" y="121" text-anchor="middle" font-size="12.5" fill="#000000">behind, to the side</text></g><path d="M330 194 Q340 160 368 140" fill="none" stroke="#000000" stroke-width="1.88" stroke-dasharray="4 4" marker-end="url(#bench-arrow)"></path><text x="326" y="160" text-anchor="end" font-size="12.5" fill="#000000">smoke pulled away</text><rect x="240" y="196" width="140" height="66" rx="4" fill="#dedede" stroke="#000000" stroke-width="3"></rect><rect x="270" y="214" width="80" height="30" fill="none" stroke="#000000" stroke-width="1.88"></rect><g><text x="310" y="286" text-anchor="middle" font-weight="700" fill="#000000">Holder</text><text x="310" y="302" text-anchor="middle" font-size="12.5" fill="#000000">work in the centre</text></g><circle cx="120" cy="220" r="34" fill="#dedede" stroke="#000000" stroke-width="1.88"></circle><circle cx="120" cy="220" r="12" fill="none" stroke="#000000" stroke-width="1.88"></circle><g><text x="120" y="274" text-anchor="middle" font-weight="700" fill="#000000">Solder</text><text x="120" y="290" text-anchor="middle" font-size="12.5" fill="#000000">spool</text></g><rect x="160" y="308" width="70" height="14" rx="5" fill="#dedede" stroke="#000000" stroke-width="1.88"></rect><g><text x="196" y="344" text-anchor="middle" font-weight="700" fill="#000000">Flux</text></g><rect x="60" y="96" width="70" height="56" rx="6" fill="none" stroke="#000000" stroke-width="1.88"></rect><g><text x="95" y="120" text-anchor="middle" font-weight="700" fill="#000000">Waste</text><text x="95" y="136" text-anchor="middle" font-size="12.5" fill="#000000">jar</text></g><rect x="470" y="214" width="80" height="86" rx="8" fill="#dedede" stroke="#000000" stroke-width="1.88"></rect><line x1="490" y1="286" x2="536" y2="226" stroke="#000000" stroke-width="9" stroke-linecap="round"></line><g><text x="510" y="320" text-anchor="middle" font-weight="700" fill="#000000">Iron stand</text><text x="510" y="336" text-anchor="middle" font-size="12.5" fill="#000000">iron lives here</text></g><circle cx="530" cy="140" r="22" fill="none" stroke="#000000" stroke-width="1.88"></circle><path d="M516 136 q7 -8 14 0 t14 0 M516 146 q7 -8 14 0 t14 0" fill="none" stroke="#000000" stroke-width="1.5"></path><g><text x="530" y="186" text-anchor="middle" font-weight="700" fill="#000000">Brass wool</text></g><rect x="226" y="330" width="54" height="130" rx="26" fill="none" stroke="#000000" stroke-width="2.25"></rect><rect x="340" y="330" width="54" height="130" rx="26" fill="none" stroke="#000000" stroke-width="2.25"></rect><text x="408" y="420" font-weight="700" fill="#000000">Forearms</text><text x="408" y="436" font-size="12.5" fill="#000000">rest on the bench edge</text><text x="604" y="96" font-weight="700" fill="#000000">Why</text><text x="604" y="118" font-size="12.5" fill="#000000">Iron on the side</text><text x="604" y="134" font-size="12.5" fill="#000000">of the hand that</text><text x="604" y="150" font-size="12.5" fill="#000000">holds it, so the</text><text x="604" y="166" font-size="12.5" fill="#000000">hot tip never</text><text x="604" y="182" font-size="12.5" fill="#000000">crosses your arm.</text><text x="604" y="214" font-size="12.5" fill="#000000">Solder and flux</text><text x="604" y="230" font-size="12.5" fill="#000000">on the other side,</text><text x="604" y="246" font-size="12.5" fill="#000000">for the free hand.</text><text x="604" y="278" font-size="12.5" fill="#000000">Anchored wrists</text><text x="604" y="294" font-size="12.5" fill="#000000">give precision;</text><text x="604" y="310" font-size="12.5" fill="#000000">hovering hands</text><text x="604" y="326" font-size="12.5" fill="#000000">shake.</text></svg>
