<svg viewBox="0 0 760 366" role="img" aria-label="Slide the heat shrink on before you solder" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><text x="24" y="30" font-size="15" font-weight="600" fill="#111111">Slide the heat shrink on before you solder</text><text x="24" y="50" font-size="11.5" fill="#444444">Inline splice of two stranded wires, four stages</text><g stroke="#bbbbbb" stroke-width="1"><line x1="24" x2="736" y1="138" y2="138"></line><line x1="24" x2="736" y1="214" y2="214"></line><line x1="24" x2="736" y1="290" y2="290"></line></g><g><rect x="220" y="94" width="220" height="12" rx="3" fill="#ececec" stroke="#444444" stroke-width="1.25"></rect><rect x="440" y="97" width="40" height="6" fill="#444444" fill-opacity="0.25" stroke="#444444" stroke-width="1"></rect><rect x="500" y="97" width="40" height="6" fill="#444444" fill-opacity="0.25" stroke="#444444" stroke-width="1"></rect><rect x="540" y="94" width="180" height="12" rx="3" fill="#ececec" stroke="#444444" stroke-width="1.25"></rect><rect x="262" y="88" width="70" height="24" rx="4" fill="none" stroke="#444444" stroke-width="1.5"></rect><text x="24" y="96" font-weight="600" fill="#111111">1 Heat shrink on first</text><text x="24" y="114" font-size="11.5" fill="#444444">Slide it well away</text><text x="297" y="82" text-anchor="middle" font-size="11.5" fill="#444444">heat shrink</text></g><g><rect x="220" y="170" width="220" height="12" rx="3" fill="#ececec" stroke="#444444" stroke-width="1.25"></rect><rect x="440" y="173" width="40" height="6" fill="#444444" fill-opacity="0.7" stroke="#444444" stroke-width="1"></rect><rect x="500" y="173" width="40" height="6" fill="#444444" fill-opacity="0.7" stroke="#444444" stroke-width="1"></rect><rect x="540" y="170" width="180" height="12" rx="3" fill="#ececec" stroke="#444444" stroke-width="1.25"></rect><rect x="262" y="164" width="70" height="24" rx="4" fill="none" stroke="#444444" stroke-width="1.5"></rect><text x="24" y="172" font-weight="600" fill="#111111">2 Strip and tin</text><text x="24" y="190" font-size="11.5" fill="#444444">8 to 10 mm, both ends</text><text x="490" y="162" text-anchor="middle" font-size="11.5" fill="#444444">tinned ends</text></g><g><rect x="220" y="246" width="220" height="12" rx="3" fill="#ececec" stroke="#444444" stroke-width="1.25"></rect><g><rect x="440" y="245" width="66" height="6" fill="#444444" fill-opacity="0.7" stroke="#444444" stroke-width="1"></rect><rect x="446" y="253" width="66" height="6" fill="#444444" fill-opacity="0.7" stroke="#444444" stroke-width="1"></rect><rect x="436" y="241" width="80" height="22" rx="10" fill="#444444" fill-opacity="0.25" stroke="#444444" stroke-width="1.25"></rect></g><rect x="512" y="246" width="208" height="12" rx="3" fill="#ececec" stroke="#444444" stroke-width="1.25"></rect><rect x="262" y="240" width="70" height="24" rx="4" fill="none" stroke="#444444" stroke-width="1.5"></rect><text x="24" y="248" font-weight="600" fill="#111111">3 Overlap, solder</text><text x="24" y="266" font-size="11.5" fill="#444444">Heat from below</text><text x="476" y="234" text-anchor="middle" font-size="11.5" fill="#444444">solder fuses both ends</text></g><g><rect x="220" y="322" width="220" height="12" rx="3" fill="#ececec" stroke="#444444" stroke-width="1.25"></rect><g><rect x="440" y="321" width="66" height="6" fill="#444444" fill-opacity="0.7" stroke="#444444" stroke-width="1"></rect><rect x="446" y="329" width="66" height="6" fill="#444444" fill-opacity="0.7" stroke="#444444" stroke-width="1"></rect><rect x="436" y="317" width="80" height="22" rx="10" fill="#444444" fill-opacity="0.25" stroke="#444444" stroke-width="1.25"></rect></g><rect x="512" y="322" width="208" height="12" rx="3" fill="#ececec" stroke="#444444" stroke-width="1.25"></rect><rect x="418" y="315" width="116" height="26" rx="6" fill="#444444" fill-opacity="0.12" stroke="#444444" stroke-width="1.5"></rect><text x="24" y="324" font-weight="600" fill="#111111">4 Shrink over joint</text><text x="24" y="342" font-size="11.5" fill="#444444">Covers all bare metal</text><text x="476" y="308" text-anchor="middle" font-size="11.5" fill="#444444">tube shrunk over joint</text></g></svg>
