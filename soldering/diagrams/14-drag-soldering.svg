<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 430" role="img" aria-label="Drag a loaded hoof tip slowly along the pad tips through plenty of flux" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><defs><marker id="drag-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#444444"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#111111">Drag a loaded tip slowly along the pad tips, through plenty of flux</text><text x="24" y="50" font-size="11.5" fill="#444444">TSSOP, 0.65 mm pitch, top view of one pin row</text><rect x="76" y="70" width="388" height="92" rx="4" fill="#ececec" stroke="#444444" stroke-width="1.25"></rect><circle cx="96" cy="90" r="6" fill="none" stroke="#444444" stroke-width="1.25"></circle><text x="180" y="126" text-anchor="middle" font-weight="600" fill="#111111">IC body</text><text x="110" y="94" font-size="11.5" fill="#444444">pin 1</text><g><rect x="89" y="172" width="18" height="46" fill="none" stroke="#444444" stroke-width="1.25"></rect><rect x="121" y="172" width="18" height="46" fill="none" stroke="#444444" stroke-width="1.25"></rect><rect x="153" y="172" width="18" height="46" fill="none" stroke="#444444" stroke-width="1.25"></rect><rect x="185" y="172" width="18" height="46" fill="none" stroke="#444444" stroke-width="1.25"></rect><rect x="217" y="172" width="18" height="46" fill="none" stroke="#444444" stroke-width="1.25"></rect><rect x="249" y="172" width="18" height="46" fill="none" stroke="#444444" stroke-width="1.25"></rect><rect x="281" y="172" width="18" height="46" fill="none" stroke="#444444" stroke-width="1.25"></rect><rect x="313" y="172" width="18" height="46" fill="none" stroke="#444444" stroke-width="1.25"></rect><rect x="345" y="172" width="18" height="46" fill="none" stroke="#444444" stroke-width="1.25"></rect><rect x="377" y="172" width="18" height="46" fill="none" stroke="#444444" stroke-width="1.25"></rect><rect x="409" y="172" width="18" height="46" fill="none" stroke="#444444" stroke-width="1.25"></rect><rect x="441" y="172" width="18" height="46" fill="none" stroke="#444444" stroke-width="1.25"></rect></g><g><path d="M92 162 V200 H104 V162" fill="#444444" fill-opacity="0.6" stroke="#444444" stroke-width="1.25"></path><path d="M124 162 V200 H136 V162" fill="#444444" fill-opacity="0.6" stroke="#444444" stroke-width="1.25"></path><path d="M156 162 V200 H168 V162" fill="#444444" fill-opacity="0.6" stroke="#444444" stroke-width="1.25"></path><path d="M188 162 V200 H200 V162" fill="#444444" fill-opacity="0.6" stroke="#444444" stroke-width="1.25"></path><path d="M220 162 V200 H232 V162" fill="#444444" fill-opacity="0.6" stroke="#444444" stroke-width="1.25"></path><path d="M252 162 V200 H264 V162" fill="#444444" fill-opacity="0.6" stroke="#444444" stroke-width="1.25"></path><path d="M284 162 V200 H296 V162" fill="#444444" fill-opacity="0.25" stroke="#444444" stroke-width="1.25"></path><path d="M316 162 V200 H328 V162" fill="#444444" fill-opacity="0.25" stroke="#444444" stroke-width="1.25"></path><path d="M348 162 V200 H360 V162" fill="#444444" fill-opacity="0.25" stroke="#444444" stroke-width="1.25"></path><path d="M380 162 V200 H392 V162" fill="#444444" fill-opacity="0.25" stroke="#444444" stroke-width="1.25"></path><path d="M412 162 V200 H424 V162" fill="#444444" fill-opacity="0.25" stroke="#444444" stroke-width="1.25"></path><path d="M444 162 V200 H456 V162" fill="#444444" fill-opacity="0.25" stroke="#444444" stroke-width="1.25"></path></g><g><path d="M90 200 Q98 214 106 200 Z" fill="#444444" fill-opacity="0.6" stroke="#444444" stroke-width="1"></path><path d="M122 200 Q130 214 138 200 Z" fill="#444444" fill-opacity="0.6" stroke="#444444" stroke-width="1"></path><path d="M154 200 Q162 214 170 200 Z" fill="#444444" fill-opacity="0.6" stroke="#444444" stroke-width="1"></path><path d="M186 200 Q194 214 202 200 Z" fill="#444444" fill-opacity="0.6" stroke="#444444" stroke-width="1"></path><path d="M218 200 Q226 214 234 200 Z" fill="#444444" fill-opacity="0.6" stroke="#444444" stroke-width="1"></path><path d="M250 200 Q258 214 266 200 Z" fill="#444444" fill-opacity="0.6" stroke="#444444" stroke-width="1"></path></g><rect x="70" y="166" width="400" height="60" rx="8" fill="none" stroke="#444444" stroke-width="1.25" stroke-dasharray="6 4"></rect><text x="70" y="244" font-size="11.5" fill="#444444">dashed: flood with gel flux</text><text x="70" y="260" font-size="11.5" fill="#444444">left half done: a fillet on every pin</text><polygon points="278,204 312,198 322,222 296,232" fill="#444444" fill-opacity="0.18" stroke="#444444" stroke-width="1.5"></polygon><polygon points="312,198 322,222 420,316 432,300" fill="#444444" fill-opacity="0.18" stroke="#444444" stroke-width="1.25"></polygon><text x="440" y="300" font-weight="600" fill="#111111">Hoof tip</text><text x="440" y="316" font-size="11.5" fill="#444444">touches pin feet at the pad tips</text><path d="M296 148 H420" fill="none" stroke="#444444" stroke-width="2" marker-end="url(#drag-arrow)"></path><text x="296" y="136" font-size="11.5" fill="#444444">drag, about 1 mm/s</text><rect x="510" y="70" width="226" height="190" rx="8" fill="none" stroke="#444444" stroke-width="1"></rect><text x="524" y="92" font-weight="600" fill="#111111">Bridge? Normal at first</text><path d="M556 110 V176 H568 V110 M596 110 V176 H608 V110" fill="#444444" fill-opacity="0.25" stroke="#444444" stroke-width="1.25"></path><ellipse cx="582" cy="160" rx="22" ry="9" fill="#444444" fill-opacity="0.6" stroke="#444444" stroke-width="1.25"></ellipse><path d="M640 160 H700" fill="none" stroke="#444444" stroke-width="1.5" marker-end="url(#drag-arrow)"></path><text x="640" y="148" font-size="11.5" fill="#444444">clean tip</text><text x="524" y="208" font-size="11.5" fill="#444444">Add flux, then drag a clean</text><text x="524" y="224" font-size="11.5" fill="#444444">tip off the end of the row,</text><text x="524" y="240" font-size="11.5" fill="#444444">or lay braid over it.</text><g fill="none" stroke="#444444" stroke-width="1.25"><path d="M152 384H170" marker-end="url(#drag-arrow)"></path><path d="M298 384H316" marker-end="url(#drag-arrow)"></path><path d="M444 384H462" marker-end="url(#drag-arrow)"></path><path d="M590 384H608" marker-end="url(#drag-arrow)"></path></g><g><g><rect x="24" y="352" width="128" height="64" rx="8" fill="none" stroke="#444444" stroke-width="1.25"></rect><text x="88" y="374" text-anchor="middle" font-weight="600" fill="#111111">1 Tack corners</text><text x="88" y="392" text-anchor="middle" font-size="11.5" fill="#444444">Alignment perfect</text><text x="88" y="408" text-anchor="middle" font-size="11.5" fill="#444444">before you go on</text></g><g><rect x="170" y="352" width="128" height="64" rx="8" fill="none" stroke="#444444" stroke-width="1.25"></rect><text x="234" y="374" text-anchor="middle" font-weight="600" fill="#111111">2 Flood flux</text><text x="234" y="392" text-anchor="middle" font-size="11.5" fill="#444444">Whole pin row,</text><text x="234" y="408" text-anchor="middle" font-size="11.5" fill="#444444">be generous</text></g><g><rect x="316" y="352" width="128" height="64" rx="8" fill="none" stroke="#444444" stroke-width="1.25"></rect><text x="380" y="374" text-anchor="middle" font-weight="600" fill="#111111">3 Load the tip</text><text x="380" y="392" text-anchor="middle" font-size="11.5" fill="#444444">Hoof or bevel,</text><text x="380" y="408" text-anchor="middle" font-size="11.5" fill="#444444">moderate bead</text></g><g><rect x="462" y="352" width="128" height="64" rx="8" fill="none" stroke="#444444" stroke-width="1.25"></rect><text x="526" y="374" text-anchor="middle" font-weight="600" fill="#111111">4 Drag slowly</text><text x="526" y="392" text-anchor="middle" font-size="11.5" fill="#444444">Along the pad tips,</text><text x="526" y="408" text-anchor="middle" font-size="11.5" fill="#444444">about 1 mm/s</text></g><g><rect x="608" y="352" width="128" height="64" rx="8" fill="none" stroke="#444444" stroke-width="1.25"></rect><text x="672" y="374" text-anchor="middle" font-weight="600" fill="#111111">5 Check</text><text x="672" y="392" text-anchor="middle" font-size="11.5" fill="#444444">Loupe, then meter</text><text x="672" y="408" text-anchor="middle" font-size="11.5" fill="#444444">every pin pair</text></g></g></svg>
