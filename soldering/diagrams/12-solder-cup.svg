<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 370" role="img" aria-label="Fill the cup two-thirds, push the tinned wire in, hold still" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><defs><marker id="cup-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#444444"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#111111">Fill the cup two-thirds, push the wire in, hold still</text><text x="24" y="50" font-size="11.5" fill="#444444">Solder cup cut open, cup opening facing up</text><g><rect x="24" y="66" width="224" height="290" rx="8" fill="none" stroke="#444444" stroke-width="1"></rect><g fill="#ececec" stroke="#444444" stroke-width="1.25"><path d="M102 120 V240 H170 V120 H160 V232 H112 V120 Z"></path><rect x="128" y="240" width="16" height="26"></rect></g><rect x="112" y="164" width="48" height="68" fill="#444444" fill-opacity="0.35" stroke="#444444" stroke-width="1"></rect><polygon points="240,96 228,84 169,186 174,196" fill="#444444" fill-opacity="0.18" stroke="#444444" stroke-width="1.25"></polygon><line x1="60" y1="90" x2="122" y2="150" stroke="#444444" stroke-width="5" stroke-linecap="round"></line><text x="36" y="84" font-size="11.5" fill="#444444">solder</text><text x="180" y="226" font-size="11.5" fill="#444444">iron on</text><text x="180" y="242" font-size="11.5" fill="#444444">the side</text><path d="M90 164 H82 V232 H90" fill="none" stroke="#444444" stroke-width="1"></path><text x="76" y="202" text-anchor="end" font-size="11.5" fill="#444444">2/3</text><g><text x="136" y="298" text-anchor="middle" font-weight="600" fill="#111111">1 Fill the cup</text><text x="136" y="318" text-anchor="middle" font-size="11.5" fill="#444444">Heat the cup from the side,</text><text x="136" y="334" text-anchor="middle" font-size="11.5" fill="#444444">feed solder into it</text></g></g><g><rect x="268" y="66" width="224" height="290" rx="8" fill="none" stroke="#444444" stroke-width="1"></rect><g fill="#ececec" stroke="#444444" stroke-width="1.25"><path d="M346 120 V240 H414 V120 H404 V232 H356 V120 Z"></path><rect x="372" y="240" width="16" height="26"></rect></g><rect x="356" y="164" width="48" height="68" fill="#444444" fill-opacity="0.35" stroke="#444444" stroke-width="1"></rect><polygon points="484,96 472,84 413,186 418,196" fill="#444444" fill-opacity="0.18" stroke="#444444" stroke-width="1.25"></polygon><rect x="374" y="96" width="12" height="56" fill="#444444" fill-opacity="0.3" stroke="#444444" stroke-width="1.25"></rect><rect x="371" y="76" width="18" height="20" fill="#ececec" stroke="#444444" stroke-width="1.25"></rect><path d="M340 92 V146" fill="none" stroke="#444444" stroke-width="1.5" marker-end="url(#cup-arrow)"></path><text x="332" y="110" text-anchor="end" font-size="11.5" fill="#444444">tinned</text><text x="332" y="126" text-anchor="end" font-size="11.5" fill="#444444">wire in</text><text x="420" y="226" font-size="11.5" fill="#444444">molten</text><g><text x="380" y="298" text-anchor="middle" font-weight="600" fill="#111111">2 Melt, slide in</text><text x="380" y="318" text-anchor="middle" font-size="11.5" fill="#444444">Wire straight down, iron off,</text><text x="380" y="334" text-anchor="middle" font-size="11.5" fill="#444444">hold still for 3 seconds</text></g></g><g><rect x="512" y="66" width="224" height="290" rx="8" fill="none" stroke="#444444" stroke-width="2.5"></rect><g fill="#ececec" stroke="#444444" stroke-width="1.25"><path d="M590 120 V240 H658 V120 H648 V232 H600 V120 Z"></path><rect x="616" y="240" width="16" height="26"></rect></g><path d="M600 128 Q602 152 609 152 Q616 152 618 134 L630 134 Q632 152 639 152 Q646 152 648 128 V232 H600 Z" fill="#444444" fill-opacity="0.35" stroke="#444444" stroke-width="1.25"></path><rect x="618" y="108" width="12" height="116" fill="none" stroke="#444444" stroke-width="1.25"></rect><rect x="615" y="76" width="18" height="32" fill="#ececec" stroke="#444444" stroke-width="1.25"></rect><path d="M640 108 H670 M662 120 H670" fill="none" stroke="#444444" stroke-width="1"></path><text x="676" y="112" font-size="11.5" fill="#444444">1 mm gap</text><text x="676" y="128" font-size="11.5" fill="#444444">to the rim</text><text x="666" y="176" font-size="11.5" fill="#444444">concave</text><text x="666" y="192" font-size="11.5" fill="#444444">meniscus</text><g><text x="624" y="298" text-anchor="middle" font-weight="600" fill="#111111">3 Pass look</text><text x="624" y="318" text-anchor="middle" font-size="11.5" fill="#444444">Cup full, solder hugs the wire,</text><text x="624" y="334" text-anchor="middle" font-size="11.5" fill="#444444">nothing on the outside</text></g></g></svg>
