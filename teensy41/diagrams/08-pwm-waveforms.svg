<svg viewBox="0 0 760 470" role="img" aria-label="PWM duty cycle and average voltage" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><defs><marker id="pw-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111111"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#111111">PWM: the pin is only ever 0 V or 3.3 V; the duty cycle sets the average</text><text x="24" y="50" font-size="11.5" fill="#444444">Default 8-bit resolution (0–255); default frequency about 4.48 kHz, so one period is about 223 µs</text><g><text x="24" y="108" font-weight="600" fill="#111111">10 % duty</text><text x="24" y="126" font-size="11.5" fill="#444444">analogWrite(pin, 26)</text><text x="212" y="94" text-anchor="end" font-size="11.5" fill="#111111">3.3 V</text><text x="212" y="144" text-anchor="end" font-size="11.5" fill="#111111">0 V</text><path d="M220 140H220V90H230.8V140H328V90H338.8V140H436V90H446.8V140H544V90H554.8V140H652" fill="none" stroke="#111111" stroke-width="2"></path><path d="M220 135H652" stroke="#111111" stroke-width="1.4" stroke-dasharray="6 4"></path><text x="660" y="139" font-size="11.5" font-weight="600" fill="#111111">avg 0.33 V</text></g><g><text x="24" y="208" font-weight="600" fill="#111111">50 % duty</text><text x="24" y="226" font-size="11.5" fill="#444444">analogWrite(pin, 128)</text><text x="212" y="194" text-anchor="end" font-size="11.5" fill="#111111">3.3 V</text><text x="212" y="244" text-anchor="end" font-size="11.5" fill="#111111">0 V</text><path d="M220 240H220V190H274V240H328V190H382V240H436V190H490V240H544V190H598V240H652" fill="none" stroke="#111111" stroke-width="2"></path><path d="M220 215H652" stroke="#111111" stroke-width="1.4" stroke-dasharray="6 4"></path><text x="660" y="219" font-size="11.5" font-weight="600" fill="#111111">avg 1.65 V</text></g><g><text x="24" y="308" font-weight="600" fill="#111111">90 % duty</text><text x="24" y="326" font-size="11.5" fill="#444444">analogWrite(pin, 230)</text><text x="212" y="294" text-anchor="end" font-size="11.5" fill="#111111">3.3 V</text><text x="212" y="344" text-anchor="end" font-size="11.5" fill="#111111">0 V</text><path d="M220 340H220V290H317.2V340H328V290H425.2V340H436V290H533.2V340H544V290H641.2V340H652" fill="none" stroke="#111111" stroke-width="2"></path><path d="M220 295H652" stroke="#111111" stroke-width="1.4" stroke-dasharray="6 4"></path><text x="660" y="299" font-size="11.5" font-weight="600" fill="#111111">avg 2.97 V</text></g><path d="M220 384H328" stroke="#111111" stroke-width="1.2" marker-start="url(#pw-arrow)" marker-end="url(#pw-arrow)"></path><text x="274" y="402" text-anchor="middle" font-size="11.5" fill="#111111">one period T = 1 / f</text><path d="M328 384H382" stroke="#111111" stroke-width="1.2" marker-start="url(#pw-arrow)" marker-end="url(#pw-arrow)"></path><text x="355" y="376" text-anchor="middle" font-size="11.5" fill="#111111">on time</text><text x="420" y="384" font-size="11.5" fill="#111111">average = 3.3 V × value / 255</text><text x="420" y="402" font-size="11.5" fill="#444444">an LED or motor responds to the average</text><text x="24" y="436" font-size="11.5" fill="#111111">analogWriteFrequency(pin, 20000) moves the switching above hearing (quieter motors, no LED flicker on camera).</text><text x="24" y="454" font-size="11.5" fill="#111111">analogWriteResolution(12) gives 0–4095; the faster the frequency, the fewer real steps are left.</text></svg>
