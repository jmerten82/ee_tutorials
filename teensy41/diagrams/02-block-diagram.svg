<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 520" role="img" aria-label="Teensy 4.1 block diagram" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><defs><marker id="blk-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111111"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#111111">Inside the Teensy 4.1: one fast processor and a lot of plumbing</text><text x="24" y="50" font-size="11.5" fill="#444444">Solid boxes are on every board; dashed boxes need parts you add (PSRAM chip, MagJack kit, host cable, coin cell)</text><rect x="270" y="170" width="220" height="170" rx="8" fill="#ececec" stroke="#111111" stroke-width="2.5"></rect><text x="380" y="202" text-anchor="middle" font-size="15" font-weight="600" fill="#111111">NXP i.MX RT1062</text><text x="380" y="224" text-anchor="middle" fill="#111111">ARM Cortex-M7, 600 MHz</text><text x="380" y="246" text-anchor="middle" font-size="11.5" fill="#444444">double-precision FPU</text><text x="380" y="272" text-anchor="middle" fill="#111111">1 MB RAM</text><text x="380" y="290" text-anchor="middle" font-size="11.5" fill="#444444">512 KB fast (RAM1, TCM)</text><text x="380" y="306" text-anchor="middle" font-size="11.5" fill="#444444">+ 512 KB (RAM2, DMA)</text><text x="380" y="326" text-anchor="middle" font-size="11.5" fill="#444444">runs on 3.3 V I/O</text><g><rect x="24" y="80" width="200" height="66" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.4" stroke-dasharray="none"></rect><text x="124" y="102" text-anchor="middle" font-weight="600" fill="#111111">USB device port</text><text x="124" y="120" text-anchor="middle" font-size="11.5" fill="#444444">micro-B to your Mac</text><text x="124" y="135" text-anchor="middle" font-size="11.5" fill="#444444">Serial, MIDI, Keyboard, Audio…</text></g><g><rect x="24" y="170" width="200" height="66" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.4" stroke-dasharray="6 4"></rect><text x="124" y="192" text-anchor="middle" font-weight="600" fill="#111111">USB host port</text><text x="124" y="210" text-anchor="middle" font-size="11.5" fill="#444444">5 pads: +5V D− D+ GND GND</text><text x="124" y="225" text-anchor="middle" font-size="11.5" fill="#444444">keyboards, MIDI, drives</text></g><g><rect x="24" y="260" width="200" height="66" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.4" stroke-dasharray="6 4"></rect><text x="124" y="282" text-anchor="middle" font-weight="600" fill="#111111">Ethernet PHY</text><text x="124" y="300" text-anchor="middle" font-size="11.5" fill="#444444">DP83825, 10/100 Mbit/s</text><text x="124" y="315" text-anchor="middle" font-size="11.5" fill="#444444">6 pads → MagJack kit</text></g><g><rect x="24" y="350" width="200" height="66" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.4" stroke-dasharray="none"></rect><text x="124" y="372" text-anchor="middle" font-weight="600" fill="#111111">microSD socket</text><text x="124" y="390" text-anchor="middle" font-size="11.5" fill="#444444">4-bit SDIO, fast</text><text x="124" y="405" text-anchor="middle" font-size="11.5" fill="#444444">SD.begin(BUILTIN_SDCARD)</text></g><g><rect x="536" y="80" width="200" height="66" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.4" stroke-dasharray="none"></rect><text x="636" y="102" text-anchor="middle" font-weight="600" fill="#111111">8 MB QSPI flash</text><text x="636" y="120" text-anchor="middle" font-size="11.5" fill="#444444">your program (7936 KB)</text><text x="636" y="135" text-anchor="middle" font-size="11.5" fill="#444444">EEPROM emulation, LittleFS</text></g><g><rect x="536" y="170" width="200" height="66" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.4" stroke-dasharray="6 4"></rect><text x="636" y="192" text-anchor="middle" font-weight="600" fill="#111111">PSRAM pads</text><text x="636" y="210" text-anchor="middle" font-size="11.5" fill="#444444">two 8-pin footprints</text><text x="636" y="225" text-anchor="middle" font-size="11.5" fill="#444444">up to 2 × 8 MB, "EXTMEM"</text></g><g><rect x="536" y="260" width="200" height="66" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.4" stroke-dasharray="none"></rect><text x="636" y="282" text-anchor="middle" font-weight="600" fill="#111111">Real-time clock</text><text x="636" y="300" text-anchor="middle" font-size="11.5" fill="#444444">32.768 kHz crystal on board</text><text x="636" y="315" text-anchor="middle" font-size="11.5" fill="#444444">VBAT pad: CR2032 keeps time</text></g><g><rect x="536" y="350" width="200" height="66" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.4" stroke-dasharray="none"></rect><text x="636" y="372" text-anchor="middle" font-weight="600" fill="#111111">Power</text><text x="636" y="390" text-anchor="middle" font-size="11.5" fill="#444444">5 V (USB or VIN) → 3.3 V</text><text x="636" y="405" text-anchor="middle" font-size="11.5" fill="#444444">regulator; 250 mA spare</text></g><rect x="24" y="446" width="712" height="58" rx="6" fill="#ffffff" stroke="#111111" stroke-width="2"></rect><text x="380" y="468" text-anchor="middle" font-weight="600" fill="#111111">55 I/O pins (42 on the breadboard rows): all digital, all with interrupts</text><text x="380" y="488" text-anchor="middle" font-size="11.5" fill="#444444">18 analog in · 35 PWM · 8 serial · 3 I2C · 3 SPI · 3 CAN · I2S, S/PDIF and MQS audio · 4 mA per pin, 3.3 V only</text><path d="M226 113H300V168" fill="none" stroke="#111111" stroke-width="1.5" stroke-dasharray="none" marker-end="url(#blk-arrow)" marker-start="url(#blk-arrow)"></path><path d="M226 203H268" fill="none" stroke="#111111" stroke-width="1.5" stroke-dasharray="none" marker-end="url(#blk-arrow)" marker-start="url(#blk-arrow)"></path><path d="M226 293H268" fill="none" stroke="#111111" stroke-width="1.5" stroke-dasharray="none" marker-end="url(#blk-arrow)" marker-start="url(#blk-arrow)"></path><path d="M226 383H300V342" fill="none" stroke="#111111" stroke-width="1.5" stroke-dasharray="none" marker-end="url(#blk-arrow)" marker-start="url(#blk-arrow)"></path><path d="M534 113H460V168" fill="none" stroke="#111111" stroke-width="1.5" stroke-dasharray="none" marker-end="url(#blk-arrow)" marker-start="url(#blk-arrow)"></path><path d="M534 203H492" fill="none" stroke="#111111" stroke-width="1.5" stroke-dasharray="none" marker-end="url(#blk-arrow)" marker-start="url(#blk-arrow)"></path><path d="M534 293H492" fill="none" stroke="#111111" stroke-width="1.5" stroke-dasharray="none" marker-end="url(#blk-arrow)" marker-start="url(#blk-arrow)"></path><path d="M534 383H460V342" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#blk-arrow)"></path><path d="M380 342V444" fill="none" stroke="#111111" stroke-width="1.5" stroke-dasharray="none" marker-end="url(#blk-arrow)" marker-start="url(#blk-arrow)"></path></svg>
