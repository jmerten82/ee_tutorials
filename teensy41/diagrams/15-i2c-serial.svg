<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 570" role="img" aria-label="I2C bus with sensor and OLED; serial loopback" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><text x="24" y="30" font-size="15" font-weight="600" fill="#111111">Talking to other chips: an I2C bus and two serial ports</text><text x="24" y="50" font-size="11.5" fill="#444444">I2C: two shared wires, every chip has an address. Serial: one wire each way, TX always goes to RX</text><rect x="24" y="76" width="120" height="164" rx="6" fill="#ececec" stroke="#111111" stroke-width="2"></rect><text x="34" y="96" font-size="11.5" font-weight="600" fill="#111111">Teensy 4.1</text><g><text x="136" y="104" text-anchor="end" font-size="11.5" font-weight="600" fill="#111111">3.3V</text><path d="M144 100H720" stroke="#111111" stroke-width="1.5"></path></g><g><text x="136" y="164" text-anchor="end" font-size="11.5" font-weight="600" fill="#111111">18 SDA</text><path d="M144 160H720" stroke="#111111" stroke-width="2"></path></g><g><text x="136" y="194" text-anchor="end" font-size="11.5" font-weight="600" fill="#111111">19 SCL</text><path d="M144 190H720" stroke="#111111" stroke-width="2"></path></g><g><text x="136" y="224" text-anchor="end" font-size="11.5" font-weight="600" fill="#111111">GND</text><path d="M144 220H720" stroke="#111111" stroke-width="1.5"></path></g><text x="724" y="104" font-size="11.5" fill="#111111">3.3V</text><text x="724" y="164" font-size="11.5" fill="#111111">SDA</text><text x="724" y="194" font-size="11.5" fill="#111111">SCL</text><text x="724" y="224" font-size="11.5" fill="#111111">GND</text><rect x="190" y="112" width="14" height="34" fill="#ffffff" stroke="#111111" stroke-width="1.3" stroke-dasharray="3 2"></rect><rect x="230" y="112" width="14" height="34" fill="#ffffff" stroke="#111111" stroke-width="1.3" stroke-dasharray="3 2"></rect><path d="M197 100V112M197 146V160M237 100V112M237 146V190" fill="none" stroke="#111111" stroke-width="1.3"></path><circle cx="197" cy="100" r="3.5" fill="#111111"></circle><circle cx="197" cy="160" r="3.5" fill="#111111"></circle><circle cx="237" cy="100" r="3.5" fill="#111111"></circle><circle cx="237" cy="190" r="3.5" fill="#111111"></circle><text x="256" y="126" font-size="11.5" fill="#111111">4.7 kΩ pull-ups</text><text x="256" y="142" font-size="11.5" fill="#444444">usually already on the breakouts</text><g><rect x="440" y="270" width="140" height="70" rx="6" fill="#ececec" stroke="#111111" stroke-width="1.5"></rect><text x="510" y="310" text-anchor="middle" font-weight="600" fill="#111111">BME280</text><text x="510" y="328" text-anchor="middle" font-size="11.5" fill="#444444">address 0x76 or 0x77</text><g><path d="M460 100V270" stroke="#111111" stroke-width="1.5"></path><circle cx="460" cy="100" r="3.5" fill="#111111"></circle><text x="460" y="288" text-anchor="middle" font-size="11.5" fill="#111111">VIN</text></g><g><path d="M490 220V270" stroke="#111111" stroke-width="1.5"></path><circle cx="490" cy="220" r="3.5" fill="#111111"></circle><text x="490" y="288" text-anchor="middle" font-size="11.5" fill="#111111">GND</text></g><g><path d="M520 190V270" stroke="#111111" stroke-width="1.5"></path><circle cx="520" cy="190" r="3.5" fill="#111111"></circle><text x="520" y="288" text-anchor="middle" font-size="11.5" fill="#111111">SCL</text></g><g><path d="M550 160V270" stroke="#111111" stroke-width="1.5"></path><circle cx="550" cy="160" r="3.5" fill="#111111"></circle><text x="550" y="288" text-anchor="middle" font-size="11.5" fill="#111111">SDA</text></g></g><g><rect x="596" y="270" width="140" height="70" rx="6" fill="#ececec" stroke="#111111" stroke-width="1.5"></rect><text x="666" y="310" text-anchor="middle" font-weight="600" fill="#111111">SSD1306 OLED</text><text x="666" y="328" text-anchor="middle" font-size="11.5" fill="#444444">128 × 64, addr 0x3C</text><g><path d="M616 220V270" stroke="#111111" stroke-width="1.5"></path><circle cx="616" cy="220" r="3.5" fill="#111111"></circle><text x="616" y="288" text-anchor="middle" font-size="11.5" fill="#111111">GND</text></g><g><path d="M646 100V270" stroke="#111111" stroke-width="1.5"></path><circle cx="646" cy="100" r="3.5" fill="#111111"></circle><text x="646" y="288" text-anchor="middle" font-size="11.5" fill="#111111">VCC</text></g><g><path d="M676 190V270" stroke="#111111" stroke-width="1.5"></path><circle cx="676" cy="190" r="3.5" fill="#111111"></circle><text x="676" y="288" text-anchor="middle" font-size="11.5" fill="#111111">SCL</text></g><g><path d="M706 160V270" stroke="#111111" stroke-width="1.5"></path><circle cx="706" cy="160" r="3.5" fill="#111111"></circle><text x="706" y="288" text-anchor="middle" font-size="11.5" fill="#111111">SDA</text></g></g><text x="24" y="366" font-size="11.5" fill="#444444">Use 3.3 V breakouts (or ones with a regulator and pull-ups to 3.3 V). Read the pin names on your board: OLED orders vary.</text><path d="M24 384H736" stroke="#bbbbbb" stroke-width="1"></path><text x="24" y="410" font-weight="600" fill="#111111">Serial loopback: no parts, two jumpers</text><rect x="24" y="426" width="120" height="124" rx="6" fill="#ececec" stroke="#111111" stroke-width="2"></rect><text x="34" y="446" font-size="11.5" font-weight="600" fill="#111111">Teensy 4.1</text><g><text x="136" y="464" text-anchor="end" font-size="11.5" font-weight="600" fill="#111111">0 RX1</text><path d="M144 460H170" stroke="#111111" stroke-width="1.5"></path></g><g><text x="136" y="488" text-anchor="end" font-size="11.5" font-weight="600" fill="#111111">1 TX1</text><path d="M144 484H170" stroke="#111111" stroke-width="1.5"></path></g><g><text x="136" y="512" text-anchor="end" font-size="11.5" font-weight="600" fill="#111111">7 RX2</text><path d="M144 508H170" stroke="#111111" stroke-width="1.5"></path></g><g><text x="136" y="536" text-anchor="end" font-size="11.5" font-weight="600" fill="#111111">8 TX2</text><path d="M144 532H170" stroke="#111111" stroke-width="1.5"></path></g><path d="M170 484C230 484 230 508 170 508" fill="none" stroke="#111111" stroke-width="2.6"></path><path d="M170 532C290 532 290 460 170 460" fill="none" stroke="#111111" stroke-width="2.6"></path><text x="300" y="466" font-size="11.5" fill="#111111">Serial1.print() leaves on TX1 and arrives on RX2: Serial2.read().</text><text x="300" y="486" font-size="11.5" fill="#111111">Serial2.print() leaves on TX2 and arrives on RX1.</text><text x="300" y="510" font-size="11.5" fill="#111111">A real device (GPS, MIDI DIN, another board): its TX to a Teensy RX,</text><text x="300" y="528" font-size="11.5" fill="#111111">its RX to a Teensy TX, grounds joined, 3.3 V levels only.</text></svg>
