<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 430" role="img" aria-label="USB Type menu and what the Mac sees" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><defs><marker id="ut-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#000000"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="700" fill="#000000">One board, many devices: the USB Type menu</text><text x="24" y="50" font-size="12.5" fill="#000000">The choice is compiled into your sketch. After each upload the Teensy reconnects as the new kind of device</text><g><rect x="24" y="76" width="164" height="62" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><circle cx="42" cy="96" r="10" fill="#000000"></circle><text x="42" y="100" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">1</text><text x="58" y="100" font-weight="700" fill="#000000">Tools ▸ USB Type</text><text x="36" y="124" font-size="12.5" fill="#000000">pick a device type</text></g><g><rect x="212" y="76" width="164" height="62" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><circle cx="230" cy="96" r="10" fill="#000000"></circle><text x="230" y="100" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">2</text><text x="246" y="100" font-weight="700" fill="#000000">Upload</text><text x="224" y="124" font-size="12.5" fill="#000000">Teensy restarts</text></g><g><rect x="400" y="76" width="164" height="62" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><circle cx="418" cy="96" r="10" fill="#000000"></circle><text x="418" y="100" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">3</text><text x="434" y="100" font-weight="700" fill="#000000">macOS enumerates</text><text x="412" y="124" font-size="12.5" fill="#000000">reads the new descriptors</text></g><g><rect x="588" y="76" width="164" height="62" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><circle cx="606" cy="96" r="10" fill="#000000"></circle><text x="606" y="100" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">4</text><text x="622" y="100" font-weight="700" fill="#000000">New device</text><text x="600" y="124" font-size="12.5" fill="#000000">ready in 1–2 seconds</text></g><path d="M190 107H210" fill="none" stroke="#000000" stroke-width="2.25" marker-end="url(#ut-arrow)"></path><path d="M378 107H398" fill="none" stroke="#000000" stroke-width="2.25" marker-end="url(#ut-arrow)"></path><path d="M566 107H586" fill="none" stroke="#000000" stroke-width="2.25" marker-end="url(#ut-arrow)"></path><rect x="24" y="162" width="712" height="28" fill="#000000"></rect><text x="34" y="181" font-weight="700" fill="#ffffff">USB Type</text><text x="284" y="181" font-weight="700" fill="#ffffff">The Mac sees</text><text x="510" y="181" font-weight="700" fill="#ffffff">Where you find it</text><g><rect x="24" y="190" width="712" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.5"></rect><text x="34" y="213" font-size="12.5" font-weight="700" fill="#000000">Serial (default)</text><text x="284" y="213" font-size="12.5" fill="#000000">a serial port /dev/cu.usbmodem…</text><text x="510" y="213" font-size="12.5" fill="#000000">Arduino Serial Monitor, any terminal</text></g><g><rect x="24" y="226" width="712" height="36" fill="#dedede" stroke="#000000" stroke-width="1.5"></rect><text x="34" y="249" font-size="12.5" font-weight="700" fill="#000000">MIDI  /  Serial + MIDI</text><text x="284" y="249" font-size="12.5" fill="#000000">"Teensy MIDI" MIDI device</text><text x="510" y="249" font-size="12.5" fill="#000000">Audio MIDI Setup, any DAW</text></g><g><rect x="24" y="262" width="712" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.5"></rect><text x="34" y="285" font-size="12.5" font-weight="700" fill="#000000">Keyboard (+ Mouse …)</text><text x="284" y="285" font-size="12.5" fill="#000000">a USB keyboard</text><text x="510" y="285" font-size="12.5" fill="#000000">Keyboard Setup Assistant may pop up</text></g><g><rect x="24" y="298" width="712" height="36" fill="#dedede" stroke="#000000" stroke-width="1.5"></rect><text x="34" y="321" font-size="12.5" font-weight="700" fill="#000000">Audio  /  Serial + MIDI + Audio</text><text x="284" y="321" font-size="12.5" fill="#000000">a 44.1 kHz sound card</text><text x="510" y="321" font-size="12.5" fill="#000000">System Settings ▸ Sound</text></g><g><rect x="24" y="334" width="712" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.5"></rect><text x="34" y="357" font-size="12.5" font-weight="700" fill="#000000">MTP Disk (Experimental)</text><text x="284" y="357" font-size="12.5" fill="#000000">a media device</text><text x="510" y="357" font-size="12.5" fill="#000000">needs an MTP app on macOS</text></g><path d="M274 190V370M500 190V370" stroke="#000000" stroke-width="1.5"></path><text x="24" y="396" font-size="12.5" fill="#000000">Types without "Serial" still let Serial.print() reach the Arduino Serial Monitor through an emulated port.</text><text x="24" y="414" font-size="12.5" fill="#000000">If uploads stop working after a type change, press the Program button once: the bootloader is always reachable.</text></svg>
