<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 520" role="img" aria-label="MOSFET low-side driver for a 12 V LED strip and a motor" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><defs><marker id="mf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#000000"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="700" fill="#000000">Switching 12 V loads: a logic-level MOSFET on the low side</text><text x="24" y="50" font-size="12.5" fill="#000000">The Teensy only drives the gate. The 12 V current flows supply → load → drain → source → ground and never touches a pin</text><text x="24" y="80" font-weight="700" fill="#000000">A. 12 V LED strip (dimming)</text><path d="M60 104H330" stroke="#000000" stroke-width="2.7"></path><text x="64" y="98" font-size="12.5" font-weight="700" fill="#000000">+12 V</text><rect x="232" y="126" width="96" height="40" rx="4" fill="#dedede" stroke="#000000" stroke-width="2.25"></rect><text x="280" y="144" text-anchor="middle" font-size="12.5" font-weight="700" fill="#000000">LED strip</text><text x="280" y="159" text-anchor="middle" font-size="12.5" fill="#000000">12 V, ≤ 3 A</text><path d="M250 104V126M250 166V226" fill="none" stroke="#000000" stroke-width="2.25"></path><g><path d="M210 260H230M230 244V276" fill="none" stroke="#000000" stroke-width="2.7"></path><path d="M236 242V250M236 256V264M236 270V278" fill="none" stroke="#000000" stroke-width="3.9"></path><path d="M236 246H250V226M236 274H250V294M250 260V274" fill="none" stroke="#000000" stroke-width="2.25"></path><path d="M250 260H238" fill="none" stroke="#000000" stroke-width="2.25" marker-end="url(#mf-arrow)"></path><text x="213" y="252" font-size="12.5" fill="#000000">G</text><text x="256" y="238" font-size="12.5" fill="#000000">D</text><text x="256" y="290" font-size="12.5" fill="#000000">S</text></g><g><path d="M61 260H94M144 260H210M200 260V284M200 324V340" fill="none" stroke="#000000" stroke-width="2.25"></path><rect x="47" y="253" width="14" height="14" fill="#ffffff" stroke="#000000" stroke-width="2.4"></rect><text x="47" y="246" font-size="12.5" font-weight="700" fill="#000000">pin 5</text><rect x="94" y="252" width="50" height="16" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><text x="119" y="246" text-anchor="middle" font-size="12.5" fill="#000000">100 Ω</text><rect x="192" y="284" width="16" height="40" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><text x="186" y="308" text-anchor="end" font-size="12.5" fill="#000000">10 kΩ</text><circle cx="200" cy="260" r="3.5" fill="#000000"></circle></g><path d="M250 294V340M200 340H250" fill="none" stroke="#000000" stroke-width="2.25"></path><circle cx="250" cy="340" r="3.5" fill="#000000"></circle><path d="M250 340V348M239 348H261M243 353H257M247 358H253" fill="none" stroke="#000000" stroke-width="2.25"></path><text x="264" y="358" font-size="12.5" fill="#000000">supply − and</text><text x="264" y="374" font-size="12.5" fill="#000000">Teensy GND</text><path d="M370 70V400" stroke="#000000" stroke-width="1.5"></path><text x="390" y="80" font-weight="700" fill="#000000">B. DC motor (speed control)</text><path d="M420 104H720" stroke="#000000" stroke-width="2.7"></path><text x="424" y="98" font-size="12.5" font-weight="700" fill="#000000">+12 V</text><circle cx="610" cy="152" r="22" fill="#dedede" stroke="#000000" stroke-width="2.25"></circle><text x="610" y="157" text-anchor="middle" font-weight="700" fill="#000000">M</text><path d="M610 104V130M610 174V226M610 196H686V170M686 138V104" fill="none" stroke="#000000" stroke-width="2.25"></path><polygon points="674,170 698,170 686,148" fill="#ffffff" stroke="#000000" stroke-width="2.25"></polygon><path d="M672 146H700" stroke="#000000" stroke-width="4.2"></path><path d="M686 146V138" stroke="#000000" stroke-width="2.25"></path><text x="706" y="158" font-size="12.5" font-weight="700" fill="#000000">D1</text><text x="706" y="174" font-size="12.5" fill="#000000">1N5819</text><text x="706" y="190" font-size="12.5" fill="#000000">band up</text><circle cx="610" cy="196" r="3.5" fill="#000000"></circle><circle cx="686" cy="104" r="3.5" fill="#000000"></circle><circle cx="610" cy="104" r="3.5" fill="#000000"></circle><g><path d="M570 260H590M590 244V276" fill="none" stroke="#000000" stroke-width="2.7"></path><path d="M596 242V250M596 256V264M596 270V278" fill="none" stroke="#000000" stroke-width="3.9"></path><path d="M596 246H610V226M596 274H610V294M610 260V274" fill="none" stroke="#000000" stroke-width="2.25"></path><path d="M610 260H598" fill="none" stroke="#000000" stroke-width="2.25" marker-end="url(#mf-arrow)"></path><text x="573" y="252" font-size="12.5" fill="#000000">G</text><text x="616" y="238" font-size="12.5" fill="#000000">D</text><text x="616" y="290" font-size="12.5" fill="#000000">S</text></g><g><path d="M421 260H454M504 260H570M560 260V284M560 324V340" fill="none" stroke="#000000" stroke-width="2.25"></path><rect x="407" y="253" width="14" height="14" fill="#ffffff" stroke="#000000" stroke-width="2.4"></rect><text x="407" y="246" font-size="12.5" font-weight="700" fill="#000000">pin 5</text><rect x="454" y="252" width="50" height="16" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><text x="479" y="246" text-anchor="middle" font-size="12.5" fill="#000000">100 Ω</text><rect x="552" y="284" width="16" height="40" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><text x="546" y="308" text-anchor="end" font-size="12.5" fill="#000000">10 kΩ</text><circle cx="560" cy="260" r="3.5" fill="#000000"></circle></g><path d="M610 294V340M560 340H610" fill="none" stroke="#000000" stroke-width="2.25"></path><circle cx="610" cy="340" r="3.5" fill="#000000"></circle><path d="M610 340V348M599 348H621M603 353H617M607 358H613" fill="none" stroke="#000000" stroke-width="2.25"></path><text x="624" y="358" font-size="12.5" fill="#000000">common ground</text><path d="M24 412H736" stroke="#000000" stroke-width="1.5"></path><text x="24" y="436" font-size="12.5" fill="#000000">Q1: IRLB8721 (TO-220, logic-level, 30 V). Facing the printed side, legs left to right: G, D, S. Use one for each load.</text><text x="24" y="456" font-size="12.5" fill="#000000">100 Ω: limits the pin current while the gate charges. 10 kΩ: holds the gate low while the Teensy boots or is unplugged.</text><text x="24" y="476" font-size="12.5" fill="#000000">D1: a motor, relay or solenoid kicks back when switched off; the diode catches it. Band (cathode) to +12 V. LEDs need none.</text><text x="24" y="496" font-size="12.5" fill="#000000">Never connect +12 V to any Teensy pin. Only the grounds are joined. No mains, ever.</text></svg>
