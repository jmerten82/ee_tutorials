xt><path d="M440 330H580M440 360H580" stroke="#000000" stroke-width="2.7"></path><rect x="580" y="312" width="150" height="66" rx="5" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><text x="588" y="334" font-size="12.5" fill="#000000">SDA</text><text x="588" y="364" font-size="12.5" fill="#000000">SCL</text><text x="690" y="340" text-anchor="middle" font-size="12.5" font-weight="700" fill="#000000">OLED</text><text x="690" y="356" text-anchor="middle" font-size="12.5" fill="#000000">SSD1306</text><text x="655" y="394" text-anchor="middle" font-size="12.5" fill="#000000">VCC 3.3V, GND, addr 0x3C</text><text x="434" y="424" text-anchor="end" font-size="12.5" font-weight="700" fill="#000000">12 MQSL</text><text x="434" y="454" text-anchor="end" font-size="12.5" font-weight="700" fill="#000000">10 MQSR</text><path d="M440 420H520M440 450H520M620 420H650M620 450H650" stroke="#000000" stroke-width="2.25"></path><rect x="520" y="406" width="100" height="58" rx="5" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><text x="570" y="430" text-anchor="middle" font-size="12.5" font-weight="700" fill="#000000">2 × RC filter</text><text x="570" y="448" text-anchor="middle" font-size="12.5" fill="#000000">as drawing 14</text><rect x="650" y="406" width="80" height="58" rx="5" fill="#dedede" stroke="#000000" stroke-width="2.25"></rect><text x="690" y="430" text-anchor="middle" font-size="12.5" font-weight="700" fill="#000000">jack</text><text x="690" y="448" text-anchor="middle" font-size="12.5" fill="#000000">→ speakers</text><text x="434" y="504" text-anchor="end" font-size="12.5" font-weight="700" fill="#000000">3.3V</text><path d="M440 500H480" stroke="#000000" stroke-width="2.25"></path><text x="486" y="504" font-size="12.5" fill="#000000">to pots and OLED VCC (≈ 25 mA total)</text><text x="434" y="528" text-anchor="end" font-size="12.5" font-weight="700" fill="#000000">GND</text><path d="M440 524H480V530" fill="none" stroke="#000000" stroke-width="2.25"></path><path d="M480 530V538M469 538H491M473 543H487M477 548H483" fill="none" stroke="#000000" stroke-width="2.25"></path><path d="M24 566H736" stroke="#000000" stroke-width="1.5"></path><text x="24" y="588" font-size="12.5" fill="#000000">Pins used: 2–9 keys, 14–17 knobs, 18–19 I2C, 10 and 12 audio. Free for extensions: 0, 1, 11, 13 (LED), 20–41.</text><text x="24" y="606" font-size="12.5" fill="#000000">MQS uses 10 and 12, so the SPI port (10–13) is not available in this project; the SD card and I2C are unaffected.</text></svg>
