<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 470" role="img" aria-label="MQS audio output with RC filter" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><defs><marker id="mq-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#000000"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="700" fill="#000000">Sound without a shield: MQS on pins 12 and 10</text><text x="24" y="50" font-size="12.5" fill="#000000">MQS is a fast pulse stream; a simple RC filter smooths it into an audio signal for an amplifier or powered speakers</text><text x="24" y="82" font-weight="700" fill="#000000">In the sketch (Audio library)</text><g><rect x="24" y="96" width="150" height="48" rx="5" fill="#dedede" stroke="#000000" stroke-width="2.25"></rect><text x="99" y="116" text-anchor="middle" font-size="12.5" font-weight="700" fill="#000000">AudioSynthWaveform</text><text x="99" y="133" text-anchor="middle" font-size="12.5" fill="#000000">osc</text></g><g><rect x="214" y="96" width="150" height="48" rx="5" fill="#dedede" stroke="#000000" stroke-width="2.25"></rect><text x="289" y="116" text-anchor="middle" font-size="12.5" font-weight="700" fill="#000000">AudioEffectEnvelope</text><text x="289" y="133" text-anchor="middle" font-size="12.5" fill="#000000">env</text></g><g><rect x="404" y="96" width="150" height="48" rx="5" fill="#dedede" stroke="#000000" stroke-width="2.25"></rect><text x="479" y="116" text-anchor="middle" font-size="12.5" font-weight="700" fill="#000000">AudioOutputMQS</text><text x="479" y="133" text-anchor="middle" font-size="12.5" fill="#000000">mqs: in 0 = L, in 1 = R</text></g><path d="M174 120H212" fill="none" stroke="#000000" stroke-width="2.25" marker-end="url(#mq-arrow)"></path><path d="M364 112H402" fill="none" stroke="#000000" stroke-width="2.25" marker-end="url(#mq-arrow)"></path><path d="M364 128H402" fill="none" stroke="#000000" stroke-width="2.25" marker-end="url(#mq-arrow)"></path><text x="584" y="112" font-size="12.5" fill="#000000">AudioMemory(20);</text><text x="584" y="130" font-size="12.5" fill="#000000">one AudioConnection</text><text x="584" y="146" font-size="12.5" fill="#000000">per arrow</text><path d="M24 172H736" stroke="#000000" stroke-width="1.5"></path><text x="24" y="200" font-weight="700" fill="#000000">On the breadboard (same for both channels)</text><g><rect x="110" y="239" width="14" height="14" fill="#ffffff" stroke="#000000" stroke-width="2.4"></rect><text x="100" y="250" text-anchor="end" font-size="12.5" font-weight="700" fill="#000000">pin 12 L</text><path d="M124 246H170M230 246H330M370 246H520" fill="none" stroke="#000000" stroke-width="2.25"></path><rect x="170" y="238" width="60" height="16" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><text x="200" y="232" text-anchor="middle" font-size="12.5" fill="#000000">2.2 kΩ</text><circle cx="270" cy="246" r="3.5" fill="#000000"></circle><path d="M270 246V268M270 276V290" fill="none" stroke="#000000" stroke-width="2.25"></path><path d="M258 268H282M258 276H282" stroke="#000000" stroke-width="3.6"></path><text x="288" y="276" font-size="12.5" fill="#000000">4.7 nF</text><path d="M270 290V298M259 298H281M263 303H277M267 308H273" fill="none" stroke="#000000" stroke-width="2.25"></path><path d="M346 234V258" stroke="#000000" stroke-width="3.6"></path><path d="M354 234V258" stroke="#000000" stroke-width="3.6"></path><path d="M330 246H346M354 246H370" stroke="#000000" stroke-width="2.25"></path><text x="336" y="230" font-size="12.5" fill="#000000">+</text><text x="350" y="276" text-anchor="middle" font-size="12.5" fill="#000000">10 µF</text></g><g><rect x="110" y="349" width="14" height="14" fill="#ffffff" stroke="#000000" stroke-width="2.4"></rect><text x="100" y="360" text-anchor="end" font-size="12.5" font-weight="700" fill="#000000">pin 10 R</text><path d="M124 356H170M230 356H330M370 356H520" fill="none" stroke="#000000" stroke-width="2.25"></path><rect x="170" y="348" width="60" height="16" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><text x="200" y="342" text-anchor="middle" font-size="12.5" fill="#000000">2.2 kΩ</text><circle cx="270" cy="356" r="3.5" fill="#000000"></circle><path d="M270 356V378M270 386V400" fill="none" stroke="#000000" stroke-width="2.25"></path><path d="M258 378H282M258 386H282" stroke="#000000" stroke-width="3.6"></path><text x="288" y="386" font-size="12.5" fill="#000000">4.7 nF</text><path d="M270 400V408M259 408H281M263 413H277M267 418H273" fill="none" stroke="#000000" stroke-width="2.25"></path><path d="M346 344V368" stroke="#000000" stroke-width="3.6"></path><path d="M354 344V368" stroke="#000000" stroke-width="3.6"></path><path d="M330 356H346M354 356H370" stroke="#000000" stroke-width="2.25"></path><text x="336" y="340" font-size="12.5" fill="#000000">+</text><text x="350" y="386" text-anchor="middle" font-size="12.5" fill="#000000">10 µF</text></g><rect x="520" y="220" width="92" height="160" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><text x="566" y="214" text-anchor="middle" font-size="12.5" font-weight="700" fill="#000000">3.5 mm jack</text><text x="530" y="250" font-size="12.5" fill="#000000">T</text><text x="530" y="360" font-size="12.5" fill="#000000">R</text><text x="530" y="310" font-size="12.5" fill="#000000">S</text><path d="M612 300H640V316" fill="none" stroke="#000000" stroke-width="2.25"></path><path d="M640 316V324M629 324H651M633 329H647M637 334H643" fill="none" stroke="#000000" stroke-width="2.25"></path><text x="520" y="400" font-size="12.5" fill="#000000">tip = left, ring = right,</text><text x="520" y="416" font-size="12.5" fill="#000000">sleeve = GND</text><text x="650" y="236" font-size="12.5" font-weight="700" fill="#000000">to</text><text x="650" y="252" font-size="12.5" fill="#000000">powered</text><text x="650" y="268" font-size="12.5" fill="#000000">speakers</text><text x="650" y="284" font-size="12.5" fill="#000000">(line in)</text><text x="24" y="444" font-size="12.5" fill="#000000">2.2 kΩ with 4.7 nF rolls off above ≈ 15 kHz and keeps the pin current under 1.5 mA. 10 µF blocks the 1.65 V DC offset.</text><text x="24" y="462" font-size="12.5" fill="#000000">Not for headphones directly: they need more current than a pin can give, and full-scale output is loud. Start with the volume low.</text></svg>
