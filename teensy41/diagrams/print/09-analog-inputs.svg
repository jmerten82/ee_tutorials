<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 470" role="img" aria-label="Potentiometer and battery divider on analog inputs" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><defs><marker id="an-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#000000"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="700" fill="#000000">Analog in: a knob on A0, a 12 V battery on A1</text><text x="24" y="50" font-size="12.5" fill="#000000">The ADC measures 0–3.3 V only. Anything bigger is scaled down first, with resistors that also limit fault current</text><text x="24" y="86" font-weight="700" fill="#000000">A. Potentiometer (10 kΩ linear)</text><g fill="none" stroke="#000000" stroke-width="2.25"><path d="M100 112V140"></path><path d="M100 220V250"></path><path d="M120 180H180"></path></g><text x="108" y="110" font-size="12.5" fill="#000000">3.3V pin</text><rect x="92" y="140" width="16" height="80" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><path d="M134 180H112" stroke="#000000" stroke-width="2.25" marker-end="url(#an-arrow)"></path><text x="74" y="176" text-anchor="end" font-size="12.5" fill="#000000">10 kΩ</text><text x="74" y="192" text-anchor="end" font-size="12.5" fill="#000000">wiper</text><path d="M100 250V258M89 258H111M93 263H107M97 268H103" fill="none" stroke="#000000" stroke-width="2.25"></path><g><rect x="179" y="173" width="14" height="14" fill="#ffffff" stroke="#000000" stroke-width="2.4"></rect><text x="198" y="184" font-size="12.5" font-weight="700" fill="#000000">A0 (pin 14)</text></g><text x="24" y="300" font-size="12.5" fill="#000000">reads 0 … 1023 as you turn it</text><text x="24" y="318" font-size="12.5" fill="#000000">outer legs to 3.3V and GND,</text><text x="24" y="334" font-size="12.5" fill="#000000">never to VIN or 5 V</text><path d="M290 70V450" stroke="#000000" stroke-width="1.5"></path><text x="310" y="86" font-weight="700" fill="#000000">B. 12 V battery divider</text><g fill="none" stroke="#000000" stroke-width="2.25"><path d="M380 112V130"></path><path d="M380 190V280"></path><path d="M380 230H470"></path><path d="M380 240H430V262"></path><path d="M380 340V360"></path><path d="M430 270V360H380"></path></g><text x="388" y="110" font-size="12.5" font-weight="700" fill="#000000">+12 V battery</text><rect x="372" y="130" width="16" height="60" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><rect x="372" y="280" width="16" height="60" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><text x="366" y="158" text-anchor="end" font-weight="700" fill="#000000">R1</text><text x="366" y="174" text-anchor="end" font-size="12.5" fill="#000000">47 kΩ</text><text x="366" y="308" text-anchor="end" font-weight="700" fill="#000000">R2</text><text x="366" y="324" text-anchor="end" font-size="12.5" fill="#000000">10 kΩ</text><path d="M418 262H442M418 270H442" stroke="#000000" stroke-width="3.6"></path><text x="448" y="274" font-size="12.5" fill="#000000">100 nF</text><circle cx="380" cy="230" r="3.5" fill="#000000"></circle><circle cx="380" cy="240" r="3.5" fill="#000000"></circle><circle cx="380" cy="360" r="3.5" fill="#000000"></circle><g><rect x="469" y="223" width="14" height="14" fill="#ffffff" stroke="#000000" stroke-width="2.4"></rect><text x="488" y="234" font-size="12.5" font-weight="700" fill="#000000">A1 (pin 15)</text></g><path d="M380 360V368M369 368H391M373 373H387M377 378H383" fill="none" stroke="#000000" stroke-width="2.25"></path><text x="394" y="396" font-size="12.5" fill="#000000">battery − and Teensy GND joined</text><text x="560" y="112" font-weight="700" fill="#000000">The numbers</text><text x="560" y="134" font-size="12.5" fill="#000000">ratio = (R1 + R2) / R2 = 5.7</text><text x="560" y="154" font-size="12.5" fill="#000000">12.6 V in → 2.21 V at A1</text><text x="560" y="174" font-size="12.5" fill="#000000">full scale: 3.3 × 5.7 = 18.8 V</text><text x="560" y="194" font-size="12.5" fill="#000000">one step: 18.8 V / 1024 ≈ 18 mV</text><text x="560" y="224" font-weight="700" fill="#000000">Protection</text><text x="560" y="246" font-size="12.5" fill="#000000">24 V by mistake: 4.2 V at A1,</text><text x="560" y="264" font-size="12.5" fill="#000000">but R1 limits the clamp current</text><text x="560" y="282" font-size="12.5" fill="#000000">to well under 0.5 mA</text><text x="560" y="312" font-weight="700" fill="#000000">Why the 100 nF</text><text x="560" y="334" font-size="12.5" fill="#000000">feeds the ADC a quick charge</text><text x="560" y="352" font-size="12.5" fill="#000000">from a high-resistance source</text><text x="560" y="370" font-size="12.5" fill="#000000">and filters noise</text><text x="310" y="432" font-size="12.5" fill="#000000">volts = raw × (3.3 / 1023) × 5.7; calibrate with your meter.</text></svg>
