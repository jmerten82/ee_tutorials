<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 520" role="img" aria-label="SD card data logger data flow and file layout" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><defs><marker id="sd-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#000000"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="700" fill="#000000">Data logger: from a reading to a line on the card</text><text x="24" y="50" font-size="12.5" fill="#000000">Once a second; the library collects lines in RAM and writes the card in 512-byte blocks</text><g><rect x="24" y="76" width="132" height="74" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><text x="90" y="98" text-anchor="middle" font-weight="700" fill="#000000">Read</text><text x="90" y="118" text-anchor="middle" font-size="12.5" fill="#000000">A0 pot, A1 battery,</text><text x="90" y="134" text-anchor="middle" font-size="12.5" fill="#000000">CPU temperature</text></g><g><rect x="176" y="76" width="132" height="74" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><text x="242" y="98" text-anchor="middle" font-weight="700" fill="#000000">Timestamp</text><text x="242" y="118" text-anchor="middle" font-size="12.5" fill="#000000">RTC via TimeLib</text><text x="242" y="134" text-anchor="middle" font-size="12.5" fill="#000000">now(), year() …</text></g><g><rect x="328" y="76" width="132" height="74" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><text x="394" y="98" text-anchor="middle" font-weight="700" fill="#000000">Format</text><text x="394" y="118" text-anchor="middle" font-size="12.5" fill="#000000">one CSV line,</text><text x="394" y="134" text-anchor="middle" font-size="12.5" fill="#000000">snprintf()</text></g><g><rect x="480" y="76" width="120" height="74" rx="6" fill="#dedede" stroke="#000000" stroke-width="2.25"></rect><text x="540" y="98" text-anchor="middle" font-weight="700" fill="#000000">RAM buffer</text><text x="540" y="118" text-anchor="middle" font-size="12.5" fill="#000000">file.println()</text><text x="540" y="134" text-anchor="middle" font-size="12.5" fill="#000000">not on card yet!</text></g><g><rect x="620" y="76" width="116" height="74" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><text x="678" y="98" text-anchor="middle" font-weight="700" fill="#000000">microSD</text><text x="678" y="118" text-anchor="middle" font-size="12.5" fill="#000000">file.flush() or</text><text x="678" y="134" text-anchor="middle" font-size="12.5" fill="#000000">file.close()</text></g><path d="M156 113H174" fill="none" stroke="#000000" stroke-width="2.25" marker-end="url(#sd-arrow)"></path><path d="M308 113H326" fill="none" stroke="#000000" stroke-width="2.25" marker-end="url(#sd-arrow)"></path><path d="M460 113H478" fill="none" stroke="#000000" stroke-width="2.25" marker-end="url(#sd-arrow)"></path><path d="M600 113H618" fill="none" stroke="#000000" stroke-width="2.25" marker-end="url(#sd-arrow)"></path><path d="M540 150V176H678V152" fill="none" stroke="#000000" stroke-width="1.95" stroke-dasharray="5 4" marker-end="url(#sd-arrow)"></path><text x="609" y="194" text-anchor="middle" font-size="12.5" fill="#000000">flush every 10 lines</text><text x="24" y="194" font-size="12.5" fill="#000000">elapsedMillis tick ≥ 1000 → read, stamp, format, println</text><path d="M24 214H736" stroke="#000000" stroke-width="1.5"></path><text x="24" y="242" font-weight="700" fill="#000000">On the card (FAT32 or exFAT)</text><rect x="24" y="256" width="200" height="176" rx="8" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><path d="M196 256H224V284" fill="none" stroke="#000000" stroke-width="2.25"></path><text x="40" y="282" font-size="12.5" font-weight="700" fill="#000000">/ (root)</text><path d="M48 290V372M48 314H62M48 342H62M48 370H62" fill="none" stroke="#000000" stroke-width="1.8"></path><text x="68" y="318" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#000000">LOG001.CSV</text><text x="68" y="346" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#000000">LOG002.CSV</text><text x="68" y="374" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#000000">LOG003.CSV ←</text><text x="40" y="404" font-size="12.5" fill="#000000">a new file each power-up:</text><text x="40" y="420" font-size="12.5" fill="#000000">first unused number</text><rect x="250" y="256" width="486" height="176" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><rect x="250" y="256" width="486" height="24" fill="#000000"></rect><text x="262" y="273" font-family="Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#ffffff">LOG003.CSV</text><text x="262" y="304" font-family="Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#000000">time,pot,battery_V,cpu_C</text><text x="262" y="326" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#000000">2026-11-07 14:03:01,512,12.61,41.2</text><text x="262" y="346" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#000000">2026-11-07 14:03:02,515,12.61,41.3</text><text x="262" y="366" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#000000">2026-11-07 14:03:03,790,12.60,41.3</text><text x="262" y="386" font-family="Menlo, Consolas, monospace" font-size="12.5" fill="#000000">…</text><text x="262" y="418" font-size="12.5" fill="#000000">header once, then one line per second; opens in Numbers or Excel</text><text x="24" y="462" font-weight="700" fill="#000000">Safe removal</text><text x="24" y="484" font-size="12.5" fill="#000000">Press the stop button (pin 2): the sketch calls close(), the LED on pin 13 goes out, then pull the card.</text><text x="24" y="502" font-size="12.5" fill="#000000">Power lost without a flush loses at most the lines still in RAM; the file itself stays readable.</text></svg>
