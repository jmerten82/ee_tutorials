<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 430" role="img" aria-label="Switch bounce and the debounced signal" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><defs><marker id="bt-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#000000"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="700" fill="#000000">One press, four presses: why buttons need debouncing</text><text x="24" y="50" font-size="12.5" fill="#000000">Pin 2 with INPUT_PULLUP: HIGH = released, LOW = pressed. Times in milliseconds; the bounce is drawn stretched</text><g><path d="M200 340V348" stroke="#000000" stroke-width="1.5"></path><text x="200" y="364" text-anchor="middle" font-size="12.5" fill="#000000">0</text></g><g><path d="M257.5 340V348" stroke="#000000" stroke-width="1.5"></path><text x="257.5" y="364" text-anchor="middle" font-size="12.5" fill="#000000">5</text></g><g><path d="M315 340V348" stroke="#000000" stroke-width="1.5"></path><text x="315" y="364" text-anchor="middle" font-size="12.5" fill="#000000">10</text></g><g><path d="M372.5 340V348" stroke="#000000" stroke-width="1.5"></path><text x="372.5" y="364" text-anchor="middle" font-size="12.5" fill="#000000">15</text></g><g><path d="M430 340V348" stroke="#000000" stroke-width="1.5"></path><text x="430" y="364" text-anchor="middle" font-size="12.5" fill="#000000">20</text></g><g><path d="M487.5 340V348" stroke="#000000" stroke-width="1.5"></path><text x="487.5" y="364" text-anchor="middle" font-size="12.5" fill="#000000">25</text></g><g><path d="M545 340V348" stroke="#000000" stroke-width="1.5"></path><text x="545" y="364" text-anchor="middle" font-size="12.5" fill="#000000">30</text></g><g><path d="M602.5 340V348" stroke="#000000" stroke-width="1.5"></path><text x="602.5" y="364" text-anchor="middle" font-size="12.5" fill="#000000">35</text></g><g><path d="M660 340V348" stroke="#000000" stroke-width="1.5"></path><text x="660" y="364" text-anchor="middle" font-size="12.5" fill="#000000">40</text></g><g><path d="M717.5 340V348" stroke="#000000" stroke-width="1.5"></path><text x="717.5" y="364" text-anchor="middle" font-size="12.5" fill="#000000">45</text></g><path d="M200 344H717.5" stroke="#000000" stroke-width="1.5"></path><text x="717.5" y="382" text-anchor="end" font-size="12.5" fill="#000000">time (ms)</text><text x="24" y="100" font-weight="700" fill="#000000">Switch contact</text><text x="24" y="118" font-size="12.5" fill="#000000">what digitalRead() sees</text><text x="184" y="94" text-anchor="end" font-size="12.5" fill="#000000">HIGH</text><text x="184" y="140" text-anchor="end" font-size="12.5" fill="#000000">LOW</text><path d="M200 90H234.5V136H246V90H262.1V136H269V90H285.1V136H292V90H310.4V136H510.5V90H517.4000000000001V136H528.9000000000001V90H535.8V136H545V90H717.5" fill="none" stroke="#000000" stroke-width="3"></path><g><circle cx="234.5" cy="160" r="9" fill="#ffffff" stroke="#000000" stroke-width="1.95"></circle><text x="234.5" y="164" text-anchor="middle" font-size="12.5" fill="#000000">1</text></g><g><circle cx="262.1" cy="160" r="9" fill="#ffffff" stroke="#000000" stroke-width="1.95"></circle><text x="262.1" y="164" text-anchor="middle" font-size="12.5" fill="#000000">2</text></g><g><circle cx="285.1" cy="160" r="9" fill="#ffffff" stroke="#000000" stroke-width="1.95"></circle><text x="285.1" y="164" text-anchor="middle" font-size="12.5" fill="#000000">3</text></g><g><circle cx="310.4" cy="160" r="9" fill="#ffffff" stroke="#000000" stroke-width="1.95"></circle><text x="310.4" y="164" text-anchor="middle" font-size="12.5" fill="#000000">4</text></g><text x="332.25" y="164" font-size="12.5" fill="#000000">4 falling edges = 4 "presses" counted by naive code</text><text x="562.25" y="120" font-size="12.5" fill="#000000">release bounces too</text><path d="M234.5 196H310.4" stroke="#000000" stroke-width="1.8" marker-start="url(#bt-arrow)" marker-end="url(#bt-arrow)"></path><text x="234.5" y="214" font-size="12.5" fill="#000000">bounce: typically 1–5 ms (drawn wider here)</text><path d="M24 236H736" stroke="#000000" stroke-width="1.5"></path><text x="24" y="266" font-weight="700" fill="#000000">Bounce output</text><text x="24" y="284" font-size="12.5" fill="#000000">interval(10)</text><text x="184" y="262" text-anchor="end" font-size="12.5" fill="#000000">HIGH</text><text x="184" y="308" text-anchor="end" font-size="12.5" fill="#000000">LOW</text><path d="M200 258H425.4V304H660V258H717.5" fill="none" stroke="#000000" stroke-width="3.9"></path><rect x="310.4" y="266" width="115" height="30" fill="#dedede" stroke="none"></rect><path d="M310.4 281H425.4" stroke="#000000" stroke-width="1.8" marker-start="url(#bt-arrow)" marker-end="url(#bt-arrow)"></path><text x="367.9" y="252" text-anchor="middle" font-size="12.5" fill="#000000">10 ms steady</text><rect x="545" y="266" width="115" height="30" fill="#dedede" stroke="none"></rect><path d="M545 281H660" stroke="#000000" stroke-width="1.8" marker-start="url(#bt-arrow)" marker-end="url(#bt-arrow)"></path><text x="602.5" y="252" text-anchor="middle" font-size="12.5" fill="#000000">10 ms steady</text><text x="431.4" y="328" font-size="12.5" font-weight="700" fill="#000000">fell() true once</text><text x="654" y="328" text-anchor="end" font-size="12.5" font-weight="700" fill="#000000">rose() true once</text><text x="24" y="408" font-size="12.5" fill="#000000">The library only reports a change after the pin has stopped changing for the whole interval: one press, one event, about 10 ms late.</text></svg>
