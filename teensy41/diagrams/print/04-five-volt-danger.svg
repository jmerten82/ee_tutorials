<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 600" role="img" aria-label="5 V kills Teensy pins; three level-shifting fixes" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><defs><marker id="fv-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#000000"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="700" fill="#000000">No pin is 5 V tolerant: what goes wrong, and three fixes</text><text x="24" y="50" font-size="12.5" fill="#000000">Any voltage above 3.3 V (or below 0 V) on any pin, digital or analog, forces current through the protection diodes</text><rect x="24" y="108" width="130" height="54" rx="6" fill="#dedede" stroke="#000000" stroke-width="2.25"></rect><text x="89" y="131" text-anchor="middle" font-weight="700" fill="#000000">5 V device</text><text x="89" y="149" text-anchor="middle" font-size="12.5" fill="#000000">output HIGH = 5 V</text><rect x="250" y="70" width="220" height="170" rx="6" fill="none" stroke="#000000" stroke-width="1.95" stroke-dasharray="6 4"></rect><text x="460" y="232" text-anchor="end" font-size="12.5" fill="#000000">inside the chip</text><g fill="none" stroke="#000000" stroke-width="2.25"><path d="M154 135H330"></path><path d="M330 135V122"></path><path d="M330 100V88H450"></path><path d="M330 135H380"></path><path d="M330 135V150"></path><path d="M330 172V186"></path></g><rect x="243" y="128" width="14" height="14" fill="#ffffff" stroke="#000000" stroke-width="2.4"></rect><text x="238" y="124" text-anchor="end" font-size="12.5" fill="#000000">pin</text><circle cx="330" cy="135" r="3.5" fill="#000000"></circle><polygon points="320,122 340,122 330,102" fill="#000000" stroke="#000000" stroke-width="2.25"></polygon><path d="M318 100H342" stroke="#000000" stroke-width="3.75"></path><polygon points="320,172 340,172 330,152" fill="#ffffff" stroke="#000000" stroke-width="2.25"></polygon><path d="M318 150H342" stroke="#000000" stroke-width="3.75"></path><path d="M330 186V194M319 194H341M323 199H337M327 204H333" fill="none" stroke="#000000" stroke-width="2.25"></path><text x="394" y="82" font-size="12.5" font-weight="700" fill="#000000">3.3 V rail</text><polygon points="380,123 380,147 404,135" fill="#ffffff" stroke="#000000" stroke-width="2.25"></polygon><text x="410" y="139" font-size="12.5" fill="#000000">input</text><path d="M306 128V96" fill="none" stroke="#000000" stroke-width="3.6" marker-end="url(#fv-arrow)"></path><text x="300" y="100" text-anchor="end" font-size="12.5" font-weight="700" fill="#000000">current</text><text x="494" y="96" font-weight="700" fill="#000000">What happens</text><text x="494" y="118" font-size="12.5" fill="#000000">1. 5 V is 1.7 V above the 3.3 V rail.</text><text x="494" y="136" font-size="12.5" fill="#000000">2. The upper clamp diode conducts.</text><text x="494" y="154" font-size="12.5" fill="#000000">3. Current pours into the pin and</text><text x="494" y="170" font-size="12.5" fill="#000000"> lifts the whole 3.3 V rail.</text><text x="494" y="188" font-size="12.5" fill="#000000">4. The pin, or the chip, dies; often</text><text x="494" y="204" font-size="12.5" fill="#000000"> silently, with no smoke.</text><path d="M24 262H736" stroke="#000000" stroke-width="1.5"></path><text x="24" y="290" font-weight="700" fill="#000000">A. 5 V signal into Teensy</text><text x="24" y="306" font-size="12.5" fill="#000000">resistor divider, slow signals</text><g fill="none" stroke="#000000" stroke-width="2.25"><path d="M110 334V350"></path><path d="M110 390V420H180"></path><path d="M110 420V440"></path><path d="M110 480V500"></path></g><text x="118" y="338" font-size="12.5" fill="#000000">5 V signal</text><rect x="102" y="350" width="16" height="40" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><rect x="102" y="440" width="16" height="40" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><text x="96" y="374" text-anchor="end" font-size="12.5" fill="#000000">10 kΩ</text><text x="96" y="464" text-anchor="end" font-size="12.5" fill="#000000">15 kΩ</text><circle cx="110" cy="420" r="3.5" fill="#000000"></circle><path d="M110 500V508M99 508H121M103 513H117M107 518H113" fill="none" stroke="#000000" stroke-width="2.25"></path><text x="132" y="412" font-size="12.5" font-weight="700" fill="#000000">to pin</text><text x="132" y="446" font-size="12.5" fill="#000000">5 × 15/25 = 3.0 V</text><text x="24" y="550" font-size="12.5" fill="#000000">fine for buttons, sensors,</text><text x="24" y="566" font-size="12.5" fill="#000000">serial up to ~115 200 baud</text><text x="268" y="290" font-weight="700" fill="#000000">B. Teensy out to 5 V logic</text><text x="268" y="306" font-size="12.5" fill="#000000">74AHCT125 buffer, powered at 5 V</text><g fill="none" stroke="#000000" stroke-width="2.25"><path d="M282 410H330"></path><path d="M386 410H470"></path><path d="M354 392V360"></path><path d="M354 428V470"></path><path d="M340 436V456H354"></path></g><polygon points="330,378 330,442 386,410" fill="#dedede" stroke="#000000" stroke-width="2.25"></polygon><text x="282" y="400" font-size="12.5" fill="#000000">pin 11</text><text x="470" y="400" text-anchor="end" font-size="12.5" fill="#000000">to 5 V</text><text x="470" y="428" text-anchor="end" font-size="12.5" fill="#000000">e.g. WS2812</text><text x="360" y="354" font-size="12.5" fill="#000000">VCC = 5 V</text><text x="334" y="466" text-anchor="end" font-size="12.5" fill="#000000">OE</text><circle cx="354" cy="456" r="3.5" fill="#000000"></circle><path d="M354 470V478M343 478H365M347 483H361M351 488H357" fill="none" stroke="#000000" stroke-width="2.25"></path><text x="268" y="520" font-size="12.5" fill="#000000">reads 3.3 V as HIGH (TTL input,</text><text x="268" y="536" font-size="12.5" fill="#000000">2.0 V threshold); drives a full 5 V.</text><text x="268" y="552" font-size="12.5" fill="#000000">Tie OE (pin 1) low, unused inputs</text><text x="268" y="568" font-size="12.5" fill="#000000">to GND.</text><text x="512" y="290" font-weight="700" fill="#000000">C. Both ways (I2C)</text><text x="512" y="306" font-size="12.5" fill="#000000">BSS138 MOSFET per line</text><g fill="none" stroke="#000000" stroke-width="2.25"><path d="M520 440H592V420H600"></path><path d="M632 420H640V440H728"></path><path d="M600 410H632"></path><path d="M616 410V362"></path><path d="M560 440V420"></path><path d="M560 380V362"></path><path d="M696 440V420"></path><path d="M696 380V362"></path><path d="M560 362H616"></path></g><path d="M600 420H632" stroke="#000000" stroke-width="3.75"></path><rect x="552" y="380" width="16" height="40" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><rect x="688" y="380" width="16" height="40" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><circle cx="560" cy="440" r="3.5" fill="#000000"></circle><circle cx="696" cy="440" r="3.5" fill="#000000"></circle><circle cx="616" cy="362" r="3.5" fill="#000000"></circle><text x="620" y="398" font-size="12.5" fill="#000000">G</text><text x="592" y="456" text-anchor="middle" font-size="12.5" fill="#000000">S</text><text x="640" y="456" text-anchor="middle" font-size="12.5" fill="#000000">D</text><text x="560" y="354" text-anchor="middle" font-size="12.5" fill="#000000">3.3 V</text><text x="696" y="354" text-anchor="middle" font-size="12.5" fill="#000000">5 V</text><text x="540" y="404" text-anchor="end" font-size="12.5" fill="#000000">10k</text><text x="716" y="404" font-size="12.5" fill="#000000">10k</text><text x="520" y="478" font-size="12.5" fill="#000000">Teensy SDA</text><text x="728" y="478" text-anchor="end" font-size="12.5" fill="#000000">5 V SDA</text><text x="512" y="520" font-size="12.5" fill="#000000">sold as 4-channel "logic level</text><text x="512" y="536" font-size="12.5" fill="#000000">converter" boards; one MOSFET</text><text x="512" y="552" font-size="12.5" fill="#000000">each for SDA and SCL</text></svg>
