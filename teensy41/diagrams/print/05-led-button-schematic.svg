<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 400" role="img" aria-label="LED and pushbutton schematic" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><defs><marker id="lb-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#000000"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="700" fill="#000000">An LED out, a button in: the two circuits behind every project</text><text x="24" y="50" font-size="12.5" fill="#000000">Schematic for Lesson 1; the dashed box is what happens inside the Teensy</text><rect x="24" y="76" width="176" height="290" rx="6" fill="none" stroke="#000000" stroke-width="2.1" stroke-dasharray="6 4"></rect><text x="36" y="98" font-weight="700" fill="#000000">Teensy 4.1</text><polygon points="130,136 130,164 156,150" fill="#dedede" stroke="#000000" stroke-width="2.25"></polygon><path d="M96 150H130M156 150H200" fill="none" stroke="#000000" stroke-width="2.25"></path><text x="36" y="130" font-size="12.5" fill="#000000">digitalWrite()</text><text x="36" y="154" font-size="12.5" fill="#000000">3.3 V / 0 V</text><path d="M150 206V220M150 256V270H200" fill="none" stroke="#000000" stroke-width="2.25"></path><path d="M138 206H162" stroke="#000000" stroke-width="2.25"></path><text x="150" y="198" text-anchor="middle" font-size="12.5" fill="#000000">3.3 V</text><rect x="142" y="220" width="16" height="36" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><text x="134" y="236" text-anchor="end" font-size="12.5" fill="#000000">pull-up</text><text x="134" y="252" text-anchor="end" font-size="12.5" fill="#000000">INPUT_PULLUP</text><circle cx="150" cy="270" r="3.5" fill="#000000"></circle><path d="M150 270V292" stroke="#000000" stroke-width="2.25"></path><polygon points="138,292 162,292 150,312" fill="#ffffff" stroke="#000000" stroke-width="2.25" transform="rotate(180 150 302)"></polygon><text x="136" y="306" text-anchor="end" font-size="12.5" fill="#000000">digitalRead()</text><path d="M170 340H200" stroke="#000000" stroke-width="2.25"></path><text x="164" y="344" text-anchor="end" font-size="12.5" fill="#000000">GND</text><rect x="193" y="143" width="14" height="14" fill="#ffffff" stroke="#000000" stroke-width="2.4"></rect><rect x="193" y="263" width="14" height="14" fill="#ffffff" stroke="#000000" stroke-width="2.4"></rect><rect x="193" y="333" width="14" height="14" fill="#ffffff" stroke="#000000" stroke-width="2.4"></rect><text x="212" y="142" font-size="12.5" font-weight="700" fill="#000000">11</text><text x="212" y="262" font-size="12.5" font-weight="700" fill="#000000">2</text><text x="212" y="332" font-size="12.5" font-weight="700" fill="#000000">G</text><path d="M207 150H252M312 150H352M392 150H430V170" fill="none" stroke="#000000" stroke-width="2.25"></path><rect x="252" y="142" width="60" height="16" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><text x="282" y="132" text-anchor="middle" font-weight="700" fill="#000000">R1 470 Ω</text><text x="282" y="178" text-anchor="middle" font-size="12.5" fill="#000000">yellow violet brown</text><polygon points="352,136 352,164 378,150" fill="#ffffff" stroke="#000000" stroke-width="2.25"></polygon><path d="M379 134V166" stroke="#000000" stroke-width="3.6"></path><path d="M362 128l10 -14M372 132l10 -14" fill="none" stroke="#000000" stroke-width="1.8" marker-end="url(#lb-arrow)"></path><text x="365" y="196" text-anchor="middle" font-weight="700" fill="#000000">LED</text><text x="340" y="212" text-anchor="middle" font-size="12.5" fill="#000000">long leg</text><text x="398" y="212" text-anchor="middle" font-size="12.5" fill="#000000">flat side</text><path d="M430 170V178M419 178H441M423 183H437M427 188H433" fill="none" stroke="#000000" stroke-width="2.25"></path><path d="M207 270H292M332 270H372V290" fill="none" stroke="#000000" stroke-width="2.25"></path><circle cx="292" cy="270" r="3" fill="#ffffff" stroke="#000000" stroke-width="2.25"></circle><circle cx="332" cy="270" r="3" fill="#ffffff" stroke="#000000" stroke-width="2.25"></circle><path d="M288 258H336M312 258V244M302 244H322" fill="none" stroke="#000000" stroke-width="2.25"></path><text x="312" y="236" text-anchor="middle" font-weight="700" fill="#000000">S1</text><text x="312" y="298" text-anchor="middle" font-size="12.5" fill="#000000">pushbutton</text><path d="M372 290V298M361 298H383M365 303H379M369 308H375" fill="none" stroke="#000000" stroke-width="2.25"></path><path d="M207 340H250" stroke="#000000" stroke-width="2.25"></path><path d="M250 340V348M239 348H261M243 353H257M247 358H253" fill="none" stroke="#000000" stroke-width="2.25"></path><path d="M470 76V366" stroke="#000000" stroke-width="1.5"></path><text x="490" y="98" font-weight="700" fill="#000000">LED current</text><text x="490" y="120" font-size="12.5" fill="#000000">I = (3.3 V − V_LED) / R</text><text x="490" y="140" font-size="12.5" fill="#000000">red: (3.3 − 2.0) / 470 ≈ 2.8 mA</text><text x="490" y="160" font-size="12.5" fill="#000000">keep each pin under 4 mA</text><text x="490" y="180" font-size="12.5" fill="#000000">blue, white (≈ 3 V): 100 Ω, still dim;</text><text x="490" y="196" font-size="12.5" fill="#000000">for real brightness use a transistor</text><text x="490" y="240" font-weight="700" fill="#000000">Button logic</text><text x="490" y="262" font-size="12.5" fill="#000000">released: pull-up holds pin HIGH → 1</text><text x="490" y="282" font-size="12.5" fill="#000000">pressed: S1 shorts pin to GND → 0</text><text x="490" y="302" font-size="12.5" fill="#000000">so "pressed" means LOW</text><text x="490" y="326" font-size="12.5" fill="#000000">no external resistor needed, and no</text><text x="490" y="342" font-size="12.5" fill="#000000">wire ever carries more than 3.3 V</text></svg>
