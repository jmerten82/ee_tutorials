<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 500" role="img" aria-label="Teensy 4.1 power paths" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><text x="24" y="30" font-size="15" font-weight="600" fill="#111111">Where the power goes: 5 V in, 3.3 V out</text><text x="24" y="50" font-size="11.5" fill="#444444">VUSB and VIN are joined by a trace between two pads on the underside; cut it before feeding VIN while USB is plugged in</text><g fill="none" stroke="#111111" stroke-width="1.5"><path d="M134 150H196"></path><path d="M224 150H340"></path><path d="M282 150V94"></path><path d="M282 150V226"></path><path d="M450 150H720"></path><path d="M520 150V200"></path><path d="M650 150V200"></path><path d="M395 176V206"></path></g><rect x="24" y="122" width="110" height="56" rx="6" fill="#ececec" stroke="#111111" stroke-width="1.5"></rect><text x="79" y="146" text-anchor="middle" font-weight="600" fill="#111111">USB micro-B</text><text x="79" y="164" text-anchor="middle" font-size="11.5" fill="#444444">5 V from the Mac</text><text x="150" y="140" font-size="11.5" font-weight="600" fill="#111111">VUSB</text><rect x="190" y="143" width="14" height="14" fill="#111111"></rect><rect x="216" y="143" width="14" height="14" fill="#111111"></rect><path d="M204 150H216" stroke="#111111" stroke-width="3"></path><path d="M210 132V170" stroke="#111111" stroke-width="1.2" stroke-dasharray="3 2"></path><text x="210" y="190" text-anchor="middle" font-size="11.5" fill="#111111">cut here</text><text x="210" y="204" text-anchor="middle" font-size="11.5" fill="#444444">(underside)</text><circle cx="282" cy="150" r="3.5" fill="#111111"></circle><text x="290" y="140" font-size="11.5" font-weight="600" fill="#111111">VIN</text><text x="282" y="70" text-anchor="middle" font-size="11.5" fill="#111111">USB host +5V</text><text x="282" y="86" text-anchor="middle" font-size="11.5" fill="#444444">(current-limited)</text><rect x="222" y="226" width="120" height="54" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.5" stroke-dasharray="6 4"></rect><text x="282" y="248" text-anchor="middle" font-weight="600" fill="#111111">VIN pin</text><text x="282" y="266" text-anchor="middle" font-size="11.5" fill="#444444">3.6–5.5 V supply</text><path d="M282 280V296" stroke="#111111" stroke-width="1.5"></path><g><path d="M282 296V304M271 304H293M275 309H289M279 314H285" fill="none" stroke="#111111" stroke-width="1.5"></path></g><text x="300" y="308" font-size="11.5" fill="#444444">supply − to GND</text><rect x="340" y="124" width="110" height="52" rx="6" fill="#ececec" stroke="#111111" stroke-width="2"></rect><text x="395" y="146" text-anchor="middle" font-weight="600" fill="#111111">regulator</text><text x="395" y="164" text-anchor="middle" font-size="11.5" fill="#444444">VIN → 3.3 V</text><g><path d="M395 206V214M384 214H406M388 219H402M392 224H398" fill="none" stroke="#111111" stroke-width="1.5"></path></g><circle cx="520" cy="150" r="3.5" fill="#111111"></circle><circle cx="650" cy="150" r="3.5" fill="#111111"></circle><text x="470" y="140" font-size="11.5" font-weight="600" fill="#111111">3.3 V rail</text><rect x="454" y="200" width="132" height="66" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.5"></rect><text x="520" y="222" text-anchor="middle" font-weight="600" fill="#111111">the board itself</text><text x="520" y="240" text-anchor="middle" font-size="11.5" fill="#444444">CPU, flash, SD card</text><text x="520" y="255" text-anchor="middle" font-size="11.5" fill="#444444">≈ 100 mA at 600 MHz</text><rect x="598" y="200" width="138" height="66" rx="6" fill="#ffffff" stroke="#111111" stroke-width="2.2"></rect><text x="667" y="222" text-anchor="middle" font-weight="600" fill="#111111">3.3V pins</text><text x="667" y="240" text-anchor="middle" font-size="11.5" fill="#444444">your sensors, OLED…</text><text x="667" y="255" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111111">250 mA max</text><path d="M24 336H736" stroke="#bbbbbb" stroke-width="1"></path><text x="24" y="362" font-weight="600" fill="#111111">The three small pads beside the SD socket</text><g fill="none" stroke="#111111" stroke-width="1.5"><path d="M80 392V410"></path><path d="M80 432V450"></path><path d="M80 392H150"></path></g><path d="M64 410H96" stroke="#111111" stroke-width="3"></path><path d="M70 420H90" stroke="#111111" stroke-width="1.5"></path><path d="M70 420V432H90V420" fill="none" stroke="none"></path><path d="M80 420V432" stroke="#111111" stroke-width="1.5"></path><g><path d="M80 450V458M69 458H91M73 463H87M77 468H83" fill="none" stroke="#111111" stroke-width="1.5"></path></g><text x="56" y="416" text-anchor="end" font-size="11.5" fill="#111111">+</text><text x="100" y="428" font-size="11.5" fill="#111111">CR2032</text><rect x="150" y="385" width="14" height="14" fill="#ffffff" stroke="#111111" stroke-width="1.3"></rect><text x="172" y="396" font-weight="600" fill="#111111">VBAT</text><text x="100" y="478" font-size="11.5" fill="#444444">keeps the clock running</text><text x="100" y="492" font-size="11.5" fill="#444444">while the power is off</text><rect x="300" y="385" width="14" height="14" fill="#ffffff" stroke="#111111" stroke-width="1.3"></rect><text x="300" y="424" font-weight="600" fill="#111111">On/Off</text><path d="M314 392H340" stroke="#111111" stroke-width="1.5"></path><g><circle cx="340" cy="392" r="3" fill="#ffffff" stroke="#111111" stroke-width="1.5"></circle><circle cx="376" cy="392" r="3" fill="#ffffff" stroke="#111111" stroke-width="1.5"></circle><path d="M338 383H378M358 383V373M350 373H366" fill="none" stroke="#111111" stroke-width="1.5"></path></g><path d="M376 392H400V412" fill="none" stroke="#111111" stroke-width="1.5"></path><g><path d="M400 412V420M389 420H411M393 425H407M397 430H403" fill="none" stroke="#111111" stroke-width="1.5"></path></g><text x="300" y="452" font-size="11.5" fill="#444444">hold 4 s: 3.3 V off</text><text x="300" y="468" font-size="11.5" fill="#444444">press 0.5 s: on again</text><rect x="510" y="385" width="14" height="14" fill="#ffffff" stroke="#111111" stroke-width="1.3"></rect><text x="510" y="424" font-weight="600" fill="#111111">Program</text><path d="M524 392H550" stroke="#111111" stroke-width="1.5"></path><g><circle cx="550" cy="392" r="3" fill="#ffffff" stroke="#111111" stroke-width="1.5"></circle><circle cx="586" cy="392" r="3" fill="#ffffff" stroke="#111111" stroke-width="1.5"></circle><path d="M548 383H588M568 383V373M560 373H576" fill="none" stroke="#111111" stroke-width="1.5"></path></g><path d="M586 392H610V412" fill="none" stroke="#111111" stroke-width="1.5"></path><g><path d="M610 412V420M599 420H621M603 425H617M607 430H613" fill="none" stroke="#111111" stroke-width="1.5"></path></g><text x="510" y="452" font-size="11.5" fill="#444444">same as the on-board button:</text><text x="510" y="468" font-size="11.5" fill="#444444">enters upload mode, not reset</text></svg>
