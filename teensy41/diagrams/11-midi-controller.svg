<svg viewBox="0 0 760 560" role="img" aria-label="USB MIDI controller wiring" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><defs><marker id="mc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#111111"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#111111">USB MIDI controller: four keys, four knobs, one cable</text><text x="24" y="50" font-size="11.5" fill="#444444">Buttons switch to GND (INPUT_PULLUP, no resistors). Pots divide 3.3 V. Flags with the same name are connected</text><rect x="300" y="80" width="130" height="330" rx="6" fill="#ececec" stroke="#111111" stroke-width="2"></rect><text x="365" y="292" text-anchor="middle" font-weight="600" fill="#111111">Teensy 4.1</text><text x="365" y="310" text-anchor="middle" font-size="11.5" fill="#444444">USB Type: MIDI</text><g><path d="M70 110H187M233 110H300" stroke="#111111" stroke-width="1.5"></path><circle cx="190" cy="110" r="3" fill="#ffffff" stroke="#111111" stroke-width="1.5"></circle><circle cx="230" cy="110" r="3" fill="#ffffff" stroke="#111111" stroke-width="1.5"></circle><path d="M186 100H234M210 100V88M200 88H220" fill="none" stroke="#111111" stroke-width="1.5"></path><text x="120" y="102" text-anchor="middle" font-size="11.5" fill="#444444">note 60 C4</text><path d="M70 110V120" stroke="#111111" stroke-width="1.5"></path><path d="M70 120V128M59 128H81M63 133H77M67 138H73" fill="none" stroke="#111111" stroke-width="1.5"></path><text x="306" y="114" font-size="11.5" font-weight="600" fill="#111111">2</text></g><g><path d="M70 180H187M233 180H300" stroke="#111111" stroke-width="1.5"></path><circle cx="190" cy="180" r="3" fill="#ffffff" stroke="#111111" stroke-width="1.5"></circle><circle cx="230" cy="180" r="3" fill="#ffffff" stroke="#111111" stroke-width="1.5"></circle><path d="M186 170H234M210 170V158M200 158H220" fill="none" stroke="#111111" stroke-width="1.5"></path><text x="120" y="172" text-anchor="middle" font-size="11.5" fill="#444444">note 62 D4</text><path d="M70 180V190" stroke="#111111" stroke-width="1.5"></path><path d="M70 190V198M59 198H81M63 203H77M67 208H73" fill="none" stroke="#111111" stroke-width="1.5"></path><text x="306" y="184" font-size="11.5" font-weight="600" fill="#111111">3</text></g><g><path d="M70 250H187M233 250H300" stroke="#111111" stroke-width="1.5"></path><circle cx="190" cy="250" r="3" fill="#ffffff" stroke="#111111" stroke-width="1.5"></circle><circle cx="230" cy="250" r="3" fill="#ffffff" stroke="#111111" stroke-width="1.5"></circle><path d="M186 240H234M210 240V228M200 228H220" fill="none" stroke="#111111" stroke-width="1.5"></path><text x="120" y="242" text-anchor="middle" font-size="11.5" fill="#444444">note 64 E4</text><path d="M70 250V260" stroke="#111111" stroke-width="1.5"></path><path d="M70 260V268M59 268H81M63 273H77M67 278H73" fill="none" stroke="#111111" stroke-width="1.5"></path><text x="306" y="254" font-size="11.5" font-weight="600" fill="#111111">4</text></g><g><path d="M70 320H187M233 320H300" stroke="#111111" stroke-width="1.5"></path><circle cx="190" cy="320" r="3" fill="#ffffff" stroke="#111111" stroke-width="1.5"></circle><circle cx="230" cy="320" r="3" fill="#ffffff" stroke="#111111" stroke-width="1.5"></circle><path d="M186 310H234M210 310V298M200 298H220" fill="none" stroke="#111111" stroke-width="1.5"></path><text x="120" y="312" text-anchor="middle" font-size="11.5" fill="#444444">note 65 F4</text><path d="M70 320V330" stroke="#111111" stroke-width="1.5"></path><path d="M70 330V338M59 338H81M63 343H77M67 348H73" fill="none" stroke="#111111" stroke-width="1.5"></path><text x="306" y="324" font-size="11.5" font-weight="600" fill="#111111">5</text></g><path d="M270 380H300" stroke="#111111" stroke-width="1.5"></path><path d="M270 380V386" stroke="#111111" stroke-width="1.5"></path><path d="M270 386V394M259 394H281M263 399H277M267 404H273" fill="none" stroke="#111111" stroke-width="1.5"></path><text x="306" y="384" font-size="11.5" font-weight="600" fill="#111111">GND</text><g><path d="M430 110H462" stroke="#111111" stroke-width="1.5"></path><text x="424" y="114" text-anchor="end" font-size="11.5" font-weight="600" fill="#111111">14 A0</text><g><polygon points="462,110 472,100 506,100 506,120 472,120" fill="#ffffff" stroke="#111111" stroke-width="1.3"></polygon><text x="488" y="114" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111111">K1</text></g></g><g><path d="M430 160H462" stroke="#111111" stroke-width="1.5"></path><text x="424" y="164" text-anchor="end" font-size="11.5" font-weight="600" fill="#111111">15 A1</text><g><polygon points="462,160 472,150 506,150 506,170 472,170" fill="#ffffff" stroke="#111111" stroke-width="1.3"></polygon><text x="488" y="164" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111111">K2</text></g></g><g><path d="M430 210H462" stroke="#111111" stroke-width="1.5"></path><text x="424" y="214" text-anchor="end" font-size="11.5" font-weight="600" fill="#111111">16 A2</text><g><polygon points="462,210 472,200 506,200 506,220 472,220" fill="#ffffff" stroke="#111111" stroke-width="1.3"></polygon><text x="488" y="214" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111111">K3</text></g></g><g><path d="M430 260H462" stroke="#111111" stroke-width="1.5"></path><text x="424" y="264" text-anchor="end" font-size="11.5" font-weight="600" fill="#111111">17 A3</text><g><polygon points="462,260 472,250 506,250 506,270 472,270" fill="#ffffff" stroke="#111111" stroke-width="1.3"></polygon><text x="488" y="264" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111111">K4</text></g></g><path d="M430 330H470" stroke="#111111" stroke-width="1.5"></path><text x="424" y="334" text-anchor="end" font-size="11.5" font-weight="600" fill="#111111">3.3V</text><text x="476" y="334" font-size="11.5" fill="#444444">to the pots</text><path d="M430 380H470V386" fill="none" stroke="#111111" stroke-width="1.5"></path><path d="M470 386V394M459 394H481M463 399H477M467 404H473" fill="none" stroke="#111111" stroke-width="1.5"></path><text x="424" y="384" text-anchor="end" font-size="11.5" font-weight="600" fill="#111111">GND</text><g><text x="606" y="90" text-anchor="middle" font-size="11.5" fill="#111111">3.3V</text><path d="M606 96V112M606 162V176" stroke="#111111" stroke-width="1.5"></path><rect x="598" y="112" width="16" height="50" fill="#ffffff" stroke="#111111" stroke-width="1.5"></rect><path d="M566 137H595" stroke="#111111" stroke-width="1.5" marker-end="url(#mc-arrow)"></path><g><polygon points="566,137 556,127 522,127 522,147 556,147" fill="#ffffff" stroke="#111111" stroke-width="1.3"></polygon><text x="540" y="141" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111111">K1</text></g><path d="M606 176V184M595 184H617M599 189H613M603 194H609" fill="none" stroke="#111111" stroke-width="1.5"></path></g><g><text x="716" y="90" text-anchor="middle" font-size="11.5" fill="#111111">3.3V</text><path d="M716 96V112M716 162V176" stroke="#111111" stroke-width="1.5"></path><rect x="708" y="112" width="16" height="50" fill="#ffffff" stroke="#111111" stroke-width="1.5"></rect><path d="M676 137H705" stroke="#111111" stroke-width="1.5" marker-end="url(#mc-arrow)"></path><g><polygon points="676,137 666,127 632,127 632,147 666,147" fill="#ffffff" stroke="#111111" stroke-width="1.3"></polygon><text x="650" y="141" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111111">K2</text></g><path d="M716 176V184M705 184H727M709 189H723M713 194H719" fill="none" stroke="#111111" stroke-width="1.5"></path></g><g><text x="606" y="230" text-anchor="middle" font-size="11.5" fill="#111111">3.3V</text><path d="M606 236V252M606 302V316" stroke="#111111" stroke-width="1.5"></path><rect x="598" y="252" width="16" height="50" fill="#ffffff" stroke="#111111" stroke-width="1.5"></rect><path d="M566 277H595" stroke="#111111" stroke-width="1.5" marker-end="url(#mc-arrow)"></path><g><polygon points="566,277 556,267 522,267 522,287 556,287" fill="#ffffff" stroke="#111111" stroke-width="1.3"></polygon><text x="540" y="281" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111111">K3</text></g><path d="M606 316V324M595 324H617M599 329H613M603 334H609" fill="none" stroke="#111111" stroke-width="1.5"></path></g><g><text x="716" y="230" text-anchor="middle" font-size="11.5" fill="#111111">3.3V</text><path d="M716 236V252M716 302V316" stroke="#111111" stroke-width="1.5"></path><rect x="708" y="252" width="16" height="50" fill="#ffffff" stroke="#111111" stroke-width="1.5"></rect><path d="M676 277H705" stroke="#111111" stroke-width="1.5" marker-end="url(#mc-arrow)"></path><g><polygon points="676,277 666,267 632,267 632,287 666,287" fill="#ffffff" stroke="#111111" stroke-width="1.3"></polygon><text x="650" y="281" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111111">K4</text></g><path d="M716 316V324M705 324H727M709 329H723M713 334H719" fill="none" stroke="#111111" stroke-width="1.5"></path></g><rect x="340" y="60" width="50" height="20" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.5"></rect><text x="398" y="74" font-size="11.5" fill="#111111">USB to the Mac</text><path d="M24 432H736" stroke="#bbbbbb" stroke-width="1"></path><text x="24" y="458" font-weight="600" fill="#111111">What each part sends (channel 1)</text><text x="24" y="480" font-size="11.5" fill="#111111">Buttons 1–4: Note On when pressed (velocity 99), Note Off when released: notes 60, 62, 64, 65.</text><text x="24" y="500" font-size="11.5" fill="#111111">Knobs 1–4: Control Change 1 (modulation), 7 (volume), 10 (pan), 74 (brightness), value 0–127, only when it changes.</text><text x="24" y="520" font-size="11.5" fill="#444444">On the Mac it appears as "Teensy MIDI" in Audio MIDI Setup and in any DAW; no driver to install.</text><text x="24" y="540" font-size="11.5" fill="#444444">Pots: 10 kΩ linear (B10K). Pins 14–17 are the same physical pins as A0–A3.</text></svg>
