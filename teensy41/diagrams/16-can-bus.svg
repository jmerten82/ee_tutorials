<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 560" role="img" aria-label="CAN bus between CAN1 and CAN2 with two transceivers" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><text x="24" y="30" font-size="15" font-weight="600" fill="#111111">CAN bus on one board: CAN1 talks to CAN2</text><text x="24" y="50" font-size="11.5" fill="#444444">Each CAN port needs a transceiver; the bus is two wires (CANH, CANL) with a 120 Ω resistor at each end</text><rect x="24" y="170" width="110" height="160" rx="6" fill="#ececec" stroke="#111111" stroke-width="2"></rect><text x="34" y="190" font-size="11.5" font-weight="600" fill="#111111">Teensy 4.1</text><text x="126" y="214" text-anchor="end" font-size="11.5" font-weight="600" fill="#111111">22 CTX1</text><text x="126" y="244" text-anchor="end" font-size="11.5" font-weight="600" fill="#111111">23 CRX1</text><text x="126" y="294" text-anchor="end" font-size="11.5" font-weight="600" fill="#111111">0 CRX2</text><text x="126" y="314" text-anchor="end" font-size="11.5" font-weight="600" fill="#111111">1 CTX2</text><g><rect x="190" y="180" width="100" height="120" rx="6" fill="#ececec" stroke="#111111" stroke-width="1.8"></rect><text x="240" y="200" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111111">node A</text><text x="240" y="292" text-anchor="middle" font-size="11.5" fill="#444444">SN65HVD230</text><text x="196" y="214" font-size="11.5" fill="#111111">D</text><text x="196" y="244" font-size="11.5" fill="#111111">R</text><text x="284" y="234" text-anchor="end" font-size="11.5" fill="#111111">CANH</text><text x="284" y="264" text-anchor="end" font-size="11.5" fill="#111111">CANL</text><path d="M240 180V162" stroke="#111111" stroke-width="1.5"></path><text x="240" y="156" text-anchor="middle" font-size="11.5" fill="#111111">3.3V</text></g><g><rect x="560" y="180" width="100" height="120" rx="6" fill="#ececec" stroke="#111111" stroke-width="1.8"></rect><text x="610" y="200" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111111">node B</text><text x="610" y="292" text-anchor="middle" font-size="11.5" fill="#444444">SN65HVD230</text><text x="566" y="234" font-size="11.5" fill="#111111">CANH</text><text x="566" y="264" font-size="11.5" fill="#111111">CANL</text><text x="654" y="214" text-anchor="end" font-size="11.5" fill="#111111">D</text><text x="654" y="244" text-anchor="end" font-size="11.5" fill="#111111">R</text><path d="M610 180V162" stroke="#111111" stroke-width="1.5"></path><text x="610" y="156" text-anchor="middle" font-size="11.5" fill="#111111">3.3V</text></g><g fill="none" stroke="#111111" stroke-width="1.5"><path d="M134 210H190M134 240H190"></path><path d="M660 210H710V430H160V310H134"></path><path d="M660 240H690V410H176V290H134"></path></g><path d="M290 230H560" stroke="#111111" stroke-width="2.4"></path><path d="M290 260H560" stroke="#111111" stroke-width="2.4" stroke-dasharray="10 4"></path><g><rect x="313" y="233" width="14" height="24" fill="#ffffff" stroke="#111111" stroke-width="1.5"></rect><circle cx="320" cy="230" r="3.5" fill="#111111"></circle><circle cx="320" cy="260" r="3.5" fill="#111111"></circle><path d="M320 230V233M320 257V260" stroke="#111111" stroke-width="1.5"></path><text x="320" y="284" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111111">120 Ω</text></g><g><rect x="523" y="233" width="14" height="24" fill="#ffffff" stroke="#111111" stroke-width="1.5"></rect><circle cx="530" cy="230" r="3.5" fill="#111111"></circle><circle cx="530" cy="260" r="3.5" fill="#111111"></circle><path d="M530 230V233M530 257V260" stroke="#111111" stroke-width="1.5"></path><text x="530" y="284" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111111">120 Ω</text></g><text x="425" y="222" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111111">CANH</text><text x="425" y="280" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111111">CANL</text><text x="425" y="300" text-anchor="middle" font-size="11.5" fill="#444444">twisted pair</text><text x="240" y="326" text-anchor="middle" font-size="11.5" fill="#111111">GND to Teensy GND</text><text x="610" y="326" text-anchor="middle" font-size="11.5" fill="#111111">GND to Teensy GND</text><text x="290" y="402" font-size="11.5" fill="#444444">CTX2 → D of node B</text><text x="290" y="424" font-size="11.5" fill="#444444">R of node B → CRX2</text><path d="M24 452H736" stroke="#bbbbbb" stroke-width="1"></path><text x="24" y="476" font-size="11.5" fill="#111111">Teensy CTX goes to the transceiver D (TX) input, CRX to its R (RX) output. Breakouts often label these CTX/CRX or TX/RX.</text><text x="24" y="496" font-size="11.5" fill="#111111">SN65HVD230 runs on 3.3 V. Do not use a 5 V-only transceiver (TJA1050, MCP2551): its RX output would put 5 V on a pin.</text><text x="24" y="516" font-size="11.5" fill="#111111">Exactly two terminators: power off and measure about 60 Ω between CANH and CANL. Many breakouts carry one already.</text><text x="24" y="536" font-size="11.5" fill="#444444">The Rs pin (8) must be low for full speed; breakout boards tie it to GND for you.</text></svg>
