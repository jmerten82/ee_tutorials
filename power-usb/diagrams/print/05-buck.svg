<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 500" role="img" aria-label="How a buck regulator works" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><text x="24" y="30" font-size="15" font-weight="700" fill="#000000">A buck regulator: switch, inductor, capacitors</text><text x="24" y="50" font-size="12.5" fill="#000000">Synchronous type, as in the D36V28F5: two switches take turns; simplified</text><rect x="24" y="96" width="70" height="110" rx="5" fill="#dedede" stroke="#000000" stroke-width="2.25"></rect><text x="59" y="150" text-anchor="middle" font-weight="700" fill="#000000">12 V</text><path d="M94 110H250" stroke="#000000" stroke-width="2.25"></path><path d="M150 110V140" stroke="#000000" stroke-width="2.25"></path><g stroke="#000000" stroke-width="3"><line x1="138" x2="162" y1="140" y2="140"></line><line x1="138" x2="162" y1="148" y2="148"></line></g><path d="M150 148V176" stroke="#000000" stroke-width="2.25"></path><g stroke="#000000" stroke-width="2.25"><line x1="140" x2="160" y1="176" y2="176"></line><line x1="144" x2="156" y1="181" y2="181"></line><line x1="148" x2="152" y1="186" y2="186"></line></g><text x="164" y="148" font-size="12.5" fill="#000000">C in</text><rect x="250" y="96" width="56" height="28" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><text x="278" y="115" text-anchor="middle" font-size="12.5" font-weight="700" fill="#000000">S1</text><path d="M306 110H360" stroke="#000000" stroke-width="2.25"></path><circle cx="340" cy="110" r="3.5" fill="#000000"></circle><text x="340" y="92" text-anchor="middle" font-size="12.5" fill="#000000">switch node</text><path d="M340 110V140" stroke="#000000" stroke-width="2.25"></path><rect x="326" y="140" width="28" height="40" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><text x="340" y="165" text-anchor="middle" font-size="12.5" font-weight="700" fill="#000000">S2</text><path d="M340 180V196" stroke="#000000" stroke-width="2.25"></path><g stroke="#000000" stroke-width="2.25"><line x1="330" x2="350" y1="196" y2="196"></line><line x1="334" x2="346" y1="201" y2="201"></line><line x1="338" x2="342" y1="206" y2="206"></line></g><path d="M360 110C366 98 374 98 380 110C386 98 394 98 400 110C406 98 414 98 420 110C426 98 434 98 440 110" fill="none" stroke="#000000" stroke-width="3"></path><text x="400" y="86" text-anchor="middle" font-size="12.5" font-weight="700" fill="#000000">L</text><path d="M440 110H640" stroke="#000000" stroke-width="2.25"></path><path d="M500 110V140" stroke="#000000" stroke-width="2.25"></path><g stroke="#000000" stroke-width="3"><line x1="488" x2="512" y1="140" y2="140"></line><line x1="488" x2="512" y1="148" y2="148"></line></g><path d="M500 148V176" stroke="#000000" stroke-width="2.25"></path><g stroke="#000000" stroke-width="2.25"><line x1="490" x2="510" y1="176" y2="176"></line><line x1="494" x2="506" y1="181" y2="181"></line><line x1="498" x2="502" y1="186" y2="186"></line></g><text x="514" y="148" font-size="12.5" fill="#000000">C out</text><rect x="600" y="96" width="110" height="110" rx="5" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><text x="655" y="146" text-anchor="middle" font-weight="700" fill="#000000">5 V load</text><text x="655" y="162" text-anchor="middle" font-size="12.5" fill="#000000">hub, ring</text><rect x="250" y="220" width="200" height="34" rx="5" fill="#dedede"></rect><text x="350" y="242" text-anchor="middle" font-size="12.5" fill="#000000">controller sets the on-time</text><path d="M278 220V126" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="3 3"></path><path d="M560 110V237H452" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="3 3"></path><text x="566" y="232" font-size="12.5" fill="#000000">feedback</text><text x="24" y="316" font-weight="700" fill="#000000">Switch node</text><text x="24" y="332" font-size="12.5" fill="#000000">12 V for about 42 %</text><path d="M210 380H210V330H242.76V380H288V330H320.76V380H366V330H398.76V380H444V330H476.76V380H522V330H554.76V380H600V330H632.76V380H678" fill="none" stroke="#000000" stroke-width="3"></path><text x="24" y="412" font-weight="700" fill="#000000">Inductor current</text><text x="24" y="428" font-size="12.5" fill="#000000">rises, falls, averages to I out</text><path d="M210 440L242.76 418L288 440L320.76 418L366 440L398.76 418L444 440L476.76 418L522 440L554.76 418L600 440L632.76 418L678 440" fill="none" stroke="#000000" stroke-width="3"></path><text x="680" y="350" font-size="12.5" fill="#000000">12 V</text><text x="680" y="384" font-size="12.5" fill="#000000">0 V</text><text x="24" y="478" font-size="12.5" fill="#000000">Input current flows in pulses (C in supplies them); output ripple is the small sawtooth that C out leaves.</text></svg>
