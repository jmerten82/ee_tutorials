<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 400" role="img" aria-label="USB-C attach detection on the CC wire" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><text x="24" y="30" font-size="15" font-weight="700" fill="#000000">USB-C: how the Mac knows something is plugged in</text><text x="24" y="50" font-size="12.5" fill="#000000">The host pulls CC up (Rp); a device pulls it down (Rd). The host reads the divider voltage</text><rect x="24" y="80" width="250" height="230" rx="6" fill="#dedede" stroke="#000000" stroke-width="2.25"></rect><text x="149" y="104" text-anchor="middle" font-weight="700" fill="#000000">Mac (source, host)</text><text x="60" y="138" font-size="12.5" fill="#000000">pull-up</text><path d="M120 126H180V140" fill="none" stroke="#000000" stroke-width="2.25"></path><g><rect x="172" y="140" width="16" height="44" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><text x="196" y="160" font-size="12" font-weight="700" fill="#000000">Rp</text></g><path d="M180 184V220H274" fill="none" stroke="#000000" stroke-width="2.25"></path><circle cx="180" cy="220" r="3.5" fill="#000000"></circle><rect x="60" y="240" width="170" height="50" rx="5" fill="#ffffff" stroke="#000000" stroke-width="1.8"></rect><text x="145" y="262" text-anchor="middle" font-size="12.5" fill="#000000">sees Rd: turn on VBUS</text><text x="145" y="278" text-anchor="middle" font-size="12.5" fill="#000000">and use the data lines</text><path d="M180 220V240" stroke="#000000" stroke-width="1.5" stroke-dasharray="3 3"></path><path d="M274 220H486" stroke="#000000" stroke-width="3"></path><text x="380" y="212" text-anchor="middle" font-size="12" font-weight="700" fill="#000000">CC wire in the cable</text><rect x="486" y="80" width="250" height="230" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><text x="611" y="104" text-anchor="middle" font-weight="700" fill="#000000">Hub end of the lead (sink)</text><path d="M486 220H580V230" fill="none" stroke="#000000" stroke-width="2.25"></path><g><rect x="572" y="230" width="16" height="44" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><text x="596" y="250" font-size="12" font-weight="700" fill="#000000">Rd</text><text x="596" y="266" font-size="12.5" fill="#000000">4.7 kΩ in REASON</text></g><path d="M580 274V286" stroke="#000000" stroke-width="2.25"></path><g stroke="#000000" stroke-width="2.25"><line x1="570" x2="590" y1="286" y2="286"></line><line x1="574" x2="586" y1="291" y2="291"></line><line x1="578" x2="582" y1="296" y2="296"></line></g><text x="500" y="140" font-size="12.5" fill="#000000">Specified: 5.1 kΩ</text><text x="500" y="158" font-size="12.5" fill="#000000">±10 % (4.59 to 5.61 kΩ)</text><text x="500" y="176" font-size="12.5" fill="#000000">or ±20 % to signal a sink</text><text x="24" y="344" font-size="12.5" fill="#000000">No Rd: the Mac sees nothing and never enables the port. 4.7 kΩ is 8 % low: inside both tolerances.</text><text x="24" y="362" font-size="12.5" fill="#000000">VBUS stays cut in REASON's upstream leads; the hub runs from its buck.</text><text x="24" y="388" font-size="12.5" fill="#000000">Simplified: a real Rp is a resistor or current source to a supply, and USB-C ports have two CC pins.</text></svg>
