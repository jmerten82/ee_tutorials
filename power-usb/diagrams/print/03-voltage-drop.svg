<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 480" role="img" aria-label="Where the voltage goes between supply and load" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><text x="24" y="30" font-size="15" font-weight="700" fill="#000000">Where the voltage goes</text><text x="24" y="50" font-size="12.5" fill="#000000">Every wire, contact and the fuse takes a share. Example: 4 A, 1 m of 18 AWG each way; values illustrative</text><rect x="24" y="90" width="70" height="130" rx="5" fill="#dedede" stroke="#000000" stroke-width="2.25"></rect><text x="59" y="150" text-anchor="middle" font-weight="700" fill="#000000">12 V</text><text x="59" y="166" text-anchor="middle" font-size="12.5" fill="#000000">supply</text><path d="M94 110H130" stroke="#000000" stroke-width="3.75"></path><g><rect x="130" y="98" width="60" height="24" rx="3" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><text x="160" y="114" text-anchor="middle" font-size="12.5" fill="#000000">jack</text><text x="160" y="90" text-anchor="middle" font-size="12.5" font-weight="700" fill="#000000">20 mV</text></g><path d="M190 110H210" stroke="#000000" stroke-width="3.75"></path><g><rect x="210" y="98" width="70" height="24" rx="3" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><text x="245" y="114" text-anchor="middle" font-size="12.5" fill="#000000">rocker</text><text x="245" y="90" text-anchor="middle" font-size="12.5" font-weight="700" fill="#000000">30 mV</text></g><path d="M280 110H300" stroke="#000000" stroke-width="3.75"></path><g><rect x="300" y="98" width="80" height="24" rx="3" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><text x="340" y="114" text-anchor="middle" font-size="12.5" fill="#000000">fuse</text><text x="340" y="90" text-anchor="middle" font-size="12.5" font-weight="700" fill="#000000">30 mV</text></g><path d="M380 110H400" stroke="#000000" stroke-width="3.75"></path><g><rect x="400" y="98" width="90" height="24" rx="3" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><text x="445" y="114" text-anchor="middle" font-size="12.5" fill="#000000">1 m 18 AWG +</text><text x="445" y="90" text-anchor="middle" font-size="12.5" font-weight="700" fill="#000000">84 mV</text></g><path d="M490 110H600V140" stroke="#000000" stroke-width="3.75" fill="none"></path><rect x="600" y="140" width="110" height="60" rx="5" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><text x="655" y="168" text-anchor="middle" font-weight="700" fill="#000000">Load</text><text x="655" y="184" text-anchor="middle" font-size="12.5" fill="#000000">4 A</text><path d="M655 200V220H490" stroke="#000000" stroke-width="3.75" fill="none"></path><g><rect x="400" y="208" width="90" height="24" rx="3" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><text x="445" y="224" text-anchor="middle" font-size="12.5" fill="#000000">1 m 18 AWG −</text><text x="445" y="200" text-anchor="middle" font-size="12.5" font-weight="700" fill="#000000">84 mV</text></g><path d="M400 220H94" stroke="#000000" stroke-width="3.75"></path><text x="60" y="290" font-weight="700" fill="#000000">Voltage seen along the path, plus minus return (12 V scale enlarged)</text><line x1="60" x2="690" y1="309.9999999999999" y2="309.9999999999999" stroke="#000000" stroke-width="1.5" stroke-dasharray="4 4"></line><path d="M60 309.9999999999999L130 310.0L150 314.0L190 314.0L210 326.0L280 326.0L300 338.0L380 338.0L400 358.0L470 358.0L490 374.0L560 374.0L580 390.0L690 390.0" fill="none" stroke="#000000" stroke-width="3"></path><text x="56" y="313.9999999999999" text-anchor="end" font-size="12.5" fill="#000000">12.00</text><text x="694" y="393.99999999999955" font-size="12.5" fill="#000000">11.80 V</text><text x="60" y="434" font-size="12.5" fill="#000000">Total here about 0.25 V: harmless at 12 V. The same 0.25 V on a 5 V USB rail leaves 4.75 V, the edge of the USB limit.</text><text x="60" y="454" font-size="12.5" fill="#000000">So: carry power at 12 V, make 5 V close to the hub, keep 5 V wires short and thick.</text></svg>
