<svg viewBox="0 0 760 420" role="img" aria-label="Backfeed: two 5 V sources on one wire" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><defs><marker id="pu-bf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#000000"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="700" fill="#000000">Backfeed: two 5 V sources on one wire</text><text x="24" y="50" font-size="12.5" fill="#000000">The upstream lead between the Mac and a self-powered hub</text><g><text x="24" y="84" font-weight="700" fill="#000000">Wrong: VBUS connected</text><rect x="24" y="98" width="176" height="110" rx="6" fill="#dedede" stroke="#000000" stroke-width="2.25"></rect><text x="112" y="122" text-anchor="middle" font-weight="700" fill="#000000">Mac USB port</text><text x="112" y="140" text-anchor="middle" font-size="12.5" fill="#000000">its own 5 V on VBUS</text><g><text x="214" y="118" font-size="12.5" fill="#000000">VBUS</text><path d="M200 124H560" stroke="#000000" stroke-width="2.7"></path></g><g><text x="214" y="144" font-size="12.5" fill="#000000">D+ / D−</text><path d="M200 150H560" stroke="#000000" stroke-width="2.7"></path></g><g><text x="214" y="170" font-size="12.5" fill="#000000">GND</text><path d="M200 176H560" stroke="#000000" stroke-width="2.7"></path></g><rect x="560" y="98" width="176" height="110" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><text x="648" y="122" text-anchor="middle" font-weight="700" fill="#000000">Hub, self-powered</text><text x="648" y="140" text-anchor="middle" font-size="12.5" fill="#000000">5 V from the buck</text></g><path d="M520 112H300" fill="none" stroke="#000000" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#pu-bf-arrow)"></path><text x="410" y="106" text-anchor="middle" font-size="12.5" font-weight="700" fill="#000000">current pushed into the Mac</text><g><text x="24" y="250" font-weight="700" fill="#000000">Right: VBUS cut and insulated at the hub end</text><rect x="24" y="264" width="176" height="110" rx="6" fill="#dedede" stroke="#000000" stroke-width="2.25"></rect><text x="112" y="288" text-anchor="middle" font-weight="700" fill="#000000">Mac USB port</text><text x="112" y="306" text-anchor="middle" font-size="12.5" fill="#000000">its own 5 V on VBUS</text><g><text x="214" y="284" font-size="12.5" fill="#000000">VBUS</text><g><path d="M200 290H360" stroke="#000000" stroke-width="2.7"></path><path d="M400 290H560" stroke="#000000" stroke-width="2.7" stroke-dasharray="2 4"></path><rect x="360" y="283" width="40" height="14" rx="3" fill="#dedede" stroke="#000000" stroke-width="1.8"></rect></g></g><g><text x="214" y="310" font-size="12.5" fill="#000000">D+ / D−</text><path d="M200 316H560" stroke="#000000" stroke-width="2.7"></path></g><g><text x="214" y="336" font-size="12.5" fill="#000000">GND</text><path d="M200 342H560" stroke="#000000" stroke-width="2.7"></path></g><rect x="560" y="264" width="176" height="110" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><text x="648" y="288" text-anchor="middle" font-weight="700" fill="#000000">Hub, self-powered</text><text x="648" y="306" text-anchor="middle" font-size="12.5" fill="#000000">5 V from the buck</text></g><text x="380" y="280" text-anchor="middle" font-size="12.5" fill="#000000">cut back 5 mm, heat shrink</text><text x="24" y="404" font-size="12.5" fill="#000000">Test: tower on, lead out of the Mac, VBUS to GND at the Mac's end reads 0 V (Exercise 5.1).</text></svg>
