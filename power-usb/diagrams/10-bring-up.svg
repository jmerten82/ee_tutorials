<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 380" role="img" aria-label="Staged bring-up of a new tower" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><defs><marker id="pu-bu-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111111"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#111111">Staged bring-up: one stage at a time, current-limited</text><text x="24" y="50" font-size="11.5" fill="#444444">Each box: what you connect, what you expect, and the bench supply's current limit</text><g><rect x="24" y="80" width="166" height="70" rx="6" fill="#ececec" stroke="#111111" stroke-width="1.5"></rect><text x="34" y="100" font-size="12" font-weight="600" fill="#111111">0  Cold checks</text><text x="34" y="120" font-size="11" fill="#111111">expect: no shorts, polarity</text><text x="34" y="138" font-size="11" fill="#444444">limit: meter only</text></g><g><rect x="208" y="80" width="166" height="70" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.5"></rect><text x="218" y="100" font-size="12" font-weight="600" fill="#111111">1  12 V bus only</text><text x="218" y="120" font-size="11" fill="#111111">expect: near 0 mA</text><text x="218" y="138" font-size="11" fill="#444444">limit: 100 mA</text></g><g><rect x="392" y="80" width="166" height="70" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.5"></rect><text x="402" y="100" font-size="12" font-weight="600" fill="#111111">2  Bucks, no load</text><text x="402" y="120" font-size="11" fill="#111111">expect: 5 V ± 4 %</text><text x="402" y="138" font-size="11" fill="#444444">limit: 200 mA</text></g><g><rect x="576" y="80" width="166" height="70" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.5"></rect><text x="586" y="100" font-size="12" font-weight="600" fill="#111111">3  Hub + XIAO</text><text x="586" y="120" font-size="11" fill="#111111">expect: budget typical</text><text x="586" y="138" font-size="11" fill="#444444">limit: 500 mA</text></g><g><rect x="24" y="210" width="166" height="70" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.5"></rect><text x="34" y="230" font-size="12" font-weight="600" fill="#111111">4  USB to the Mac</text><text x="34" y="250" font-size="11" fill="#111111">expect: enumerates</text><text x="34" y="268" font-size="11" fill="#444444">limit: 500 mA</text></g><g><rect x="208" y="210" width="166" height="70" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.5"></rect><text x="218" y="230" font-size="12" font-weight="600" fill="#111111">5  LED ring</text><text x="218" y="250" font-size="11" fill="#111111">expect: ring current</text><text x="218" y="268" font-size="11" fill="#444444">limit: 1.5 A</text></g><g><rect x="392" y="210" width="166" height="70" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.5"></rect><text x="402" y="230" font-size="12" font-weight="600" fill="#111111">6  Servos, MOSFET loads</text><text x="402" y="250" font-size="11" fill="#111111">expect: all move, switch</text><text x="402" y="268" font-size="11" fill="#444444">limit: budget peak</text></g><g><rect x="576" y="210" width="166" height="70" rx="6" fill="#ececec" stroke="#111111" stroke-width="1.5"></rect><text x="586" y="230" font-size="12" font-weight="600" fill="#111111">7  Real supply + fuse</text><text x="586" y="250" font-size="11" fill="#111111">expect: same as stage 6</text><text x="586" y="268" font-size="11" fill="#444444">limit: fuse</text></g><path d="M192 115H206" stroke="#111111" stroke-width="1.5" marker-end="url(#pu-bu-arrow)"></path><path d="M376 115H390" stroke="#111111" stroke-width="1.5" marker-end="url(#pu-bu-arrow)"></path><path d="M560 115H574" stroke="#111111" stroke-width="1.5" marker-end="url(#pu-bu-arrow)"></path><path d="M192 245H206" stroke="#111111" stroke-width="1.5" marker-end="url(#pu-bu-arrow)"></path><path d="M376 245H390" stroke="#111111" stroke-width="1.5" marker-end="url(#pu-bu-arrow)"></path><path d="M560 245H574" stroke="#111111" stroke-width="1.5" marker-end="url(#pu-bu-arrow)"></path><path d="M659 152V178H107V208" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#pu-bu-arrow)"></path><rect x="24" y="300" width="712" height="58" rx="6" fill="#ececec"></rect><text x="380" y="324" text-anchor="middle" font-size="12" font-weight="600" fill="#111111">Any surprise: switch off, find out why, repeat the stage.</text><text x="380" y="344" text-anchor="middle" font-size="11.5" fill="#111111">Supply in current limit at near 0 V = a short. Unexpected current = a reversed or wrong part. No current = an open connection.</text></svg>
