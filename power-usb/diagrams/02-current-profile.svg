<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 440" role="img" aria-label="Typical, peak and stall current of a servo" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><text x="24" y="30" font-size="15" font-weight="600" fill="#111111">A servo's current: typical, peak and stall</text><text x="24" y="50" font-size="11.5" fill="#444444">Illustration of an X-series servo at 12 V; measure your own with a shunt (Exercise 1.2)</text><rect x="447.50000000000006" y="168" width="120.99999999999994" height="192" fill="#ececec"></rect><text x="508.00000000000006" y="159.6" text-anchor="middle" font-size="11.5" fill="#111111">held by hand: stall</text><g><line x1="90" x2="640" y1="318" y2="318" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="4 4"></line><text x="648" y="322" font-size="11.5" font-weight="600" fill="#111111">typical</text><text x="648" y="336" font-size="10.5" fill="#444444">moving</text></g><g><line x1="90" x2="640" y1="240" y2="240" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="4 4"></line><text x="648" y="244" font-size="11.5" font-weight="600" fill="#111111">peak</text><text x="648" y="258" font-size="10.5" fill="#444444">start of a move</text></g><g><line x1="90" x2="640" y1="180" y2="180" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="4 4"></line><text x="648" y="184" font-size="11.5" font-weight="600" fill="#111111">stall</text><text x="648" y="198" font-size="10.5" fill="#444444">sets the fuse</text></g><line x1="90" x2="90" y1="150" y2="360" stroke="#111111" stroke-width="1.2"></line><line x1="90" x2="640" y1="360" y2="360" stroke="#111111" stroke-width="1.2"></line><text x="82" y="364" text-anchor="end" font-size="11" fill="#111111">0.0 A</text><text x="82" y="304" text-anchor="end" font-size="11" fill="#111111">0.5 A</text><text x="82" y="244" text-anchor="end" font-size="11" fill="#111111">1.0 A</text><text x="82" y="184" text-anchor="end" font-size="11" fill="#111111">1.5 A</text><path d="M90.0 354.0L156.0 354.0L157.1 240.0L167.0 288.0L178.0 314.4L271.5 318.0L279.8 354.0L376.0 354.0L377.1 246.0L387.0 294.0L398.0 312.0L442.0 288.0L453.0 186.0L563.0 180.0L568.5 354.0L640.0 354.0" fill="none" stroke="#111111" stroke-width="2"></path><text x="112" y="344" font-size="11" fill="#444444">at rest</text><text x="200" y="308" font-size="11" fill="#444444">move</text><text x="321" y="344" font-size="11" fill="#444444">at rest</text><text x="640" y="380" text-anchor="end" font-size="11" fill="#444444">time (a few seconds)</text><text x="24" y="408" font-size="11.5" fill="#111111">Typical current heats wires and regulators. Peaks cause the voltage dips that capacitors must cover.</text><text x="24" y="426" font-size="11.5" fill="#111111">Stall is the worst case the harness must survive until the fuse opens, or the servo's own protection cuts out.</text></svg>
