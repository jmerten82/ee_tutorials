<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 420" role="img" aria-label="Daisy-chained and star grounds" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><defs><marker id="pu-gr-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111111"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#111111">Ground is a wire: daisy chain and star</text><text x="24" y="50" font-size="11.5" fill="#444444">Only the ground wires are drawn. Arrows: the servo's return current on its way back to the supply</text><line x1="380" x2="380" y1="66" y2="360" stroke="#bbbbbb"></line><text x="24" y="84" font-weight="600" fill="#111111">Daisy chain: shared return</text><g><rect x="24" y="110" width="96" height="44" rx="5" fill="#ececec" stroke="#111111" stroke-width="1.5"></rect><text x="72" y="129" text-anchor="middle" font-size="12" font-weight="600" fill="#111111">Supply −</text><text x="72" y="144" text-anchor="middle" font-size="10.5" fill="#444444">0 V</text></g><g><rect x="140" y="210" width="96" height="44" rx="5" fill="#ffffff" stroke="#111111" stroke-width="1.5"></rect><text x="188" y="229" text-anchor="middle" font-size="12" font-weight="600" fill="#111111">XIAO + hub</text><text x="188" y="244" text-anchor="middle" font-size="10.5" fill="#444444">logic, USB</text></g><g><rect x="256" y="300" width="96" height="44" rx="5" fill="#ffffff" stroke="#111111" stroke-width="1.5"></rect><text x="304" y="319" text-anchor="middle" font-size="12" font-weight="600" fill="#111111">Servo</text><text x="304" y="334" text-anchor="middle" font-size="10.5" fill="#444444">up to 2 A</text></g><path d="M72 154V232H140" fill="none" stroke="#111111" stroke-width="2"></path><path d="M236 232H304V300" fill="none" stroke="#111111" stroke-width="2"></path><path d="M290 290V250" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#pu-gr-arrow)"></path><path d="M130 222H84V170" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#pu-gr-arrow)"></path><text x="24" y="380" font-size="11.5" fill="#111111">The servo's 2 A flows through the logic's ground:</text><text x="24" y="396" font-size="11.5" fill="#111111">the XIAO's 0 V moves with every servo pulse.</text><text x="404" y="84" font-weight="600" fill="#111111">Star: separate returns</text><g><rect x="404" y="110" width="96" height="44" rx="5" fill="#ececec" stroke="#111111" stroke-width="1.5"></rect><text x="452" y="129" text-anchor="middle" font-size="12" font-weight="600" fill="#111111">Supply −</text><text x="452" y="144" text-anchor="middle" font-size="10.5" fill="#444444">star point</text></g><g><rect x="520" y="210" width="96" height="44" rx="5" fill="#ffffff" stroke="#111111" stroke-width="1.5"></rect><text x="568" y="229" text-anchor="middle" font-size="12" font-weight="600" fill="#111111">XIAO + hub</text><text x="568" y="244" text-anchor="middle" font-size="10.5" fill="#444444">logic, USB</text></g><g><rect x="636" y="300" width="96" height="44" rx="5" fill="#ffffff" stroke="#111111" stroke-width="1.5"></rect><text x="684" y="319" text-anchor="middle" font-size="12" font-weight="600" fill="#111111">Servo</text><text x="684" y="334" text-anchor="middle" font-size="10.5" fill="#444444">up to 2 A</text></g><path d="M452 154V232H520" fill="none" stroke="#111111" stroke-width="1.5"></path><path d="M500 132H684V300" fill="none" stroke="#111111" stroke-width="3"></path><path d="M670 290V160" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#pu-gr-arrow)"></path><text x="560" y="126" font-size="11" fill="#111111">own heavy return wire</text><text x="404" y="380" font-size="11.5" fill="#111111">The servo's current returns on its own wire; the</text><text x="404" y="396" font-size="11.5" fill="#111111">logic's ground carries only the logic's milliamps.</text></svg>
