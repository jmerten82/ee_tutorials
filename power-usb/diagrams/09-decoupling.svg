<svg viewBox="0 0 760 440" role="img" aria-label="A bulk capacitor supplies the peak current" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><text x="24" y="30" font-size="15" font-weight="600" fill="#111111">A bulk capacitor supplies the peak</text><text x="24" y="50" font-size="11.5" fill="#444444">A load step (a servo starting, the ring going white) and the 5 V rail at the hub; illustrative</text><text x="70" y="86" font-weight="600" fill="#111111">Load current</text><path d="M70 150H190V100H400V150H670" fill="none" stroke="#111111" stroke-width="2"></path><text x="678" y="104" font-size="11.5" fill="#111111">step</text><line x1="70" x2="670" y1="220" y2="220" stroke="#bbbbbb" stroke-dasharray="4 4"></line><line x1="70" x2="670" y1="290" y2="290" stroke="#bbbbbb" stroke-dasharray="4 4"></line><text x="64" y="224" text-anchor="end" font-size="11" fill="#111111">5.0 V</text><text x="64" y="294" text-anchor="end" font-size="11" fill="#111111">4.75</text><text x="70" y="196" font-weight="600" fill="#111111">5 V rail, no bulk capacitor</text><path d="M70 220H190L190.0 220.0L195.0 253.9L200.0 281.4L205.0 286.7L210.0 280.3L215.0 274.6L220.0 269.4L225.0 264.7L230.0 260.4L235.0 256.6L240.0 253.1L245.0 250.0L250.0 247.1L255.0 244.5L260.0 242.2L265.0 240.1L270.0 238.2L275.0 236.4L280.0 234.9L285.0 233.5L290.0 232.2L295.0 231.0L300.0 230.0L305.0 229.0L310.0 228.2L315.0 227.4L320.0 226.7L325.0 226.0L330.0 225.5L335.0 225.0L340.0 224.5H400L400.0 220.0L404.5 200.6L409.0 186.7L413.5 191.3L418.0 195.3L422.5 198.7L427.0 201.7L431.5 204.3L436.0 206.4L440.5 208.3L445.0 210.0L449.5 211.4L454.0 212.6L458.5 213.6L463.0 214.5L467.5 215.3L472.0 215.9L476.5 216.5L481.0 217.0L485.5 217.4L490.0 217.8H670" fill="none" stroke="#111111" stroke-width="2" stroke-dasharray="7 4"></path><text x="262" y="318" font-size="11.5" font-weight="600" fill="#111111">dips below 4.75 V: the hub drops off USB</text><text x="70" y="354" font-weight="600" fill="#111111">5 V rail, 1000 µF at the load</text><path d="M70 378H190L190.0 378.0L194.0 386.3L198.0 393.0L202.0 394.3L206.0 392.7L210.0 391.3L214.0 390.1L218.0 388.9L222.0 387.9L226.0 386.9L230.0 386.1L234.0 385.3L238.0 384.6L242.0 384.0L246.0 383.4L250.0 382.9L254.0 382.4L258.0 382.0L262.0 381.6L266.0 381.3L270.0 381.0L274.0 380.7L278.0 380.4L282.0 380.2L286.0 380.0L290.0 379.8L294.0 379.6L298.0 379.5L302.0 379.3L306.0 379.2L310.0 379.1H400L400.0 378.0L403.6 373.3L407.2 369.9L410.8 371.0L414.4 372.0L418.0 372.8L421.6 373.5L425.2 374.2L428.8 374.7L432.4 375.1L436.0 375.5L439.6 375.9L443.2 376.2L446.8 376.4L450.4 376.7L454.0 376.8L457.6 377.0L461.2 377.1L464.8 377.3L468.4 377.4L472.0 377.5H670" fill="none" stroke="#111111" stroke-width="2"></path><line x1="70" x2="670" y1="378" y2="378" stroke="#bbbbbb" stroke-dasharray="4 4"></line><text x="678" y="382" font-size="11.5" fill="#111111">small dip</text><text x="24" y="428" font-size="11.5" fill="#111111">The capacitor delivers the first milliseconds of the step; the regulator catches up after it. Put it at the load, not at the supply.</text></svg>
