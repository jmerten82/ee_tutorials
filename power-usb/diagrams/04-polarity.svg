<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 340" role="img" aria-label="Three ways to protect against reversed polarity" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><text x="24" y="30" font-size="15" font-weight="600" fill="#111111">Three ways to protect against reversed polarity</text><text x="24" y="50" font-size="11.5" fill="#444444">The D36V28F5 has its own reverse protection up to 40 V; most servos, modules and hubs do not</text><line x1="253" x2="253" y1="70" y2="290" stroke="#bbbbbb"></line><line x1="506" x2="506" y1="70" y2="290" stroke="#bbbbbb"></line><text x="24" y="86" font-weight="600" fill="#111111">Series Schottky diode</text><g><rect x="24" y="100" width="50" height="90" rx="4" fill="#ececec" stroke="#111111" stroke-width="1.5"></rect><text x="49" y="150" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111111">12 V</text><text x="68" y="116" text-anchor="end" font-size="11" fill="#111111">+</text><text x="68" y="184" text-anchor="end" font-size="11" fill="#111111">−</text></g><path d="M74 116H124M140 116H180V120M180 170V176H74" fill="none" stroke="#111111" stroke-width="1.5"></path><g><polygon points="124,106 124,126 140,116" fill="none" stroke="#111111" stroke-width="1.5"></polygon><line x1="140" x2="140" y1="105" y2="127" stroke="#111111" stroke-width="2.5"></line></g><g><rect x="170" y="112" width="44" height="66" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.5"></rect><text x="192" y="149" text-anchor="middle" font-size="11.5" fill="#111111">load</text></g><text x="24" y="224" font-size="11.5" fill="#111111">Drops about 0.4 V; heat</text><text x="24" y="240" font-size="11.5" fill="#111111">= 0.4 V × I: 2 W at 5 A.</text><text x="24" y="256" font-size="11.5" fill="#444444">Simple and certain.</text><text x="277" y="86" font-weight="600" fill="#111111">P-channel MOSFET</text><g><rect x="277" y="100" width="50" height="90" rx="4" fill="#ececec" stroke="#111111" stroke-width="1.5"></rect><text x="302" y="150" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111111">12 V</text><text x="321" y="116" text-anchor="end" font-size="11" fill="#111111">+</text><text x="321" y="184" text-anchor="end" font-size="11" fill="#111111">−</text></g><path d="M327 116H360M396 116H433V120M433 170V176H327" fill="none" stroke="#111111" stroke-width="1.5"></path><rect x="360" y="104" width="36" height="24" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.5"></rect><text x="378" y="120" text-anchor="middle" font-size="10" font-weight="600" fill="#111111">P-FET</text><path d="M378 128V176" fill="none" stroke="#111111" stroke-width="1.2" stroke-dasharray="3 2"></path><text x="384" y="158" font-size="10.5" fill="#444444">gate</text><g><rect x="423" y="112" width="44" height="66" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.5"></rect><text x="445" y="149" text-anchor="middle" font-size="11.5" fill="#111111">load</text></g><text x="277" y="224" font-size="11.5" fill="#111111">Correct polarity: gate low,</text><text x="277" y="240" font-size="11.5" fill="#111111">the MOSFET conducts with a</text><text x="277" y="256" font-size="11.5" fill="#111111">drop of tens of mV. Reversed: off.</text><text x="277" y="272" font-size="11.5" fill="#444444">Add a Zener gate clamp above 12 V.</text><text x="530" y="86" font-weight="600" fill="#111111">Fuse + crowbar diode</text><g><rect x="530" y="100" width="50" height="90" rx="4" fill="#ececec" stroke="#111111" stroke-width="1.5"></rect><text x="555" y="150" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111111">12 V</text><text x="574" y="116" text-anchor="end" font-size="11" fill="#111111">+</text><text x="574" y="184" text-anchor="end" font-size="11" fill="#111111">−</text></g><rect x="588" y="108" width="30" height="16" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.5"></rect><text x="603" y="138" text-anchor="middle" font-size="10.5" fill="#111111">fuse</text><path d="M580 116H588M618 116H690V120M690 170V176H580" fill="none" stroke="#111111" stroke-width="1.5"></path><path d="M640 116V137M640 155V176" stroke="#111111" stroke-width="1.5"></path><polygon points="630,155 650,155 640,139" fill="none" stroke="#111111" stroke-width="1.5"></polygon><line x1="629" x2="651" y1="138" y2="138" stroke="#111111" stroke-width="2.5"></line><g><rect x="680" y="112" width="44" height="66" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.5"></rect><text x="702" y="149" text-anchor="middle" font-size="11.5" fill="#111111">load</text></g><text x="530" y="224" font-size="11.5" fill="#111111">Reversed: the diode conducts</text><text x="530" y="240" font-size="11.5" fill="#111111">and the fuse blows. No loss</text><text x="530" y="256" font-size="11.5" fill="#111111">in normal use; costs a fuse.</text><text x="24" y="316" font-size="11.5" fill="#111111">Best of all: keyed connectors and a meter check before every first connection.</text></svg>
