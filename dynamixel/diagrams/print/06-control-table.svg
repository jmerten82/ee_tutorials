<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 420" role="img" aria-label="The control table: EEPROM and RAM" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><text x="24" y="30" font-size="15" font-weight="700" fill="#000000">The control table: EEPROM and RAM</text><text x="24" y="50" font-size="12.5" fill="#000000">Selected X-series addresses; your model's e-Manual page has the full table with sizes and units</text><g><rect x="24" y="76" width="330" height="42" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><text x="36" y="94" font-weight="700" fill="#000000">EEPROM: addresses 0 to 63</text><text x="36" y="110" font-size="12.5" fill="#000000">kept at power-off; write only with torque off</text><g><rect x="24" y="124" width="330" height="24" fill="#ffffff" stroke="#000000" stroke-width="1.5"></rect><text x="36" y="140" font-size="12" font-weight="700" fill="#000000">7</text><text x="114" y="140" font-size="12" fill="#000000">ID</text></g><g><rect x="24" y="150" width="330" height="24" fill="#ffffff" stroke="#000000" stroke-width="1.5"></rect><text x="36" y="166" font-size="12" font-weight="700" fill="#000000">8</text><text x="114" y="166" font-size="12" fill="#000000">Baud Rate</text></g><g><rect x="24" y="176" width="330" height="24" fill="#ffffff" stroke="#000000" stroke-width="1.5"></rect><text x="36" y="192" font-size="12" font-weight="700" fill="#000000">9</text><text x="114" y="192" font-size="12" fill="#000000">Return Delay Time</text></g><g><rect x="24" y="202" width="330" height="24" fill="#ffffff" stroke="#000000" stroke-width="1.5"></rect><text x="36" y="218" font-size="12" font-weight="700" fill="#000000">10</text><text x="114" y="218" font-size="12" fill="#000000">Drive Mode</text></g><g><rect x="24" y="228" width="330" height="24" fill="#ffffff" stroke="#000000" stroke-width="1.5"></rect><text x="36" y="244" font-size="12" font-weight="700" fill="#000000">11</text><text x="114" y="244" font-size="12" fill="#000000">Operating Mode</text></g><g><rect x="24" y="254" width="330" height="24" fill="#ffffff" stroke="#000000" stroke-width="1.5"></rect><text x="36" y="270" font-size="12" font-weight="700" fill="#000000">20</text><text x="114" y="270" font-size="12" fill="#000000">Homing Offset</text></g><g><rect x="24" y="280" width="330" height="24" fill="#ffffff" stroke="#000000" stroke-width="1.5"></rect><text x="36" y="296" font-size="12" font-weight="700" fill="#000000">36</text><text x="114" y="296" font-size="12" fill="#000000">PWM Limit</text></g><g><rect x="24" y="306" width="330" height="24" fill="#ffffff" stroke="#000000" stroke-width="1.5"></rect><text x="36" y="322" font-size="12" font-weight="700" fill="#000000">48 / 52</text><text x="114" y="322" font-size="12" fill="#000000">Max / Min Position Limit</text></g><g><rect x="24" y="332" width="330" height="24" fill="#ffffff" stroke="#000000" stroke-width="1.5"></rect><text x="36" y="348" font-size="12" font-weight="700" fill="#000000">63</text><text x="114" y="348" font-size="12" fill="#000000">Shutdown</text></g></g><g><rect x="406" y="76" width="330" height="42" rx="6" fill="#dedede" stroke="#000000" stroke-width="2.25"></rect><text x="418" y="94" font-weight="700" fill="#000000">RAM: addresses 64 and up</text><text x="418" y="110" font-size="12.5" fill="#000000">reset at power-up; the live state</text><g><rect x="406" y="124" width="330" height="24" fill="#dedede" stroke="#000000" stroke-width="1.5"></rect><text x="418" y="140" font-size="12" font-weight="700" fill="#000000">64</text><text x="496" y="140" font-size="12" fill="#000000">Torque Enable</text></g><g><rect x="406" y="150" width="330" height="24" fill="#dedede" stroke="#000000" stroke-width="1.5"></rect><text x="418" y="166" font-size="12" font-weight="700" fill="#000000">65</text><text x="496" y="166" font-size="12" fill="#000000">LED</text></g><g><rect x="406" y="176" width="330" height="24" fill="#dedede" stroke="#000000" stroke-width="1.5"></rect><text x="418" y="192" font-size="12" font-weight="700" fill="#000000">70</text><text x="496" y="192" font-size="12" fill="#000000">Hardware Error Status</text></g><g><rect x="406" y="202" width="330" height="24" fill="#dedede" stroke="#000000" stroke-width="1.5"></rect><text x="418" y="218" font-size="12" font-weight="700" fill="#000000">108 / 112</text><text x="496" y="218" font-size="12" fill="#000000">Profile Accel. / Velocity</text></g><g><rect x="406" y="228" width="330" height="24" fill="#dedede" stroke="#000000" stroke-width="1.5"></rect><text x="418" y="244" font-size="12" font-weight="700" fill="#000000">116</text><text x="496" y="244" font-size="12" fill="#000000">Goal Position</text></g><g><rect x="406" y="254" width="330" height="24" fill="#dedede" stroke="#000000" stroke-width="1.5"></rect><text x="418" y="270" font-size="12" font-weight="700" fill="#000000">122</text><text x="496" y="270" font-size="12" fill="#000000">Moving</text></g><g><rect x="406" y="280" width="330" height="24" fill="#dedede" stroke="#000000" stroke-width="1.5"></rect><text x="418" y="296" font-size="12" font-weight="700" fill="#000000">132</text><text x="496" y="296" font-size="12" fill="#000000">Present Position</text></g><g><rect x="406" y="306" width="330" height="24" fill="#dedede" stroke="#000000" stroke-width="1.5"></rect><text x="418" y="322" font-size="12" font-weight="700" fill="#000000">144</text><text x="496" y="322" font-size="12" fill="#000000">Present Input Voltage</text></g><g><rect x="406" y="332" width="330" height="24" fill="#dedede" stroke="#000000" stroke-width="1.5"></rect><text x="418" y="348" font-size="12" font-weight="700" fill="#000000">146</text><text x="496" y="348" font-size="12" fill="#000000">Present Temperature</text></g></g><text x="24" y="400" font-size="12.5" fill="#000000">Torque Enable = 1 locks the EEPROM area: an EEPROM write then fails with an Access Error.</text></svg>
