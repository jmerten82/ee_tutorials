<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 360" role="img" aria-label="The rig script: calibrate, home, run, report" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><defs><marker id="dx-rf-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#000000"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="700" fill="#000000">The rig script: calibrate, home, run, report</text><text x="24" y="50" font-size="12.5" fill="#000000">python rig.py calibrate | home | run | status, all driven by rig.json</text><g><rect x="24" y="90" width="160" height="120" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><text x="104" y="114" text-anchor="middle" font-weight="700" fill="#000000">calibrate</text><text x="104" y="136" text-anchor="middle" font-size="12.5" fill="#000000">torque off</text><text x="104" y="152" text-anchor="middle" font-size="12.5" fill="#000000">move each joint by hand</text><text x="104" y="168" text-anchor="middle" font-size="12.5" fill="#000000">record min, max, home</text><text x="104" y="184" text-anchor="middle" font-size="12.5" fill="#000000">save rig.json</text></g><g><rect x="206" y="90" width="160" height="120" rx="6" fill="#dedede" stroke="#000000" stroke-width="2.25"></rect><text x="286" y="114" text-anchor="middle" font-weight="700" fill="#000000">home</text><text x="286" y="136" text-anchor="middle" font-size="12.5" fill="#000000">check errors, temperature</text><text x="286" y="152" text-anchor="middle" font-size="12.5" fill="#000000">store limits if changed</text><text x="286" y="168" text-anchor="middle" font-size="12.5" fill="#000000">gentle profile</text><text x="286" y="184" text-anchor="middle" font-size="12.5" fill="#000000">go to home</text></g><g><rect x="388" y="90" width="160" height="120" rx="6" fill="#dedede" stroke="#000000" stroke-width="2.25"></rect><text x="468" y="114" text-anchor="middle" font-weight="700" fill="#000000">run</text><text x="468" y="136" text-anchor="middle" font-size="12.5" fill="#000000">home first</text><text x="468" y="152" text-anchor="middle" font-size="12.5" fill="#000000">check every goal</text><text x="468" y="168" text-anchor="middle" font-size="12.5" fill="#000000">against the limits</text><text x="468" y="184" text-anchor="middle" font-size="12.5" fill="#000000">step through poses</text></g><g><rect x="570" y="90" width="160" height="120" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><text x="650" y="114" text-anchor="middle" font-weight="700" fill="#000000">status</text><text x="650" y="136" text-anchor="middle" font-size="12.5" fill="#000000">ping, position</text><text x="650" y="152" text-anchor="middle" font-size="12.5" fill="#000000">voltage, temperature</text><text x="650" y="168" text-anchor="middle" font-size="12.5" fill="#000000">errors, torque</text><text x="650" y="184" text-anchor="middle" font-size="12.5" fill="#000000">append status.csv</text></g><path d="M184 150H204" fill="none" stroke="#000000" stroke-width="2.25" marker-end="url(#dx-rf-arrow)"></path><path d="M366 150H386" fill="none" stroke="#000000" stroke-width="2.25" marker-end="url(#dx-rf-arrow)"></path><path d="M548 150H568" fill="none" stroke="#000000" stroke-width="2.25" marker-end="url(#dx-rf-arrow)"></path><rect x="206" y="250" width="342" height="50" rx="6" fill="none" stroke="#000000" stroke-dasharray="5 4"></rect><text x="377" y="272" text-anchor="middle" font-size="12.5" font-weight="700" fill="#000000">finally: torque off for every servo, close the port</text><text x="377" y="289" text-anchor="middle" font-size="12.5" fill="#000000">on success, on errors and on Ctrl-C</text><path d="M286 210V248M468 210V248" stroke="#000000" stroke-width="1.5" stroke-dasharray="3 3"></path><text x="24" y="336" font-size="12.5" fill="#000000">rig.json holds names, IDs, limits, home positions, profile and the motion sequence.</text></svg>
