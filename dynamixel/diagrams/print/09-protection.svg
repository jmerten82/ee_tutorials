<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 380" role="img" aria-label="Protection inside the servo" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><defs><marker id="dx-pr-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#000000"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="700" fill="#000000">Protection inside the servo</text><text x="24" y="50" font-size="12.5" fill="#000000">Limits stored in EEPROM; faults reported in RAM; a reboot clears them</text><g><rect x="24" y="76" width="210" height="120" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><text x="36" y="98" font-weight="700" fill="#000000">Limits (EEPROM)</text><text x="36" y="118" font-size="12.5" fill="#000000">Temperature Limit (31)</text><text x="36" y="134" font-size="12.5" fill="#000000">Max/Min Voltage Limit (32, 34)</text><text x="36" y="150" font-size="12.5" fill="#000000">PWM Limit (36)</text><text x="36" y="166" font-size="12.5" fill="#000000">Current Limit (38, some models)</text></g><g><rect x="274" y="76" width="210" height="120" rx="6" fill="#dedede" stroke="#000000" stroke-width="2.25"></rect><text x="286" y="98" font-weight="700" fill="#000000">A fault occurs</text><text x="286" y="118" font-size="12.5" fill="#000000">too hot, wrong voltage,</text><text x="286" y="134" font-size="12.5" fill="#000000">overload, electrical shock,</text><text x="286" y="150" font-size="12.5" fill="#000000">encoder error</text></g><g><rect x="524" y="76" width="212" height="120" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><text x="536" y="98" font-weight="700" fill="#000000">Hardware Error Status (70)</text><text x="536" y="118" font-size="12.5" fill="#000000">one bit per fault</text><text x="536" y="134" font-size="12.5" fill="#000000">alert bit 7 set in every</text><text x="536" y="150" font-size="12.5" fill="#000000">status packet</text></g><path d="M234 136H272" fill="none" stroke="#000000" stroke-width="2.25" marker-end="url(#dx-pr-arrow)"></path><path d="M484 136H522" fill="none" stroke="#000000" stroke-width="2.25" marker-end="url(#dx-pr-arrow)"></path><g><rect x="274" y="230" width="210" height="100" rx="6" fill="#dedede" stroke="#000000" stroke-width="2.25"></rect><text x="286" y="252" font-weight="700" fill="#000000">Shutdown (63)</text><text x="286" y="272" font-size="12.5" fill="#000000">default 52: overheating,</text><text x="286" y="288" font-size="12.5" fill="#000000">electrical shock, overload</text><text x="286" y="304" font-size="12.5" fill="#000000">→ torque off, stays off</text></g><path d="M630 196V212H380V228" fill="none" stroke="#000000" stroke-width="2.25" marker-end="url(#dx-pr-arrow)"></path><g><rect x="524" y="230" width="212" height="100" rx="6" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><text x="536" y="252" font-weight="700" fill="#000000">Recovery</text><text x="536" y="272" font-size="12.5" fill="#000000">fix the cause, then</text><text x="536" y="288" font-size="12.5" fill="#000000">Reboot (instruction 08)</text><text x="536" y="304" font-size="12.5" fill="#000000">or power-cycle</text></g><path d="M484 280H522" fill="none" stroke="#000000" stroke-width="2.25" marker-end="url(#dx-pr-arrow)"></path><text x="24" y="260" font-size="12.5" fill="#000000">Your script: read 70 at start,</text><text x="24" y="276" font-size="12.5" fill="#000000">watch temperature and voltage,</text><text x="24" y="292" font-size="12.5" fill="#000000">torque off on every exit.</text></svg>
