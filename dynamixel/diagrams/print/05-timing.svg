<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 340" role="img" aria-label="Half-duplex timing on the DATA line" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><defs><marker id="dx-tm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#000000"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="700" fill="#000000">Half-duplex timing on the DATA line</text><text x="24" y="50" font-size="12.5" fill="#000000">One wire, two speakers taking turns. Idle is high; each byte starts with a low start bit. Not to scale</text><rect x="80" y="118" width="272" height="64" fill="#dedede"></rect><rect x="482" y="118" width="208" height="64" fill="#dedede"></rect><path d="M30 " fill="none" stroke="#000000" stroke-width="3"></path><text x="216" y="104" text-anchor="middle" font-weight="700" fill="#000000">instruction packet (U2D2)</text><text x="586" y="104" text-anchor="middle" font-weight="700" fill="#000000">status packet (servo)</text><path d="M352 214H482" stroke="#000000" stroke-width="1.8" marker-start="url(#dx-tm-arrow)" marker-end="url(#dx-tm-arrow)"></path><line x1="352" x2="352" y1="186" y2="220" stroke="#000000" stroke-width="1.5" stroke-dasharray="2 2"></line><line x1="482" x2="482" y1="186" y2="220" stroke="#000000" stroke-width="1.5" stroke-dasharray="2 2"></line><text x="417" y="238" text-anchor="middle" font-size="12.5" fill="#000000">Return Delay Time</text><text x="417" y="254" text-anchor="middle" font-size="12.5" fill="#000000">250 × 2 µs = 500 µs by default</text><text x="24" y="292" font-size="12.5" fill="#000000">On the scope: probe the TTL DATA test point, trigger on a falling edge, decode UART 8N1, idle high, at the bus baud rate.</text><text x="24" y="312" font-size="12.5" fill="#000000">Measure the gap with X cursors; set Return Delay Time to 0 and measure again.</text></svg>
