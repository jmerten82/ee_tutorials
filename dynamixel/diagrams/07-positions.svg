<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 420" role="img" aria-label="Positions, limits and homing offset" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><text x="24" y="30" font-size="15" font-weight="600" fill="#111111">Positions, limits and homing offset</text><text x="24" y="50" font-size="11.5" fill="#444444">Position mode: one turn is 4096 counts, about 0.088° per count; 2048 is the middle</text><circle cx="230" cy="220" r="130" fill="none" stroke="#bbbbbb" stroke-width="1.5"></circle><path d="M355.3 254.7A130 130 0 0 1 104.5 253.9" fill="none" stroke="#111111" stroke-width="8" opacity="0.35"></path><g><line x1="230" y1="98" x2="230" y2="82" stroke="#111111" stroke-width="2"></line><text x="230" y="68" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111111">0 / 4095</text></g><g><line x1="352" y1="220" x2="368" y2="220" stroke="#111111" stroke-width="2"></line><text x="386" y="224" text-anchor="start" font-size="11.5" font-weight="600" fill="#111111">1024</text></g><g><line x1="230.00000000000003" y1="342" x2="230.00000000000003" y2="358" stroke="#111111" stroke-width="2"></line><text x="230.00000000000003" y="380" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111111">2048</text></g><g><line x1="108" y1="220.00000000000003" x2="92" y2="220.00000000000003" stroke="#111111" stroke-width="2"></line><text x="74" y="224.00000000000003" text-anchor="end" font-size="11.5" font-weight="600" fill="#111111">3072</text></g><g><line x1="347.5806800270436" y1="252.5389564119376" x2="363.0010970797707" y2="256.806360531536" stroke="#111111" stroke-width="2"></line><text x="380.3490662640886" y="265.60719016608414" text-anchor="start" font-size="11.5" font-weight="600" fill="#111111">Min limit</text></g><g><line x1="112.22187811288191" y1="251.81688238566366" x2="96.77556704571887" y2="255.98958827230808" stroke="#111111" stroke-width="2"></line><text x="79.39846709516047" y="264.68388239478304" text-anchor="end" font-size="11.5" font-weight="600" fill="#111111">Max limit</text></g><line x1="230" y1="220" x2="230" y2="330" stroke="#111111" stroke-width="4"></line><circle cx="230" cy="220" r="8" fill="#111111"></circle><text x="244" y="214" font-size="11.5" fill="#111111">horn at home</text><text x="470" y="110" font-weight="600" fill="#111111">Safe range (shaded)</text><text x="470" y="128" font-size="11.5" fill="#111111">Goal Position outside Min/Max Position</text><text x="470" y="144" font-size="11.5" fill="#111111">Limit is refused (Data Limit Error).</text><text x="470" y="184" font-weight="600" fill="#111111">Homing Offset</text><text x="470" y="202" font-size="11.5" fill="#111111">Shifts the reading: Present Position =</text><text x="470" y="218" font-size="11.5" fill="#111111">raw position + Homing Offset.</text><text x="470" y="234" font-size="11.5" fill="#111111">Set it so the mechanical centre reads 2048.</text><text x="470" y="274" font-weight="600" fill="#111111">Drive Mode bit 0</text><text x="470" y="292" font-size="11.5" fill="#111111">Reverses the direction, for mirrored</text><text x="470" y="308" font-size="11.5" fill="#111111">mounting. Set limits after changing it.</text><text x="24" y="404" font-size="11.5" fill="#111111">Limits are in the servo's EEPROM: they protect the mechanism even when the controlling code is wrong.</text></svg>
