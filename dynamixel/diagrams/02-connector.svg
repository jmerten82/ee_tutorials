<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 360" role="img" aria-label="The X3P cable and the TTL pinout" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><text x="24" y="30" font-size="15" font-weight="600" fill="#111111">The X3P cable and the TTL pinout</text><text x="24" y="50" font-size="11.5" fill="#444444">JST EH 3-pin, crimped contacts. Pin numbers from the ROBOTIS e-Manual; check pin 1 on your connector</text><rect x="60" y="90" width="150" height="70" rx="4" fill="#ececec" stroke="#111111" stroke-width="1.5"></rect><g><rect x="78" y="108" width="30" height="34" rx="2" fill="#ffffff" stroke="#111111" stroke-width="1.5"></rect><text x="93" y="130" text-anchor="middle" font-weight="600" fill="#111111">1</text></g><g><rect x="120" y="108" width="30" height="34" rx="2" fill="#ffffff" stroke="#111111" stroke-width="1.5"></rect><text x="135" y="130" text-anchor="middle" font-weight="600" fill="#111111">2</text></g><g><rect x="162" y="108" width="30" height="34" rx="2" fill="#ffffff" stroke="#111111" stroke-width="1.5"></rect><text x="177" y="130" text-anchor="middle" font-weight="600" fill="#111111">3</text></g><text x="135" y="80" text-anchor="middle" font-size="11.5" fill="#111111">housing, contacts facing you</text><g><path d="M93 160V210H260" fill="none" stroke="#111111" stroke-width="1.2"></path><text x="268" y="214" font-weight="600" fill="#111111">Pin 1: GND</text><text x="400" y="214" font-size="11.5" fill="#111111">ground</text></g><g><path d="M135 160V244H260" fill="none" stroke="#111111" stroke-width="1.2"></path><text x="268" y="248" font-weight="600" fill="#111111">Pin 2: VDD</text><text x="400" y="248" font-size="11.5" fill="#111111">supply (12 V or 5 V)</text></g><g><path d="M177 160V278H260" fill="none" stroke="#111111" stroke-width="1.2"></path><text x="268" y="282" font-weight="600" fill="#111111">Pin 3: DATA</text><text x="400" y="282" font-size="11.5" fill="#111111">half-duplex TTL data</text></g><rect x="470" y="80" width="250" height="100" rx="6" fill="none" stroke="#bbbbbb" stroke-dasharray="5 4"></rect><text x="482" y="100" font-size="11.5" font-weight="600" fill="#111111">Two connectors per servo,</text><text x="482" y="117" font-size="11.5" font-weight="600" fill="#111111">wired in parallel</text><rect x="520" y="126" width="110" height="42" rx="6" fill="#ececec" stroke="#111111" stroke-width="1.5"></rect><rect x="510" y="138" width="12" height="18" fill="#111111"></rect><rect x="628" y="138" width="12" height="18" fill="#111111"></rect><path d="M522 147H628" stroke="#111111" stroke-width="1" stroke-dasharray="3 3"></path><text x="24" y="330" font-size="11.5" fill="#111111">Crimped contacts are never soldered. Seat every plug fully, with the bus unpowered.</text></svg>
