<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 420" role="img" aria-label="The control table: EEPROM and RAM" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><text x="24" y="30" font-size="15" font-weight="600" fill="#111111">The control table: EEPROM and RAM</text><text x="24" y="50" font-size="11.5" fill="#444444">Selected X-series addresses; your model's e-Manual page has the full table with sizes and units</text><g><rect x="24" y="76" width="330" height="42" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.5"></rect><text x="36" y="94" font-weight="600" fill="#111111">EEPROM: addresses 0 to 63</text><text x="36" y="110" font-size="11" fill="#444444">kept at power-off; write only with torque off</text><g><rect x="24" y="124" width="330" height="24" fill="#ffffff" stroke="#111111" stroke-width="0.8"></rect><text x="36" y="140" font-size="12" font-weight="600" fill="#111111">7</text><text x="114" y="140" font-size="12" fill="#111111">ID</text></g><g><rect x="24" y="150" width="330" height="24" fill="#ffffff" stroke="#111111" stroke-width="0.8"></rect><text x="36" y="166" font-size="12" font-weight="600" fill="#111111">8</text><text x="114" y="166" font-size="12" fill="#111111">Baud Rate</text></g><g><rect x="24" y="176" width="330" height="24" fill="#ffffff" stroke="#111111" stroke-width="0.8"></rect><text x="36" y="192" font-size="12" font-weight="600" fill="#111111">9</text><text x="114" y="192" font-size="12" fill="#111111">Return Delay Time</text></g><g><rect x="24" y="202" width="330" height="24" fill="#ffffff" stroke="#111111" stroke-width="0.8"></rect><text x="36" y="218" font-size="12" font-weight="600" fill="#111111">10</text><text x="114" y="218" font-size="12" fill="#111111">Drive Mode</text></g><g><rect x="24" y="228" width="330" height="24" fill="#ffffff" stroke="#111111" stroke-width="0.8"></rect><text x="36" y="244" font-size="12" font-weight="600" fill="#111111">11</text><text x="114" y="244" font-size="12" fill="#111111">Operating Mode</text></g><g><rect x="24" y="254" width="330" height="24" fill="#ffffff" stroke="#111111" stroke-width="0.8"></rect><text x="36" y="270" font-size="12" font-weight="600" fill="#111111">20</text><text x="114" y="270" font-size="12" fill="#111111">Homing Offset</text></g><g><rect x="24" y="280" width="330" height="24" fill="#ffffff" stroke="#111111" stroke-width="0.8"></rect><text x="36" y="296" font-size="12" font-weight="600" fill="#111111">36</text><text x="114" y="296" font-size="12" fill="#111111">PWM Limit</text></g><g><rect x="24" y="306" width="330" height="24" fill="#ffffff" stroke="#111111" stroke-width="0.8"></rect><text x="36" y="322" font-size="12" font-weight="600" fill="#111111">48 / 52</text><text x="114" y="322" font-size="12" fill="#111111">Max / Min Position Limit</text></g><g><rect x="24" y="332" width="330" height="24" fill="#ffffff" stroke="#111111" stroke-width="0.8"></rect><text x="36" y="348" font-size="12" font-weight="600" fill="#111111">63</text><text x="114" y="348" font-size="12" fill="#111111">Shutdown</text></g></g><g><rect x="406" y="76" width="330" height="42" rx="6" fill="#ececec" stroke="#111111" stroke-width="1.5"></rect><text x="418" y="94" font-weight="600" fill="#111111">RAM: addresses 64 and up</text><text x="418" y="110" font-size="11" fill="#444444">reset at power-up; the live state</text><g><rect x="406" y="124" width="330" height="24" fill="#ececec" stroke="#111111" stroke-width="0.8"></rect><text x="418" y="140" font-size="12" font-weight="600" fill="#111111">64</text><text x="496" y="140" font-size="12" fill="#111111">Torque Enable</text></g><g><rect x="406" y="150" width="330" height="24" fill="#ececec" stroke="#111111" stroke-width="0.8"></rect><text x="418" y="166" font-size="12" font-weight="600" fill="#111111">65</text><text x="496" y="166" font-size="12" fill="#111111">LED</text></g><g><rect x="406" y="176" width="330" height="24" fill="#ececec" stroke="#111111" stroke-width="0.8"></rect><text x="418" y="192" font-size="12" font-weight="600" fill="#111111">70</text><text x="496" y="192" font-size="12" fill="#111111">Hardware Error Status</text></g><g><rect x="406" y="202" width="330" height="24" fill="#ececec" stroke="#111111" stroke-width="0.8"></rect><text x="418" y="218" font-size="12" font-weight="600" fill="#111111">108 / 112</text><text x="496" y="218" font-size="12" fill="#111111">Profile Accel. / Velocity</text></g><g><rect x="406" y="228" width="330" height="24" fill="#ececec" stroke="#111111" stroke-width="0.8"></rect><text x="418" y="244" font-size="12" font-weight="600" fill="#111111">116</text><text x="496" y="244" font-size="12" fill="#111111">Goal Position</text></g><g><rect x="406" y="254" width="330" height="24" fill="#ececec" stroke="#111111" stroke-width="0.8"></rect><text x="418" y="270" font-size="12" font-weight="600" fill="#111111">122</text><text x="496" y="270" font-size="12" fill="#111111">Moving</text></g><g><rect x="406" y="280" width="330" height="24" fill="#ececec" stroke="#111111" stroke-width="0.8"></rect><text x="418" y="296" font-size="12" font-weight="600" fill="#111111">132</text><text x="496" y="296" font-size="12" fill="#111111">Present Position</text></g><g><rect x="406" y="306" width="330" height="24" fill="#ececec" stroke="#111111" stroke-width="0.8"></rect><text x="418" y="322" font-size="12" font-weight="600" fill="#111111">144</text><text x="496" y="322" font-size="12" fill="#111111">Present Input Voltage</text></g><g><rect x="406" y="332" width="330" height="24" fill="#ececec" stroke="#111111" stroke-width="0.8"></rect><text x="418" y="348" font-size="12" font-weight="600" fill="#111111">146</text><text x="496" y="348" font-size="12" fill="#111111">Present Temperature</text></g></g><text x="24" y="400" font-size="11.5" fill="#111111">Torque Enable = 1 locks the EEPROM area: an EEPROM write then fails with an Access Error.</text></svg>
