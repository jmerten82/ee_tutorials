<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 400" role="img" aria-label="The rig: Mac, hub, U2D2, power hub and a chain of servos" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><text x="24" y="30" font-size="15" font-weight="600" fill="#111111">The rig: a Mac, a U2D2 and a chain of servos</text><text x="24" y="50" font-size="11.5" fill="#444444">Data comes from the Mac; power comes from the supply. They meet on the bus at the power hub</text><g><rect x="24" y="80" width="120" height="64" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.5"></rect><text x="84" y="102" text-anchor="middle" font-weight="600" fill="#111111">Mac</text><text x="84" y="119" text-anchor="middle" font-size="11" fill="#444444">Wizard 2.0</text><text x="84" y="133" text-anchor="middle" font-size="11" fill="#444444">Python scripts</text></g><g><rect x="184" y="80" width="120" height="64" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.5"></rect><text x="244" y="102" text-anchor="middle" font-weight="600" fill="#111111">USB hub</text><text x="244" y="119" text-anchor="middle" font-size="11" fill="#444444">CH334F (REASON)</text></g><g><rect x="344" y="80" width="120" height="64" rx="6" fill="#ececec" stroke="#111111" stroke-width="1.5"></rect><text x="404" y="102" text-anchor="middle" font-weight="600" fill="#111111">U2D2</text><text x="404" y="119" text-anchor="middle" font-size="11" fill="#444444">USB to TTL bus</text><text x="404" y="133" text-anchor="middle" font-size="11" fill="#444444">data only</text></g><g><rect x="344" y="168" width="120" height="54" rx="6" fill="#ececec" stroke="#111111" stroke-width="1.5"></rect><text x="404" y="190" text-anchor="middle" font-weight="600" fill="#111111">Power hub</text><text x="404" y="207" text-anchor="middle" font-size="11" fill="#444444">one input only</text></g><g><rect x="560" y="168" width="160" height="54" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.5"></rect><text x="640" y="190" text-anchor="middle" font-weight="600" fill="#111111">Supply</text><text x="640" y="207" text-anchor="middle" font-size="11" fill="#444444">12 V (5 V for XL330)</text></g><g fill="none" stroke="#111111" stroke-width="1.5"><path d="M144 112H184"></path><path d="M304 112H344"></path><path d="M404 144V168"></path><path d="M560 195H464" stroke-dasharray="6 3"></path></g><text x="512" y="188" text-anchor="middle" font-size="11" fill="#111111">power</text><text x="164" y="104" text-anchor="middle" font-size="11" fill="#444444">USB</text><text x="324" y="104" text-anchor="middle" font-size="11" fill="#444444">USB</text><path d="M404 222V240H130V290H136" fill="none" stroke="#111111" stroke-width="2.5"></path><g><rect x="140" y="250" width="92" height="70" rx="8" fill="#ececec" stroke="#111111" stroke-width="1.5"></rect><circle cx="186" cy="272" r="12" fill="#ffffff" stroke="#111111" stroke-width="1.5"></circle><text x="186" y="306" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111111">ID 1</text><rect x="134" y="290" width="10" height="14" fill="#111111"></rect><rect x="228" y="290" width="10" height="14" fill="#111111"></rect></g><g><rect x="290" y="250" width="92" height="70" rx="8" fill="#ececec" stroke="#111111" stroke-width="1.5"></rect><circle cx="336" cy="272" r="12" fill="#ffffff" stroke="#111111" stroke-width="1.5"></circle><text x="336" y="306" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111111">ID 2</text><rect x="284" y="290" width="10" height="14" fill="#111111"></rect><rect x="378" y="290" width="10" height="14" fill="#111111"></rect></g><g><rect x="440" y="250" width="92" height="70" rx="8" fill="#ececec" stroke="#111111" stroke-width="1.5"></rect><circle cx="486" cy="272" r="12" fill="#ffffff" stroke="#111111" stroke-width="1.5"></circle><text x="486" y="306" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111111">ID 3</text><rect x="434" y="290" width="10" height="14" fill="#111111"></rect><rect x="528" y="290" width="10" height="14" fill="#111111"></rect></g><path d="M238 297H284" stroke="#111111" stroke-width="2.5"></path><path d="M388 297H434" stroke="#111111" stroke-width="2.5"></path><text x="261" y="340" text-anchor="middle" font-size="11" fill="#111111">X3P cable</text><text x="411" y="340" text-anchor="middle" font-size="11" fill="#111111">X3P cable</text><text x="600" y="270" font-size="11.5" font-weight="600" fill="#111111">Every cable carries</text><text x="600" y="288" font-size="11.5" fill="#111111">GND, supply and DATA</text><text x="600" y="306" font-size="11.5" fill="#111111">(daisy chain)</text><text x="24" y="380" font-size="11.5" fill="#111111">Each servo has a unique ID and listens at the bus baud rate. Never plug or unplug while the bus is powered.</text></svg>
