<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 400" role="img" aria-label="Anatomy of a Protocol 2.0 packet" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><text x="24" y="30" font-size="15" font-weight="600" fill="#111111">Anatomy of a Protocol 2.0 packet</text><text x="24" y="50" font-size="11.5" fill="#444444">Hexadecimal bytes in the order they are sent. Multi-byte numbers are little-endian (low byte first)</text><g><text x="24" y="96" font-weight="600" fill="#111111">Ping to ID 1</text><g><rect x="30" y="108" width="50" height="30" rx="3" fill="#ececec" stroke="#111111" stroke-width="1.2"></rect><text x="55" y="128" text-anchor="middle" font-weight="600" fill="#111111">FF</text></g><g><rect x="84" y="108" width="50" height="30" rx="3" fill="#ececec" stroke="#111111" stroke-width="1.2"></rect><text x="109" y="128" text-anchor="middle" font-weight="600" fill="#111111">FF</text></g><g><rect x="138" y="108" width="50" height="30" rx="3" fill="#ececec" stroke="#111111" stroke-width="1.2"></rect><text x="163" y="128" text-anchor="middle" font-weight="600" fill="#111111">FD</text></g><g><rect x="192" y="108" width="50" height="30" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.2"></rect><text x="217" y="128" text-anchor="middle" font-weight="600" fill="#111111">00</text></g><g><rect x="246" y="108" width="50" height="30" rx="3" fill="#ececec" stroke="#111111" stroke-width="1.2"></rect><text x="271" y="128" text-anchor="middle" font-weight="600" fill="#111111">01</text></g><g><rect x="300" y="108" width="50" height="30" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.2"></rect><text x="325" y="128" text-anchor="middle" font-weight="600" fill="#111111">03</text></g><g><rect x="354" y="108" width="50" height="30" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.2"></rect><text x="379" y="128" text-anchor="middle" font-weight="600" fill="#111111">00</text></g><g><rect x="408" y="108" width="50" height="30" rx="3" fill="#ececec" stroke="#111111" stroke-width="1.2"></rect><text x="433" y="128" text-anchor="middle" font-weight="600" fill="#111111">01</text></g><g><rect x="462" y="108" width="50" height="30" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.2"></rect><text x="487" y="128" text-anchor="middle" font-weight="600" fill="#111111">19</text></g><g><rect x="516" y="108" width="50" height="30" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.2"></rect><text x="541" y="128" text-anchor="middle" font-weight="600" fill="#111111">4E</text></g><g><path d="M30 144V150H188V144" fill="none" stroke="#111111" stroke-width="1"></path><text x="109" y="166" text-anchor="middle" font-size="11" fill="#111111">header</text></g><g><path d="M192 144V150H242V144" fill="none" stroke="#111111" stroke-width="1"></path><text x="217" y="180" text-anchor="middle" font-size="11" fill="#111111">reserved</text></g><g><path d="M246 144V150H296V144" fill="none" stroke="#111111" stroke-width="1"></path><text x="271" y="166" text-anchor="middle" font-size="11" fill="#111111">ID 1</text></g><g><path d="M300 144V150H404V144" fill="none" stroke="#111111" stroke-width="1"></path><text x="352" y="180" text-anchor="middle" font-size="11" fill="#111111">length 3</text></g><g><path d="M408 144V150H458V144" fill="none" stroke="#111111" stroke-width="1"></path><text x="433" y="166" text-anchor="middle" font-size="11" fill="#111111">Ping</text></g><g><path d="M462 144V150H566V144" fill="none" stroke="#111111" stroke-width="1"></path><text x="514" y="180" text-anchor="middle" font-size="11" fill="#111111">CRC 0x4E19</text></g></g><g><text x="24" y="236" font-weight="600" fill="#111111">Read Present Position (address 132, 4 bytes) from ID 1</text><g><rect x="30" y="248" width="46" height="30" rx="3" fill="#ececec" stroke="#111111" stroke-width="1.2"></rect><text x="53" y="268" text-anchor="middle" font-weight="600" fill="#111111">FF</text></g><g><rect x="80" y="248" width="46" height="30" rx="3" fill="#ececec" stroke="#111111" stroke-width="1.2"></rect><text x="103" y="268" text-anchor="middle" font-weight="600" fill="#111111">FF</text></g><g><rect x="130" y="248" width="46" height="30" rx="3" fill="#ececec" stroke="#111111" stroke-width="1.2"></rect><text x="153" y="268" text-anchor="middle" font-weight="600" fill="#111111">FD</text></g><g><rect x="180" y="248" width="46" height="30" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.2"></rect><text x="203" y="268" text-anchor="middle" font-weight="600" fill="#111111">00</text></g><g><rect x="230" y="248" width="46" height="30" rx="3" fill="#ececec" stroke="#111111" stroke-width="1.2"></rect><text x="253" y="268" text-anchor="middle" font-weight="600" fill="#111111">01</text></g><g><rect x="280" y="248" width="46" height="30" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.2"></rect><text x="303" y="268" text-anchor="middle" font-weight="600" fill="#111111">07</text></g><g><rect x="330" y="248" width="46" height="30" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.2"></rect><text x="353" y="268" text-anchor="middle" font-weight="600" fill="#111111">00</text></g><g><rect x="380" y="248" width="46" height="30" rx="3" fill="#ececec" stroke="#111111" stroke-width="1.2"></rect><text x="403" y="268" text-anchor="middle" font-weight="600" fill="#111111">02</text></g><g><rect x="430" y="248" width="46" height="30" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.2"></rect><text x="453" y="268" text-anchor="middle" font-weight="600" fill="#111111">84</text></g><g><rect x="480" y="248" width="46" height="30" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.2"></rect><text x="503" y="268" text-anchor="middle" font-weight="600" fill="#111111">00</text></g><g><rect x="530" y="248" width="46" height="30" rx="3" fill="#ececec" stroke="#111111" stroke-width="1.2"></rect><text x="553" y="268" text-anchor="middle" font-weight="600" fill="#111111">04</text></g><g><rect x="580" y="248" width="46" height="30" rx="3" fill="#ececec" stroke="#111111" stroke-width="1.2"></rect><text x="603" y="268" text-anchor="middle" font-weight="600" fill="#111111">00</text></g><g><rect x="630" y="248" width="46" height="30" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.2"></rect><text x="653" y="268" text-anchor="middle" font-weight="600" fill="#111111">1D</text></g><g><rect x="680" y="248" width="46" height="30" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.2"></rect><text x="703" y="268" text-anchor="middle" font-weight="600" fill="#111111">15</text></g><g><path d="M30 284V290H176V284" fill="none" stroke="#111111" stroke-width="1"></path><text x="103" y="306" text-anchor="middle" font-size="11" fill="#111111">header</text></g><g><path d="M180 284V290H226V284" fill="none" stroke="#111111" stroke-width="1"></path><text x="203" y="320" text-anchor="middle" font-size="11" fill="#111111">reserved</text></g><g><path d="M230 284V290H276V284" fill="none" stroke="#111111" stroke-width="1"></path><text x="253" y="306" text-anchor="middle" font-size="11" fill="#111111">ID 1</text></g><g><path d="M280 284V290H376V284" fill="none" stroke="#111111" stroke-width="1"></path><text x="328" y="320" text-anchor="middle" font-size="11" fill="#111111">length 7</text></g><g><path d="M380 284V290H426V284" fill="none" stroke="#111111" stroke-width="1"></path><text x="403" y="306" text-anchor="middle" font-size="11" fill="#111111">Read</text></g><g><path d="M430 284V290H526V284" fill="none" stroke="#111111" stroke-width="1"></path><text x="478" y="320" text-anchor="middle" font-size="11" fill="#111111">address 132</text></g><g><path d="M530 284V290H626V284" fill="none" stroke="#111111" stroke-width="1"></path><text x="578" y="306" text-anchor="middle" font-size="11" fill="#111111">size 4</text></g><g><path d="M630 284V290H726V284" fill="none" stroke="#111111" stroke-width="1"></path><text x="678" y="320" text-anchor="middle" font-size="11" fill="#111111">CRC 0x151D</text></g></g><text x="24" y="362" font-size="11.5" fill="#111111">Length = instruction + parameters + 2 CRC bytes. CRC-16 (polynomial 0x8005) over every byte before it.</text><text x="24" y="382" font-size="11.5" fill="#111111">The answer is a status packet: same frame, instruction 55, then an error byte, then the data.</text></svg>
