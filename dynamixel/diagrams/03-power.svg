<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 360" role="img" aria-label="Where the current flows in a chain" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><defs><marker id="dx-pw-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111111"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#111111">Where the current flows in a chain</text><text x="24" y="50" font-size="11.5" fill="#444444">Example: three XL430-W250-T at 12 V, stall current 1.4 A each (e-Manual)</text><rect x="24" y="140" width="120" height="80" rx="6" fill="#ffffff" stroke="#111111" stroke-width="1.5"></rect><text x="84" y="172" text-anchor="middle" font-weight="600" fill="#111111">Supply +</text><text x="84" y="190" text-anchor="middle" font-weight="600" fill="#111111">power hub</text><path d="M144 180H200" stroke="#111111" stroke-width="5"></path><g><rect x="200" y="150" width="100" height="60" rx="8" fill="#ececec" stroke="#111111" stroke-width="1.5"></rect><text x="250" y="176" text-anchor="middle" font-weight="600" fill="#111111">ID 1</text><text x="250" y="194" text-anchor="middle" font-size="11" fill="#444444">up to 1.4 A</text></g><path d="M300 180H360" stroke="#111111" stroke-width="3.5"></path><g><rect x="360" y="150" width="100" height="60" rx="8" fill="#ececec" stroke="#111111" stroke-width="1.5"></rect><text x="410" y="176" text-anchor="middle" font-weight="600" fill="#111111">ID 2</text><text x="410" y="194" text-anchor="middle" font-size="11" fill="#444444">up to 1.4 A</text></g><path d="M460 180H520" stroke="#111111" stroke-width="2"></path><g><rect x="520" y="150" width="100" height="60" rx="8" fill="#ececec" stroke="#111111" stroke-width="1.5"></rect><text x="570" y="176" text-anchor="middle" font-weight="600" fill="#111111">ID 3</text><text x="570" y="194" text-anchor="middle" font-size="11" fill="#444444">up to 1.4 A</text></g><text x="172" y="130" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111111">4.2 A</text><text x="330" y="130" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111111">2.8 A</text><text x="490" y="130" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111111">1.4 A</text><path d="M172 136V170" stroke="#111111" stroke-width="1" marker-end="url(#dx-pw-arrow)"></path><path d="M330 136V170" stroke="#111111" stroke-width="1" marker-end="url(#dx-pw-arrow)"></path><path d="M490 136V170" stroke="#111111" stroke-width="1" marker-end="url(#dx-pw-arrow)"></path><text x="24" y="260" font-size="11.5" fill="#111111">Worst case, all servos stalled: the first cable carries every servo's current, and each connector drops a little voltage.</text><text x="24" y="280" font-size="11.5" fill="#111111">Supply rating at least the sum of the stall currents, with margin. Check Present Input Voltage on the last servo.</text><rect x="24" y="300" width="712" height="40" rx="6" fill="#ececec"></rect><text x="380" y="325" text-anchor="middle" font-size="11.5" fill="#111111">Budget: 3 × 1.4 A = 4.2 A, so a 5 A to 6 A supply, a hub and fuse rated above it, short chains.</text></svg>
