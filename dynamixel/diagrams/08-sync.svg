<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 340" role="img" aria-label="Separate reads and a sync read" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><text x="24" y="30" font-size="15" font-weight="600" fill="#111111">Three separate reads, or one sync read</text><text x="24" y="50" font-size="11.5" fill="#444444">Grey bars: return delay and USB serial latency, paid once per round trip. Not to scale</text><text x="40" y="98" font-weight="600" fill="#111111">One by one: three round trips</text><g><rect x="40" y="110" width="54" height="26" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.2"></rect><text x="67" y="127" text-anchor="middle" font-size="11" fill="#111111">Read 1</text></g><g><rect x="94" y="118" width="46" height="10" fill="#bbbbbb" opacity="0.5"></rect></g><g><rect x="140" y="110" width="62" height="26" rx="3" fill="#ececec" stroke="#111111" stroke-width="1.2"></rect><text x="171" y="127" text-anchor="middle" font-size="11" fill="#111111">Status 1</text></g><g><rect x="208" y="110" width="54" height="26" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.2"></rect><text x="235" y="127" text-anchor="middle" font-size="11" fill="#111111">Read 2</text></g><g><rect x="262" y="118" width="46" height="10" fill="#bbbbbb" opacity="0.5"></rect></g><g><rect x="308" y="110" width="62" height="26" rx="3" fill="#ececec" stroke="#111111" stroke-width="1.2"></rect><text x="339" y="127" text-anchor="middle" font-size="11" fill="#111111">Status 2</text></g><g><rect x="376" y="110" width="54" height="26" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.2"></rect><text x="403" y="127" text-anchor="middle" font-size="11" fill="#111111">Read 3</text></g><g><rect x="430" y="118" width="46" height="10" fill="#bbbbbb" opacity="0.5"></rect></g><g><rect x="476" y="110" width="62" height="26" rx="3" fill="#ececec" stroke="#111111" stroke-width="1.2"></rect><text x="507" y="127" text-anchor="middle" font-size="11" fill="#111111">Status 3</text></g><text x="554" y="127" font-size="11.5" fill="#111111">done</text><text x="40" y="208" font-weight="600" fill="#111111">Sync Read (instruction 82): one round trip, the servos answer in turn</text><g><rect x="40" y="220" width="70" height="26" rx="3" fill="#ffffff" stroke="#111111" stroke-width="1.2"></rect><text x="75" y="237" text-anchor="middle" font-size="11" fill="#111111">Sync Read</text></g><g><rect x="110" y="228" width="46" height="10" fill="#bbbbbb" opacity="0.5"></rect></g><g><rect x="156" y="220" width="62" height="26" rx="3" fill="#ececec" stroke="#111111" stroke-width="1.2"></rect><text x="187" y="237" text-anchor="middle" font-size="11" fill="#111111">Status 1</text></g><g><rect x="220" y="220" width="62" height="26" rx="3" fill="#ececec" stroke="#111111" stroke-width="1.2"></rect><text x="251" y="237" text-anchor="middle" font-size="11" fill="#111111">Status 2</text></g><g><rect x="284" y="220" width="62" height="26" rx="3" fill="#ececec" stroke="#111111" stroke-width="1.2"></rect><text x="315" y="237" text-anchor="middle" font-size="11" fill="#111111">Status 3</text></g><text x="356" y="237" font-size="11.5" fill="#111111">done</text><text x="24" y="292" font-size="11.5" fill="#111111">Sync Write (instruction 83) is one packet with a goal for every servo, and no answers at all.</text><text x="24" y="312" font-size="11.5" fill="#111111">Both work on the same address block in every servo, for example Present Position, 4 bytes from 132.</text></svg>
