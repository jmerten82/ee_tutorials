<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 420" role="img" aria-label="LED and pushbutton schematics with the resistor calculation" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><defs><marker id="led-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111111"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#111111">An output and an input: LED on GPIO25, button on GPIO33</text><text x="24" y="50" font-size="11.5" fill="#444444">Schematics for Lesson 1. The LED needs a resistor; the button uses the pull-up inside the chip.</text><line x1="380" x2="380" y1="70" y2="404" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="4 4"></line><g><path d="M56 79H112L122 90L112 101H56Z" fill="#ffffff" stroke="#111111" stroke-width="1.5"></path><text x="86" y="94.5" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111111">GPIO25</text></g><path d="M122 90H140V128" fill="none" stroke="#111111" stroke-width="1.5"></path><rect x="132" y="128" width="16" height="40" fill="none" stroke="#111111" stroke-width="1.5"></rect><text x="122" y="144" text-anchor="end" font-weight="600" fill="#111111">R1</text><text x="122" y="160" text-anchor="end" font-size="11.5" fill="#444444">330 Ω</text><path d="M140 168V200" fill="none" stroke="#111111" stroke-width="1.5"></path><polygon points="126,200 154,200 140,226" fill="none" stroke="#111111" stroke-width="1.5"></polygon><line x1="126" x2="154" y1="226" y2="226" stroke="#111111" stroke-width="2"></line><path d="M158 206l14 -10" fill="none" stroke="#111111" stroke-width="1.25" marker-end="url(#led-arrow)"></path><path d="M158 218l14 -10" fill="none" stroke="#111111" stroke-width="1.25" marker-end="url(#led-arrow)"></path><text x="118" y="206" text-anchor="end" font-weight="600" fill="#111111">LED1</text><text x="118" y="222" text-anchor="end" font-size="11.5" fill="#444444">red</text><text x="160" y="242" font-size="11.5" fill="#444444">flat side, short leg</text><path d="M140 226V262" fill="none" stroke="#111111" stroke-width="1.5"></path><g><line x1="140" x2="140" y1="262" y2="274" stroke="#111111" stroke-width="1.5"></line><line x1="128" x2="152" y1="274" y2="274" stroke="#111111" stroke-width="2"></line><line x1="132" x2="148" y1="279" y2="279" stroke="#111111" stroke-width="2"></line><line x1="136" x2="144" y1="284" y2="284" stroke="#111111" stroke-width="2"></line></g><text x="162" y="279" font-size="11.5" fill="#111111">GND</text><text x="200" y="96" font-weight="600" fill="#111111">Choose R1</text><text x="200" y="118" font-size="11.5" fill="#111111">R = (V_pin − V_f) / I</text><text x="200" y="138" font-size="11.5" fill="#111111">I = (3.3 − 2.0) V / 330 Ω</text><text x="200" y="158" font-size="11.5" fill="#111111"> ≈ 3.9 mA</text><text x="200" y="182" font-size="11.5" fill="#444444">R1 power: 1.3 V × 3.9 mA</text><text x="200" y="198" font-size="11.5" fill="#444444"> ≈ 5 mW, any resistor</text><rect x="24" y="306" width="340" height="96" rx="4" fill="#ececec" stroke="#444444" stroke-width="1"></rect><text x="36" y="328" font-weight="600" fill="#111111">Quick picks at 3.3 V</text><text x="36" y="348" font-size="11.5" fill="#111111">red, yellow, orange (V_f ≈ 2.0 V): 330 Ω → 4 mA</text><text x="36" y="366" font-size="11.5" fill="#111111">green, blue, white (V_f ≈ 2.9 V): 100 Ω → 4 mA</text><text x="36" y="386" font-size="11.5" fill="#444444">Never 0 Ω: the LED then takes all the pin can give.</text><rect x="400" y="74" width="176" height="206" rx="6" fill="none" stroke="#444444" stroke-width="1.25" stroke-dasharray="6 4"></rect><text x="410" y="94" font-size="11.5" fill="#444444">inside the ESP32</text><text x="488" y="118" text-anchor="middle" font-weight="600" fill="#111111">3.3 V</text><line x1="474" x2="502" y1="124" y2="124" stroke="#111111" stroke-width="2"></line><path d="M488 124V140" fill="none" stroke="#111111" stroke-width="1.5"></path><rect x="480" y="140" width="16" height="40" fill="none" stroke="#111111" stroke-width="1.5"></rect><text x="470" y="156" text-anchor="end" font-size="11.5" fill="#111111">pull-up</text><text x="470" y="172" text-anchor="end" font-size="11.5" fill="#444444">≈ 45 kΩ</text><path d="M488 180V220H660V246" fill="none" stroke="#111111" stroke-width="1.5"></path><circle cx="488" cy="220" r="3.5" fill="#111111"></circle><path d="M488 220V250" fill="none" stroke="#111111" stroke-width="1.5"></path><polygon points="478,250 498,250 488,264" fill="none" stroke="#111111" stroke-width="1.25"></polygon><text x="506" y="262" font-size="11.5" fill="#444444">input</text><circle cx="576" cy="220" r="5" fill="#ffffff" stroke="#111111" stroke-width="1.5"></circle><text x="590" y="210" font-weight="600" fill="#111111">GPIO33</text><circle cx="660" cy="250" r="4" fill="#ffffff" stroke="#111111" stroke-width="1.5"></circle><circle cx="660" cy="290" r="4" fill="#ffffff" stroke="#111111" stroke-width="1.5"></circle><line x1="646" x2="646" y1="242" y2="298" stroke="#111111" stroke-width="2"></line><path d="M646 270H628M628 262V278" fill="none" stroke="#111111" stroke-width="1.5"></path><text x="676" y="266" font-weight="600" fill="#111111">S1</text><text x="676" y="282" font-size="11.5" fill="#444444">button</text><path d="M660 294V318" fill="none" stroke="#111111" stroke-width="1.5"></path><g><line x1="660" x2="660" y1="318" y2="330" stroke="#111111" stroke-width="1.5"></line><line x1="648" x2="672" y1="330" y2="330" stroke="#111111" stroke-width="2"></line><line x1="652" x2="668" y1="335" y2="335" stroke="#111111" stroke-width="2"></line><line x1="656" x2="664" y1="340" y2="340" stroke="#111111" stroke-width="2"></line></g><text x="400" y="318" font-size="11.5" fill="#111111">pinMode(33, INPUT_PULLUP);</text><text x="400" y="350" font-size="11.5" fill="#111111">released → pin reads HIGH (1)</text><text x="400" y="368" font-size="11.5" fill="#111111">pressed → pin reads LOW (0)</text><text x="400" y="392" font-size="11.5" fill="#444444">The logic is inverted: LOW means pressed.</text></svg>
