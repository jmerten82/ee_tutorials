<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 474" role="img" aria-label="Power paths and current budget of the DevKitC" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><defs><marker id="pwr-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111111"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#111111">Power: three ways in, use exactly one</text><text x="24" y="50" font-size="11.5" fill="#444444">Two rails, one regulator. Plan with the numbers on the right, not with what the chip survives.</text><g><rect x="24" y="76" width="160" height="62" rx="4" fill="#ececec" stroke="#111111" stroke-width="1.5"></rect><text x="34" y="96" font-weight="600" fill="#111111">USB from the Mac</text><text x="34" y="114" font-size="11.5" fill="#444444">5 V, plan for 500 mA</text></g><g><rect x="24" y="152" width="160" height="62" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.5"></rect><text x="34" y="172" font-weight="600" fill="#111111">5V pin</text><text x="34" y="190" font-size="11.5" fill="#444444">external 4.8–5.5 V only</text></g><g><rect x="24" y="300" width="160" height="62" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.5"></rect><text x="34" y="320" font-weight="600" fill="#111111">3V3 pin as input</text><text x="34" y="338" font-size="11.5" fill="#444444">regulated 3.3 V only</text></g><path d="M184 107H500" fill="none" stroke="#111111" stroke-width="3"></path><path d="M184 183H230V107" fill="none" stroke="#111111" stroke-width="1.5"></path><circle cx="230" cy="107" r="3.5" fill="#111111"></circle><text x="300" y="98" font-weight="600" fill="#111111">5 V rail</text><path d="M300 107V146" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#pwr-arrow)"></path><circle cx="300" cy="107" r="3.5" fill="#111111"></circle><rect x="252" y="148" width="96" height="66" rx="4" fill="#ececec" stroke="#111111" stroke-width="1.5"></rect><text x="300" y="172" text-anchor="middle" font-weight="600" fill="#111111">LDO</text><text x="300" y="190" text-anchor="middle" font-size="11.5" fill="#111111">5 V → 3.3 V</text><text x="300" y="206" text-anchor="middle" font-size="11.5" fill="#444444">1117 type</text><path d="M300 214V262" fill="none" stroke="#111111" stroke-width="1.5"></path><path d="M184 331H230V262H500" fill="none" stroke="#111111" stroke-width="1.5"></path><path d="M230 262H500" fill="none" stroke="#111111" stroke-width="3"></path><circle cx="300" cy="262" r="3.5" fill="#111111"></circle><circle cx="230" cy="262" r="3.5" fill="#111111"></circle><text x="316" y="254" font-weight="600" fill="#111111">3.3 V rail</text><text x="360" y="180" font-size="11.5" fill="#444444">heat = (5 − 3.3) V × I</text><text x="360" y="196" font-size="11.5" fill="#444444">0.85 W at 500 mA: hot</text><path d="M500 107H518" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#pwr-arrow)"></path><g><rect x="520" y="76" width="216" height="62" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.5"></rect><text x="530" y="96" font-weight="600" fill="#111111">5 V loads (5V pin)</text><text x="530" y="114" font-size="11.5" fill="#444444">one micro servo: 100–700 mA</text><text x="530" y="130" font-size="11.5" fill="#444444">bigger loads: own supply</text></g><path d="M500 262H518" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#pwr-arrow)"></path><g><rect x="520" y="160" width="216" height="146" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.5"></rect><text x="530" y="180" font-weight="600" fill="#111111">3.3 V loads (3V3 pin)</text><text x="530" y="198" font-size="11.5" fill="#444444">ESP32 with Wi-Fi: 80–130 mA avg</text><text x="530" y="214" font-size="11.5" fill="#444444">Wi-Fi transmit peaks: ≈ 240 mA</text><text x="530" y="230" font-size="11.5" fill="#444444">BME280 + OLED: ≈ 20 mA</text><text x="530" y="246" font-size="11.5" fill="#444444">your 3V3 extras: ≤ 200 mA</text><text x="530" y="262" font-size="11.5" fill="#444444">each GPIO: plan ≤ 12 mA</text><text x="530" y="278" font-size="11.5" fill="#444444">(absolute limit 40 mA)</text></g><rect x="24" y="394" width="712" height="62" rx="4" fill="#ffffff" stroke="#111111" stroke-width="2.5"></rect><circle cx="48" cy="425" r="12" fill="#111111"></circle><text x="48" y="430" text-anchor="middle" font-weight="600" fill="#ffffff">!</text><text x="70" y="418" font-weight="600" fill="#111111">Never connect two sources at once, and never feed 5 V into a GPIO.</text><text x="70" y="438" font-size="11.5" fill="#111111">The 5V pin is the USB supply: an external 5 V plus USB fights the Mac. The pins are 3.3 V logic and not 5 V tolerant.</text><text x="24" y="382" font-size="11.5" fill="#444444">All GND pins are the same net. Every external supply shares GND with the board.</text></svg>
