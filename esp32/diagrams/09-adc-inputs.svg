<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 500" role="img" aria-label="Potentiometer, voltage divider and the ADC transfer curve" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><text x="24" y="30" font-size="15" font-weight="600" fill="#111111">Analog inputs: a knob, a 12 V divider, and what the ADC really does</text><text x="24" y="50" font-size="11.5" fill="#444444">Both inputs are ADC1 pins (input only), so they keep working when Wi-Fi is on</text><text x="24" y="80" font-weight="600" fill="#111111">A. Potentiometer</text><text x="60" y="106" text-anchor="middle" font-weight="600" fill="#111111">3V3</text><line x1="46" x2="74" y1="112" y2="112" stroke="#111111" stroke-width="2"></line><path d="M60 112V140" fill="none" stroke="#111111" stroke-width="1.5"></path><rect x="52" y="140" width="16" height="96" fill="#ffffff" stroke="#111111" stroke-width="1.5"></rect><path d="M60 236V262" fill="none" stroke="#111111" stroke-width="1.5"></path><g><line x1="60" x2="60" y1="262" y2="274" stroke="#111111" stroke-width="1.5"></line><line x1="48" x2="72" y1="274" y2="274" stroke="#111111" stroke-width="2"></line><line x1="52" x2="68" y1="279" y2="279" stroke="#111111" stroke-width="2"></line><line x1="56" x2="64" y1="284" y2="284" stroke="#111111" stroke-width="2"></line></g><path d="M98 188H72" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#adc-arrow)"></path><path d="M98 188H128" fill="none" stroke="#111111" stroke-width="1.5"></path><g><path d="M128 188L138 177H194V199H138Z" fill="#ffffff" stroke="#111111" stroke-width="1.5"></path><text x="166" y="192.5" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111111">GPIO34</text></g><text x="40" y="170" text-anchor="end" font-size="11.5" fill="#111111">10</text><text x="40" y="186" text-anchor="end" font-size="11.5" fill="#111111">kΩ</text><text x="96" y="176" font-size="11.5" fill="#444444">wiper</text><text x="24" y="306" font-size="11.5" fill="#444444">Turning the knob moves the</text><text x="24" y="322" font-size="11.5" fill="#444444">wiper from 0 V to 3.3 V.</text><line x1="224" x2="224" y1="66" y2="326" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="4 4"></line><text x="240" y="80" font-weight="600" fill="#111111">B. Measuring up to 17 V with a divider</text><text x="290" y="106" text-anchor="middle" font-weight="600" fill="#111111">V_in (12 V)</text><circle cx="290" cy="116" r="4" fill="#ffffff" stroke="#111111" stroke-width="1.5"></circle><path d="M290 120V132" fill="none" stroke="#111111" stroke-width="1.5"></path><rect x="282" y="132" width="16" height="40" fill="#ffffff" stroke="#111111" stroke-width="1.5"></rect><path d="M290 172V196" fill="none" stroke="#111111" stroke-width="1.5"></path><rect x="282" y="196" width="16" height="40" fill="#ffffff" stroke="#111111" stroke-width="1.5"></rect><path d="M290 236V262" fill="none" stroke="#111111" stroke-width="1.5"></path><g><line x1="290" x2="290" y1="262" y2="274" stroke="#111111" stroke-width="1.5"></line><line x1="278" x2="302" y1="274" y2="274" stroke="#111111" stroke-width="2"></line><line x1="282" x2="298" y1="279" y2="279" stroke="#111111" stroke-width="2"></line><line x1="286" x2="294" y1="284" y2="284" stroke="#111111" stroke-width="2"></line></g><text x="278" y="150" text-anchor="end" font-weight="600" fill="#111111">R1</text><text x="278" y="166" text-anchor="end" font-size="11.5" fill="#444444">100 kΩ</text><text x="278" y="214" text-anchor="end" font-weight="600" fill="#111111">R2</text><text x="278" y="230" text-anchor="end" font-size="11.5" fill="#444444">22 kΩ</text><circle cx="290" cy="184" r="3.5" fill="#111111"></circle><path d="M290 184H350" fill="none" stroke="#111111" stroke-width="1.5"></path><circle cx="350" cy="184" r="3.5" fill="#111111"></circle><path d="M350 184V210" fill="none" stroke="#111111" stroke-width="1.5"></path><line x1="338" x2="362" y1="210" y2="210" stroke="#111111" stroke-width="2.5"></line><line x1="338" x2="362" y1="218" y2="218" stroke="#111111" stroke-width="2.5"></line><path d="M350 218V250H290" fill="none" stroke="#111111" stroke-width="1.5"></path><circle cx="290" cy="250" r="3.5" fill="#111111"></circle><text x="370" y="222" font-size="11.5" fill="#444444">C1 100 nF</text><path d="M350 184H392" fill="none" stroke="#111111" stroke-width="1.5"></path><g><path d="M392 184L402 173H458V195H402Z" fill="#ffffff" stroke="#111111" stroke-width="1.5"></path><text x="430" y="188.5" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111111">GPIO35</text></g><text x="492" y="106" font-size="11.5" fill="#111111">V_out = V_in × R2 / (R1 + R2)</text><text x="492" y="124" font-size="11.5" fill="#111111">12 V × 22 / 122 = 2.16 V</text><text x="492" y="148" font-size="11.5" fill="#111111">Full scale 3.1 V ↔ V_in ≈ 17.2 V</text><text x="492" y="234" font-size="11.5" fill="#444444">If R2 falls out, R1 limits the</text><text x="492" y="250" font-size="11.5" fill="#444444">fault current to (12 − 3.3) V /</text><text x="492" y="266" font-size="11.5" fill="#444444">100 kΩ ≈ 0.09 mA.</text><text x="492" y="290" font-size="11.5" fill="#444444">C1 steadies the reading: the</text><text x="492" y="306" font-size="11.5" fill="#444444">ADC samples a tiny capacitor.</text><line x1="24" x2="736" y1="338" y2="338" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="4 4"></line><text x="24" y="358" font-weight="600" fill="#111111">C. Raw analogRead(): a dead zone at the bottom, saturation at the top (11 dB)</text><rect x="85" y="366" width="235" height="94" fill="#ececec"></rect><line x1="70" x2="400" y1="460" y2="460" stroke="#111111" stroke-width="1.25"></line><line x1="70" x2="70" y1="366" y2="460" stroke="#111111" stroke-width="1.25"></line><line x1="70" y1="460" x2="400" y2="366" stroke="#111111" stroke-width="1.25" stroke-dasharray="5 4"></line><path d="M70.0 460.0L82.0 460.0L120.0 448.5L170.0 433.4L220.0 418.2L270.0 403.3L320.0 388.8L350.0 380.6L370.0 374.1L380.0 369.8L387.0 366.0L400.0 366.0" fill="none" stroke="#111111" stroke-width="2.5"></path><g><line x1="70" x2="70" y1="460" y2="465" stroke="#111111" stroke-width="1"></line><text x="70" y="480" text-anchor="middle" font-size="11.5" fill="#111111">0 V</text></g><g><line x1="170" x2="170" y1="460" y2="465" stroke="#111111" stroke-width="1"></line><text x="170" y="480" text-anchor="middle" font-size="11.5" fill="#111111">1 V</text></g><g><line x1="270" x2="270" y1="460" y2="465" stroke="#111111" stroke-width="1"></line><text x="270" y="480" text-anchor="middle" font-size="11.5" fill="#111111">2 V</text></g><g><line x1="370" x2="370" y1="460" y2="465" stroke="#111111" stroke-width="1"></line><text x="370" y="480" text-anchor="middle" font-size="11.5" fill="#111111">3 V</text></g><text x="62" y="372" text-anchor="end" font-size="11.5" fill="#111111">4095</text><text x="62" y="464" text-anchor="end" font-size="11.5" fill="#111111">0</text><text x="236" y="496" text-anchor="middle" font-size="11.5" fill="#444444">pin voltage</text><text x="420" y="384" font-size="11.5" fill="#111111">━ typical raw reading ╍ ideal straight line</text><text x="420" y="406" font-size="11.5" fill="#111111">Dead zone below ≈ 0.1 V; bends and</text><text x="420" y="422" font-size="11.5" fill="#111111">saturates near 3.1 V.</text><text x="420" y="444" font-size="11.5" fill="#111111">Shaded: the accurate window. Keep</text><text x="420" y="460" font-size="11.5" fill="#111111">signals in it and use analogReadMilliVolts().</text><defs><marker id="adc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111111"></path></marker></defs></svg>
