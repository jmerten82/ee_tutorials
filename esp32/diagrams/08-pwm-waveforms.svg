<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 630" role="img" aria-label="PWM: the duty cycle sets the average, the pulse width sets the servo angle" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><text x="24" y="30" font-size="15" font-weight="600" fill="#111111">PWM: the duty cycle sets the average, the pulse width sets the angle</text><text x="24" y="50" font-size="11.5" fill="#444444">The pin only ever switches between 0 V and 3.3 V; what changes is how long it stays high</text><text x="24" y="80" font-weight="600" fill="#111111">LED dimming: ledcAttach(25, 5000, 8), 5 kHz, values 0–255</text><g><text x="24" y="110" font-weight="600" fill="#111111">10 % duty</text><text x="24" y="127" font-size="11.5" fill="#444444">ledcWrite(25, 26)</text><line x1="200" x2="620" y1="136" y2="136" stroke="#bbbbbb" stroke-width="1"></line><path d="M200 136V96H214V136H340V96H354V136H480V96H494V136H620" fill="none" stroke="#111111" stroke-width="2"></path><line x1="200" x2="628" y1="132" y2="132" stroke="#111111" stroke-width="1.5" stroke-dasharray="6 4"></line><text x="634" y="136" font-size="11.5" fill="#111111">avg 0.33 V</text></g><g><text x="24" y="180" font-weight="600" fill="#111111">50 % duty</text><text x="24" y="197" font-size="11.5" fill="#444444">ledcWrite(25, 128)</text><line x1="200" x2="620" y1="206" y2="206" stroke="#bbbbbb" stroke-width="1"></line><path d="M200 206V166H270V206H340V166H410V206H480V166H550V206H620" fill="none" stroke="#111111" stroke-width="2"></path><line x1="200" x2="628" y1="186" y2="186" stroke="#111111" stroke-width="1.5" stroke-dasharray="6 4"></line><text x="634" y="190" font-size="11.5" fill="#111111">avg 1.65 V</text></g><g><text x="24" y="250" font-weight="600" fill="#111111">90 % duty</text><text x="24" y="267" font-size="11.5" fill="#444444">ledcWrite(25, 230)</text><line x1="200" x2="620" y1="276" y2="276" stroke="#bbbbbb" stroke-width="1"></line><path d="M200 276V236H326V276H340V236H466V276H480V236H606V276H620" fill="none" stroke="#111111" stroke-width="2"></path><line x1="200" x2="628" y1="240" y2="240" stroke="#111111" stroke-width="1.5" stroke-dasharray="6 4"></line><text x="634" y="244" font-size="11.5" fill="#111111">avg 2.97 V</text></g><line x1="200" x2="620" y1="300" y2="300" stroke="#111111" stroke-width="1.5"></line><g><line x1="200" x2="200" y1="300" y2="306" stroke="#111111" stroke-width="1.5"></line><text x="200" y="321" text-anchor="middle" font-size="11.5" fill="#111111">0 µs</text></g><g><line x1="340" x2="340" y1="300" y2="306" stroke="#111111" stroke-width="1.5"></line><text x="340" y="321" text-anchor="middle" font-size="11.5" fill="#111111">200 µs</text></g><g><line x1="480" x2="480" y1="300" y2="306" stroke="#111111" stroke-width="1.5"></line><text x="480" y="321" text-anchor="middle" font-size="11.5" fill="#111111">400 µs</text></g><g><line x1="620" x2="620" y1="300" y2="306" stroke="#111111" stroke-width="1.5"></line><text x="620" y="321" text-anchor="middle" font-size="11.5" fill="#111111">600 µs</text></g><text x="24" y="321" font-size="11.5" fill="#444444">one period = 200 µs</text><text x="24" y="364" font-weight="600" fill="#111111">Servo: ledcAttach(18, 50, 14), 50 Hz, one pulse every 20 ms</text><g><text x="24" y="397" font-weight="600" fill="#111111">1.0 ms → 0°</text><text x="24" y="414" font-size="11.5" fill="#444444">ledcWrite(18, 819)</text><line x1="200" x2="620" y1="418" y2="418" stroke="#bbbbbb" stroke-width="1"></line><path d="M200 418V384H210.5V418H410V384H420.5V418H620" fill="none" stroke="#111111" stroke-width="2"></path><g><path d="M672 414A18 18 0 0 1 708 414" fill="none" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="3 3"></path><line x1="690" y1="414" x2="672.0" y2="414.0" stroke="#111111" stroke-width="3" stroke-linecap="round"></line><circle cx="690" cy="414" r="4" fill="#111111"></circle></g></g><g><text x="24" y="457" font-weight="600" fill="#111111">1.5 ms → 90°</text><text x="24" y="474" font-size="11.5" fill="#444444">ledcWrite(18, 1229)</text><line x1="200" x2="620" y1="478" y2="478" stroke="#bbbbbb" stroke-width="1"></line><path d="M200 478V444H215.75V478H410V444H425.75V478H620" fill="none" stroke="#111111" stroke-width="2"></path><g><path d="M672 474A18 18 0 0 1 708 474" fill="none" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="3 3"></path><line x1="690" y1="474" x2="690.0" y2="456.0" stroke="#111111" stroke-width="3" stroke-linecap="round"></line><circle cx="690" cy="474" r="4" fill="#111111"></circle></g></g><g><text x="24" y="517" font-weight="600" fill="#111111">2.0 ms → 180°</text><text x="24" y="534" font-size="11.5" fill="#444444">ledcWrite(18, 1638)</text><line x1="200" x2="620" y1="538" y2="538" stroke="#bbbbbb" stroke-width="1"></line><path d="M200 538V504H221V538H410V504H431V538H620" fill="none" stroke="#111111" stroke-width="2"></path><g><path d="M672 534A18 18 0 0 1 708 534" fill="none" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="3 3"></path><line x1="690" y1="534" x2="708.0" y2="534.0" stroke="#111111" stroke-width="3" stroke-linecap="round"></line><circle cx="690" cy="534" r="4" fill="#111111"></circle></g></g><line x1="200" x2="620" y1="552" y2="552" stroke="#111111" stroke-width="1.5"></line><g><line x1="200" x2="200" y1="552" y2="558" stroke="#111111" stroke-width="1.5"></line><text x="200" y="573" text-anchor="middle" font-size="11.5" fill="#111111">0 ms</text></g><g><line x1="305" x2="305" y1="552" y2="558" stroke="#111111" stroke-width="1.5"></line><text x="305" y="573" text-anchor="middle" font-size="11.5" fill="#111111">10 ms</text></g><g><line x1="410" x2="410" y1="552" y2="558" stroke="#111111" stroke-width="1.5"></line><text x="410" y="573" text-anchor="middle" font-size="11.5" fill="#111111">20 ms</text></g><g><line x1="515" x2="515" y1="552" y2="558" stroke="#111111" stroke-width="1.5"></line><text x="515" y="573" text-anchor="middle" font-size="11.5" fill="#111111">30 ms</text></g><g><line x1="620" x2="620" y1="552" y2="558" stroke="#111111" stroke-width="1.5"></line><text x="620" y="573" text-anchor="middle" font-size="11.5" fill="#111111">40 ms</text></g><text x="24" y="573" font-size="11.5" fill="#444444">drawn to scale</text><text x="24" y="600" font-size="11.5" fill="#444444">14-bit at 50 Hz: 20 ms = 16384 counts, so 1 ms ≈ 819 and 2 ms ≈ 1638. Many SG90s travel further</text><text x="24" y="617" font-size="11.5" fill="#444444">with 0.5–2.5 ms pulses; widen the range a little at a time and stop if the servo buzzes at the end.</text></svg>
