<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 478" role="img" aria-label="Strapping pins and boot modes of the ESP32" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><defs><marker id="strap-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#000000"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="700" fill="#000000">Boot modes: the chip reads five pins the moment EN goes high</text><text x="24" y="50" font-size="12.5" fill="#000000">The upload tool, the BOOT button and anything you wire to these pins all act through this one instant</text><text x="24" y="92" font-weight="700" fill="#000000">EN</text><path d="M80 80H170V104H260V80H460" fill="none" stroke="#000000" stroke-width="3.75"></path><text x="215" y="120" text-anchor="middle" font-size="12.5" fill="#000000">reset</text><text x="24" y="150" font-weight="700" fill="#000000">GPIO0</text><text x="24" y="166" font-size="12.5" fill="#000000">upload</text><path d="M80 140H200V164H310V140H460" fill="none" stroke="#000000" stroke-width="3.75"></path><text x="24" y="206" font-weight="700" fill="#000000">GPIO0</text><text x="24" y="222" font-size="12.5" fill="#000000">normal</text><path d="M80 196H460" fill="none" stroke="#000000" stroke-width="3.75"></path><line x1="260" x2="260" y1="70" y2="236" stroke="#000000" stroke-width="1.88" stroke-dasharray="4 3"></line><text x="266" y="240" font-size="12.5" font-weight="700" fill="#000000">straps latched</text><path d="M470 152H500" fill="none" stroke="#000000" stroke-width="2.25" marker-end="url(#strap-arrow)"></path><rect x="504" y="130" width="232" height="44" rx="4" fill="#dedede" stroke="#000000" stroke-width="2.25"></rect><text x="516" y="150" font-weight="700" fill="#000000">Download mode</text><text x="516" y="166" font-size="12.5" fill="#000000">waits for the uploader</text><path d="M470 202H500" fill="none" stroke="#000000" stroke-width="2.25" marker-end="url(#strap-arrow)"></path><rect x="504" y="184" width="232" height="44" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><text x="516" y="204" font-weight="700" fill="#000000">Normal boot</text><text x="516" y="220" font-size="12.5" fill="#000000">loads your sketch from flash</text><text x="504" y="86" font-size="12.5" fill="#000000">The bridge does this for you:</text><text x="504" y="102" font-size="12.5" fill="#000000">DTR/RTS pull EN and GPIO0 low.</text><text x="504" y="118" font-size="12.5" fill="#000000">By hand: hold BOOT, tap EN.</text><rect x="24" y="262" width="712" height="30" fill="#000000"></rect><text x="32" y="282" font-weight="700" fill="#ffffff">Pin</text><text x="112" y="282" font-weight="700" fill="#ffffff">Pull at reset</text><text x="202" y="282" font-weight="700" fill="#ffffff">Level it needs at reset</text><text x="412" y="282" font-weight="700" fill="#ffffff">If it is wrong</text><g><rect x="24" y="292" width="712" height="30" fill="#ffffff" stroke="#000000" stroke-width="1.5"></rect><text x="32" y="312" font-size="13" font-weight="700" fill="#000000">GPIO0</text><text x="112" y="312" font-size="12.5" font-weight="400" fill="#000000">pull-up</text><text x="202" y="312" font-size="12.5" font-weight="400" fill="#000000">high: run sketch; low: download</text><text x="412" y="312" font-size="12.5" font-weight="400" fill="#000000">stuck in download mode, sketch never starts</text></g><g><rect x="24" y="322" width="712" height="30" fill="#ffffff" stroke="#000000" stroke-width="1.5"></rect><text x="32" y="342" font-size="13" font-weight="700" fill="#000000">GPIO2</text><text x="112" y="342" font-size="12.5" font-weight="400" fill="#000000">pull-down</text><text x="202" y="342" font-size="12.5" font-weight="400" fill="#000000">low or open to upload</text><text x="412" y="342" font-size="12.5" font-weight="400" fill="#000000">"Failed to connect" during upload</text></g><g><rect x="24" y="352" width="712" height="30" fill="#ffffff" stroke="#000000" stroke-width="1.5"></rect><text x="32" y="372" font-size="13" font-weight="700" fill="#000000">GPIO5</text><text x="112" y="372" font-size="12.5" font-weight="400" fill="#000000">pull-up</text><text x="202" y="372" font-size="12.5" font-weight="400" fill="#000000">high (leave it)</text><text x="412" y="372" font-size="12.5" font-weight="400" fill="#000000">rarely matters (SDIO timing)</text></g><g><rect x="24" y="382" width="712" height="30" fill="#dedede" stroke="#000000" stroke-width="1.5"></rect><text x="32" y="402" font-size="13" font-weight="700" fill="#000000">GPIO12</text><text x="112" y="402" font-size="12.5" font-weight="400" fill="#000000">pull-down</text><text x="202" y="402" font-size="12.5" font-weight="700" fill="#000000">LOW, always</text><text x="412" y="402" font-size="12.5" font-weight="400" fill="#000000">flash runs at 1.8 V: boot loop, flash errors</text></g><g><rect x="24" y="412" width="712" height="30" fill="#ffffff" stroke="#000000" stroke-width="1.5"></rect><text x="32" y="432" font-size="13" font-weight="700" fill="#000000">GPIO15</text><text x="112" y="432" font-size="12.5" font-weight="400" fill="#000000">pull-up</text><text x="202" y="432" font-size="12.5" font-weight="400" fill="#000000">high (leave it)</text><text x="412" y="432" font-size="12.5" font-weight="400" fill="#000000">low only silences the boot log</text></g><line x1="104" x2="104" y1="262" y2="442" stroke="#000000" stroke-width="1.5"></line><line x1="194" x2="194" y1="262" y2="442" stroke="#000000" stroke-width="1.5"></line><line x1="404" x2="404" y1="262" y2="442" stroke="#000000" stroke-width="1.5"></line><text x="24" y="466" font-size="12.5" fill="#000000">GPIO12 is the dangerous one: a pull-up, or a sensor that drives it high, makes a WROOM board reboot forever.</text></svg>
