<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 740" role="img" aria-label="One page view, step by step" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><defs><marker id="web-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#000000"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="700" fill="#000000">One page view, step by step</text><text x="24" y="50" font-size="12.5" fill="#000000">Lesson 5. Browser and ESP32 talk through the router; time runs downwards</text><g><line x1="130" x2="130" y1="110" y2="656" stroke="#000000" stroke-width="2.25" stroke-dasharray="5 5"></line><rect x="48" y="66" width="164" height="44" rx="4" fill="#dedede" stroke="#000000" stroke-width="2.25"></rect><text x="130" y="85" text-anchor="middle" font-weight="700" fill="#000000">Phone or laptop</text><text x="130" y="101" text-anchor="middle" font-size="12.5" fill="#000000">web browser</text></g><g><line x1="370" x2="370" y1="110" y2="656" stroke="#000000" stroke-width="2.25" stroke-dasharray="5 5"></line><rect x="288" y="66" width="164" height="44" rx="4" fill="#dedede" stroke="#000000" stroke-width="2.25"></rect><text x="370" y="85" text-anchor="middle" font-weight="700" fill="#000000">Wi-Fi router</text><text x="370" y="101" text-anchor="middle" font-size="12.5" fill="#000000">access point + DHCP</text></g><g><line x1="600" x2="600" y1="110" y2="656" stroke="#000000" stroke-width="2.25" stroke-dasharray="5 5"></line><rect x="518" y="66" width="164" height="44" rx="4" fill="#dedede" stroke="#000000" stroke-width="2.25"></rect><text x="600" y="85" text-anchor="middle" font-weight="700" fill="#000000">ESP32</text><text x="600" y="101" text-anchor="middle" font-size="12.5" fill="#000000">WebServer on port 80</text></g><g><circle cx="24" cy="140" r="10" fill="#000000"></circle><text x="24" y="144" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">1</text><g><line x1="600" x2="372" y1="140" y2="140" stroke="#000000" stroke-width="2.25" marker-end="url(#web-arrow)"></line><text x="394" y="133" fill="#000000">WiFi.begin(ssid, password)</text></g></g><g><circle cx="24" cy="178" r="10" fill="#000000"></circle><text x="24" y="182" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">2</text><g><line x1="370" x2="598" y1="178" y2="178" stroke="#000000" stroke-width="2.25" marker-end="url(#web-arrow)"></line><text x="394" y="171" fill="#000000">DHCP: your IP is 192.168.1.42</text></g></g><g><circle cx="24" cy="216" r="10" fill="#000000"></circle><text x="24" y="220" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">3</text><g><rect x="456" y="198" width="290" height="26" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><text x="601" y="215" text-anchor="middle" font-size="12.5" fill="#000000">MDNS.begin("esp32");  server.begin();</text></g></g><g><circle cx="24" cy="254" r="10" fill="#000000"></circle><text x="24" y="258" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">4</text><g><line x1="130" x2="598" y1="254" y2="254" stroke="#000000" stroke-width="2.25" marker-end="url(#web-arrow)"></line><text x="154" y="247" fill="#000000">mDNS: who is esp32.local?</text></g></g><g><circle cx="24" cy="292" r="10" fill="#000000"></circle><text x="24" y="296" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">5</text><g><line x1="600" x2="132" y1="292" y2="292" stroke="#000000" stroke-width="2.25" marker-end="url(#web-arrow)"></line><text x="154" y="285" fill="#000000">esp32.local = 192.168.1.42</text></g></g><g><circle cx="24" cy="330" r="10" fill="#000000"></circle><text x="24" y="334" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">6</text><g><line x1="130" x2="598" y1="330" y2="330" stroke="#000000" stroke-width="2.25" marker-end="url(#web-arrow)"></line><text x="154" y="323" fill="#000000">GET /</text></g></g><g><circle cx="24" cy="368" r="10" fill="#000000"></circle><text x="24" y="372" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">7</text><g><rect x="456" y="350" width="290" height="26" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><text x="601" y="367" text-anchor="middle" font-size="12.5" fill="#000000">handleRoot(): read BME280, build HTML</text></g></g><g><circle cx="24" cy="406" r="10" fill="#000000"></circle><text x="24" y="410" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">8</text><g><line x1="600" x2="132" y1="406" y2="406" stroke="#000000" stroke-width="2.25" marker-end="url(#web-arrow)"></line><text x="154" y="399" fill="#000000">200 OK, text/html</text></g></g><g><circle cx="24" cy="444" r="10" fill="#000000"></circle><text x="24" y="448" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">9</text><g><rect x="44" y="426" width="172" height="26" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><text x="130" y="443" text-anchor="middle" font-size="12.5" fill="#000000">user taps “Toggle LED”</text></g></g><g><circle cx="24" cy="482" r="10" fill="#000000"></circle><text x="24" y="486" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">10</text><g><line x1="130" x2="598" y1="482" y2="482" stroke="#000000" stroke-width="2.25" marker-end="url(#web-arrow)"></line><text x="154" y="475" fill="#000000">POST /toggle  (form button)</text></g></g><g><circle cx="24" cy="520" r="10" fill="#000000"></circle><text x="24" y="524" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">11</text><g><rect x="456" y="502" width="290" height="26" rx="4" fill="#ffffff" stroke="#000000" stroke-width="2.25"></rect><text x="601" y="519" text-anchor="middle" font-size="12.5" fill="#000000">handleToggle(): flip GPIO25</text></g></g><g><circle cx="24" cy="558" r="10" fill="#000000"></circle><text x="24" y="562" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">12</text><g><line x1="600" x2="132" y1="558" y2="558" stroke="#000000" stroke-width="2.25" marker-end="url(#web-arrow)"></line><text x="154" y="551" fill="#000000">303 See Other, Location: /</text></g></g><g><circle cx="24" cy="596" r="10" fill="#000000"></circle><text x="24" y="600" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">13</text><g><line x1="130" x2="598" y1="596" y2="596" stroke="#000000" stroke-width="2.25" marker-end="url(#web-arrow)"></line><text x="154" y="589" fill="#000000">GET /  (follows the redirect)</text></g></g><g><circle cx="24" cy="634" r="10" fill="#000000"></circle><text x="24" y="638" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">14</text><g><line x1="600" x2="132" y1="634" y2="634" stroke="#000000" stroke-width="2.25" marker-end="url(#web-arrow)"></line><text x="154" y="627" fill="#000000">200 OK, updated page</text></g></g><rect x="24" y="672" width="712" height="52" rx="4" fill="#dedede" stroke="#000000" stroke-width="2.25"></rect><text x="38" y="693" font-weight="700" fill="#000000">loop() keeps calling server.handleClient()</text><text x="38" y="712" font-size="12.5" fill="#000000">Steps 6–14 only happen inside that call. A long delay() in loop() makes every page load wait.</text></svg>
