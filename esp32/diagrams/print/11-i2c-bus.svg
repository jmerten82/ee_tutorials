<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 548" role="img" aria-label="I2C: two wires, many devices, one pair of pull-ups" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><text x="24" y="30" font-size="15" font-weight="700" fill="#000000">I2C: two wires, many devices, one pair of pull-ups</text><text x="24" y="50" font-size="12.5" fill="#000000">Lesson 4. Every device on the bus has its own address; all of them run from 3V3</text><g fill="none" stroke="#000000" stroke-width="2.25"><path d="M170 210H712"></path><path d="M170 250H712"></path><path d="M170 170H196"></path><path d="M240 100V120"></path><path d="M240 160V210"></path><path d="M290 100V120"></path><path d="M290 160V250"></path><path d="M140 300V316"></path></g><circle cx="240" cy="210" r="3.5" fill="#000000"></circle><circle cx="290" cy="250" r="3.5" fill="#000000"></circle><line x1="196" x2="196" y1="158" y2="182" stroke="#000000" stroke-width="3"></line><text x="202" y="174" font-size="12.5" font-weight="700" fill="#000000">3V3</text><g><line x1="228" x2="252" y1="100" y2="100" stroke="#000000" stroke-width="3"></line><text x="240" y="94" text-anchor="middle" font-size="12.5" font-weight="700" fill="#000000">3V3</text></g><g><line x1="278" x2="302" y1="100" y2="100" stroke="#000000" stroke-width="3"></line><text x="290" y="94" text-anchor="middle" font-size="12.5" font-weight="700" fill="#000000">3V3</text></g><rect x="232" y="120" width="16" height="40" fill="none" stroke="#000000" stroke-width="2.25"></rect><rect x="282" y="120" width="16" height="40" fill="none" stroke="#000000" stroke-width="2.25"></rect><text x="226" y="144" text-anchor="end" font-weight="700" fill="#000000">R1</text><text x="306" y="138" font-weight="700" fill="#000000">R2</text><text x="306" y="154" font-size="12.5" fill="#000000">4.7 kΩ each</text><text x="718" y="214" font-weight="700" fill="#000000">SCL</text><text x="718" y="254" font-weight="700" fill="#000000">SDA</text><rect x="30" y="150" width="140" height="150" rx="4" fill="#dedede" stroke="#000000" stroke-width="2.25"></rect><text x="60" y="196" text-anchor="middle" font-weight="700" fill="#000000">ESP32</text><text x="162" y="174" text-anchor="end" font-size="12.5" fill="#000000">3V3</text><text x="162" y="214" text-anchor="end" font-size="12.5" fill="#000000">GPIO22</text><text x="162" y="254" text-anchor="end" font-size="12.5" fill="#000000">GPIO21</text><text x="140" y="292" text-anchor="middle" font-size="12.5" fill="#000000">GND</text><g stroke="#000000" stroke-width="2.25"><line x1="140" x2="140" y1="316" y2="326"></line><line x1="128" x2="152" y1="326" y2="326"></line><line x1="132" x2="148" y1="331" y2="331"></line><line x1="136" x2="144" y1="336" y2="336"></line></g><text x="30" y="350" font-size="12.5" fill="#000000">Wire.begin(21, 22);</text><text x="400" y="96" font-weight="700" fill="#000000">One pair of pull-ups per bus, to 3V3</text><text x="400" y="114" font-size="12.5" fill="#000000">Most breakout modules already carry them.</text><text x="400" y="130" font-size="12.5" fill="#000000">Check before adding more; 2–3 sets in parallel</text><text x="400" y="146" font-size="12.5" fill="#000000">are fine, more makes the low level too weak.</text><g><line x1="420" x2="420" y1="210" y2="300" stroke="#000000" stroke-width="2.25"></line><line x1="490" x2="490" y1="250" y2="300" stroke="#000000" stroke-width="2.25"></line><circle cx="420" cy="210" r="3.5" fill="#000000"></circle><circle cx="490" cy="250" r="3.5" fill="#000000"></circle><rect x="380" y="300" width="150" height="100" rx="4" fill="#dedede" stroke="#000000" stroke-width="2.25"></rect><text x="420" y="316" text-anchor="middle" font-size="12.5" fill="#000000">SCL</text><text x="490" y="316" text-anchor="middle" font-size="12.5" fill="#000000">SDA</text><text x="455" y="342" text-anchor="middle" font-weight="700" fill="#000000">BME280</text><text x="455" y="359" text-anchor="middle" font-size="12.5" fill="#000000">addr 0x76</text><text x="455" y="375" text-anchor="middle" font-size="12.5" fill="#000000">0x77 if SDO to 3V3</text><text x="420" y="394" text-anchor="middle" font-size="12.5" fill="#000000">VCC</text><text x="490" y="394" text-anchor="middle" font-size="12.5" fill="#000000">GND</text><g><line x1="420" x2="420" y1="400" y2="425" stroke="#000000" stroke-width="2.25"></line><line x1="408" x2="432" y1="425" y2="425" stroke="#000000" stroke-width="3"></line><text x="420" y="441" text-anchor="middle" font-size="12.5" font-weight="700" fill="#000000">3V3</text></g><g stroke="#000000" stroke-width="2.25"><line x1="490" x2="490" y1="400" y2="410"></line><line x1="478" x2="502" y1="410" y2="410"></line><line x1="482" x2="498" y1="415" y2="415"></line><line x1="486" x2="494" y1="420" y2="420"></line></g></g><g><line x1="610" x2="610" y1="210" y2="300" stroke="#000000" stroke-width="2.25"></line><line x1="680" x2="680" y1="250" y2="300" stroke="#000000" stroke-width="2.25"></line><circle cx="610" cy="210" r="3.5" fill="#000000"></circle><circle cx="680" cy="250" r="3.5" fill="#000000"></circle><rect x="570" y="300" width="150" height="100" rx="4" fill="#dedede" stroke="#000000" stroke-width="2.25"></rect><text x="610" y="316" text-anchor="middle" font-size="12.5" fill="#000000">SCL</text><text x="680" y="316" text-anchor="middle" font-size="12.5" fill="#000000">SDA</text><text x="645" y="342" text-anchor="middle" font-weight="700" fill="#000000">SSD1306 OLED</text><text x="645" y="359" text-anchor="middle" font-size="12.5" fill="#000000">128 × 64 pixels</text><text x="645" y="375" text-anchor="middle" font-size="12.5" fill="#000000">addr 0x3C</text><text x="610" y="394" text-anchor="middle" font-size="12.5" fill="#000000">VCC</text><text x="680" y="394" text-anchor="middle" font-size="12.5" fill="#000000">GND</text><g><line x1="610" x2="610" y1="400" y2="425" stroke="#000000" stroke-width="2.25"></line><line x1="598" x2="622" y1="425" y2="425" stroke="#000000" stroke-width="3"></line><text x="610" y="441" text-anchor="middle" font-size="12.5" font-weight="700" fill="#000000">3V3</text></g><g stroke="#000000" stroke-width="2.25"><line x1="680" x2="680" y1="400" y2="410"></line><line x1="668" x2="692" y1="410" y2="410"></line><line x1="672" x2="688" y1="415" y2="415"></line><line x1="676" x2="684" y1="420" y2="420"></line></g></g><rect x="24" y="372" width="334" height="164" rx="4" fill="none" stroke="#000000" stroke-width="2.25"></rect><text x="36" y="394" font-weight="700" fill="#000000">Open drain: anyone may pull low</text><text x="36" y="412" font-size="12.5" fill="#000000">Released, the resistor pulls the line to 3.3 V.</text><text x="36" y="428" font-size="12.5" fill="#000000">A device switches it to 0 V; none drives it high.</text><text x="40" y="465" font-size="12.5" font-weight="700" fill="#000000">3V3</text><g fill="none" stroke="#000000" stroke-width="2.25"><path d="M68 461H90"></path><rect x="90" y="453" width="40" height="16"></rect><path d="M130 461H320"></path><path d="M200 461V476"></path><path d="M200 476L212 490"></path><path d="M200 494V500"></path><path d="M280 461V476"></path><path d="M280 476L292 490"></path><path d="M280 494V500"></path></g><circle cx="200" cy="461" r="3.5" fill="#000000"></circle><circle cx="280" cy="461" r="3.5" fill="#000000"></circle><g stroke="#000000" stroke-width="2.25"><line x1="200" x2="200" y1="500" y2="510"></line><line x1="188" x2="212" y1="510" y2="510"></line><line x1="192" x2="208" y1="515" y2="515"></line><line x1="196" x2="204" y1="520" y2="520"></line></g><g stroke="#000000" stroke-width="2.25"><line x1="280" x2="280" y1="500" y2="510"></line><line x1="268" x2="292" y1="510" y2="510"></line><line x1="272" x2="288" y1="515" y2="515"></line><line x1="276" x2="284" y1="520" y2="520"></line></g><text x="222" y="490" font-size="12.5" fill="#000000">ESP32</text><text x="302" y="490" font-size="12.5" fill="#000000">sensor</text><text x="110" y="446" text-anchor="middle" font-size="12.5" fill="#000000">4.7 kΩ</text></svg>
