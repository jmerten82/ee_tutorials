<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 540" role="img" aria-label="Deep sleep: short bursts of current, long quiet gaps" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><text x="24" y="30" font-size="15" font-weight="600" fill="#111111">Deep sleep: short bursts of current, long quiet gaps</text><text x="24" y="50" font-size="11.5" fill="#444444">Lesson 6. Typical wake, measure, send, sleep cycle; current on a log scale, values approximate</text><g><line x1="120" x2="720" y1="390" y2="390" stroke="#bbbbbb" stroke-width="1" stroke-dasharray=""></line><text x="112" y="394" text-anchor="end" font-size="11.5" fill="#111111">0.001</text></g><g><line x1="120" x2="720" y1="340" y2="340" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="2 4"></line><text x="112" y="344" text-anchor="end" font-size="11.5" fill="#111111">0.01</text></g><g><line x1="120" x2="720" y1="290" y2="290" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="2 4"></line><text x="112" y="294" text-anchor="end" font-size="11.5" fill="#111111">0.1</text></g><g><line x1="120" x2="720" y1="240" y2="240" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="2 4"></line><text x="112" y="244" text-anchor="end" font-size="11.5" fill="#111111">1</text></g><g><line x1="120" x2="720" y1="190" y2="190" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="2 4"></line><text x="112" y="194" text-anchor="end" font-size="11.5" fill="#111111">10</text></g><g><line x1="120" x2="720" y1="140" y2="140" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="2 4"></line><text x="112" y="144" text-anchor="end" font-size="11.5" fill="#111111">100</text></g><g><line x1="120" x2="720" y1="90" y2="90" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="2 4"></line><text x="112" y="94" text-anchor="end" font-size="11.5" fill="#111111">1000</text></g><text transform="translate(40 240) rotate(-90)" text-anchor="middle" font-size="11.5" fill="#444444">current (mA), log scale</text><rect x="120" y="181.19543704721593" width="20" height="23.85606273598313" fill="#ececec"></rect><rect x="365" y="181.19543704721593" width="165" height="23.85606273598313" fill="#ececec"></rect><rect x="550" y="181.19543704721593" width="60" height="23.85606273598313" fill="#ececec"></rect><g fill="none" stroke="#111111" stroke-width="1.5" stroke-dasharray="6 4"><path d="M120 190H140"></path><path d="M365 190H530"></path><path d="M550 190H610"></path></g><path d="M120 340H140V157.3393743112328H162.5V136.04093769761874H185.0V121.0H189.0V136.0H222.5V121.0H226.5V136.0H252.5V121.0H256.5V136.0H282.5V121.0H286.5V136.0H320.0V121.0H324.0V136.0H350.0V121.0H354.0V136.0H365V340H530" fill="none" stroke="#111111" stroke-width="2"></path><path d="M550 340H610V157.3393743112328H632.5V136.04093769761874H655.0V121.0H659.0V136.0H692.5V121.0H696.5V136.0H720" fill="none" stroke="#111111" stroke-width="2"></path><text x="150" y="108" font-size="11.5" fill="#111111">Wi-Fi on: ≈ 2.7 s at ≈ 120 mA, TX peaks ≈ 240 mA</text><text x="612" y="108" font-size="11.5" fill="#111111">next wake</text><text x="170" y="176" font-size="11.5" fill="#111111">← boot: 0.3 s at ≈ 45 mA</text><text x="380" y="174" font-weight="600" fill="#111111">DevKitC board asleep: ≈ 5–15 mA</text><text x="380" y="222" font-size="11.5" fill="#444444">LDO + USB-UART bridge + power LED</text><text x="380" y="330" font-weight="600" fill="#111111">bare module asleep: ≈ 0.01 mA</text><text x="380" y="366" font-size="11.5" fill="#444444">10 µA, RTC timer running</text><line x1="120" x2="720" y1="390" y2="390" stroke="#111111" stroke-width="1.5"></line><rect x="532" y="380" width="16" height="20" fill="#ffffff"></rect><line x1="528" x2="538" y1="398" y2="382" stroke="#111111" stroke-width="1.5"></line><line x1="542" x2="552" y1="398" y2="382" stroke="#111111" stroke-width="1.5"></line><g><line x1="140" x2="140" y1="390" y2="396" stroke="#111111" stroke-width="1.5"></line><text x="140" y="410" text-anchor="middle" font-size="11.5" fill="#111111">0 s</text></g><g><line x1="215" x2="215" y1="390" y2="396" stroke="#111111" stroke-width="1.5"></line><text x="215" y="410" text-anchor="middle" font-size="11.5" fill="#111111">1 s</text></g><g><line x1="290" x2="290" y1="390" y2="396" stroke="#111111" stroke-width="1.5"></line><text x="290" y="410" text-anchor="middle" font-size="11.5" fill="#111111">2 s</text></g><g><line x1="365" x2="365" y1="390" y2="396" stroke="#111111" stroke-width="1.5"></line><text x="365" y="410" text-anchor="middle" font-size="11.5" fill="#111111">3 s</text></g><line x1="610" x2="610" y1="390" y2="396" stroke="#111111" stroke-width="1.5"></line><text x="610" y="410" text-anchor="middle" font-size="11.5" fill="#111111">600 s</text><text x="540" y="424" text-anchor="middle" font-size="11.5" fill="#444444">(10 min gap cut)</text><text x="24" y="452" font-weight="600" fill="#111111">I_avg = (I_active × t_active + I_sleep × t_sleep) / T</text><text x="24" y="474" font-size="11.5" fill="#111111">Example: wake every 10 min (T = 600 s); one wake ≈ 0.3 s × 45 mA + 2.7 s × 120 mA ≈ 340 mA·s.</text><text x="24" y="492" font-size="11.5" fill="#111111">Bare module: (340 + 0.01 × 597) / 600 ≈ 0.58 mA, so a 2000 mAh cell lasts ≈ 140 days.</text><text x="24" y="510" font-size="11.5" fill="#111111">DevKitC: (340 + 10 × 597) / 600 ≈ 10.5 mA, so the same cell lasts ≈ 8 days.</text><text x="24" y="528" font-size="11.5" fill="#444444">Ideal cell, no regulator losses: real life is shorter. Measure your own board in Lesson 6.</text></svg>
