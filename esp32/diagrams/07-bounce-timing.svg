<svg viewBox="0 0 760 476" role="img" aria-label="Contact bounce: one press looks like several" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><defs><marker id="bnc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111111"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#111111">Contact bounce: one press looks like several</text><text x="24" y="50" font-size="11.5" fill="#444444">Button from GPIO33 to GND with INPUT_PULLUP: released reads HIGH (3.3 V), pressed reads LOW (0 V)</text><g stroke="#bbbbbb" stroke-width="1" stroke-dasharray="4 4"><line x1="202" x2="202" y1="88" y2="400"></line><line x1="474" x2="474" y1="88" y2="400"></line></g><text x="202" y="70" text-anchor="middle" font-weight="600" fill="#111111">press</text><path d="M202 74V86" stroke="#111111" stroke-width="1.5" marker-end="url(#bnc-arrow)"></path><text x="474" y="70" text-anchor="middle" font-weight="600" fill="#111111">release</text><path d="M474 74V86" stroke="#111111" stroke-width="1.5" marker-end="url(#bnc-arrow)"></path><g><text x="24" y="110" font-weight="600" fill="#111111">Ideal contact</text><text x="24" y="127" font-size="11.5" fill="#444444">what the switch should do</text></g><g><text x="24" y="190" font-weight="600" fill="#111111">Real pin</text><text x="24" y="207" font-size="11.5" fill="#444444">GPIO33, what it sees</text></g><g><text x="24" y="270" font-weight="600" fill="#111111">Naive counter</text><text x="24" y="287" font-size="11.5" fill="#444444">every falling edge</text></g><g><text x="24" y="350" font-weight="600" fill="#111111">Debounced state</text><text x="24" y="367" font-size="11.5" fill="#444444">stable for 20 ms first</text></g><rect x="248.4" y="332" width="159.99999999999997" height="42" fill="#ececec"></rect><rect x="499.6" y="332" width="160" height="42" fill="#ececec"></rect><text x="328.4" y="358" text-anchor="middle" font-size="11.5" fill="#111111">stable 20 ms</text><text x="579.6" y="358" text-anchor="middle" font-size="11.5" fill="#111111">stable 20 ms</text><g fill="none" stroke="#111111" stroke-width="2"><path d="M170 96H202V130H474V96H690"></path><path d="M170 176H202V210H211.6V176H219.6V210H229.2V176H235.6V210H242V176H248.4V210H474V176H480.4V210H488.4V176H493.2V210H499.6V176H690"></path><path d="M170 336H408.4V370H659.6V336H690"></path></g><text x="696" y="100" font-size="11.5" fill="#444444">3.3 V</text><text x="696" y="134" font-size="11.5" fill="#444444">0 V</text><text x="258" y="168" font-size="11.5" fill="#444444">bounce ≈ 6 ms</text><text x="510" y="168" font-size="11.5" fill="#444444">≈ 3 ms</text><line x1="170" x2="690" y1="290" y2="290" stroke="#bbbbbb" stroke-width="1"></line><line x1="202" x2="202" y1="290" y2="262" stroke="#111111" stroke-width="2"></line><line x1="219.6" x2="219.6" y1="290" y2="262" stroke="#111111" stroke-width="2"></line><line x1="235.6" x2="235.6" y1="290" y2="262" stroke="#111111" stroke-width="2"></line><line x1="248.4" x2="248.4" y1="290" y2="262" stroke="#111111" stroke-width="2"></line><line x1="480.4" x2="480.4" y1="290" y2="262" stroke="#111111" stroke-width="2"></line><line x1="493.2" x2="493.2" y1="290" y2="262" stroke="#111111" stroke-width="2"></line><text x="258" y="282" font-size="11.5" fill="#111111">4 edges</text><text x="510" y="282" font-size="11.5" fill="#111111">2 edges</text><text x="570" y="270" font-weight="600" fill="#111111">Total: 6 presses</text><text x="570" y="287" font-size="11.5" fill="#444444">for one real press</text><text x="402.4" y="326" text-anchor="end" font-size="11.5" fill="#111111">falls at 30 ms</text><line x1="170" x2="690" y1="400" y2="400" stroke="#111111" stroke-width="1.5"></line><g><line x1="170" x2="170" y1="400" y2="406" stroke="#111111" stroke-width="1.5"></line><text x="170" y="421" text-anchor="middle" font-size="11.5" fill="#111111">0</text></g><g><line x1="250" x2="250" y1="400" y2="406" stroke="#111111" stroke-width="1.5"></line><text x="250" y="421" text-anchor="middle" font-size="11.5" fill="#111111">10</text></g><g><line x1="330" x2="330" y1="400" y2="406" stroke="#111111" stroke-width="1.5"></line><text x="330" y="421" text-anchor="middle" font-size="11.5" fill="#111111">20</text></g><g><line x1="410" x2="410" y1="400" y2="406" stroke="#111111" stroke-width="1.5"></line><text x="410" y="421" text-anchor="middle" font-size="11.5" fill="#111111">30</text></g><g><line x1="490" x2="490" y1="400" y2="406" stroke="#111111" stroke-width="1.5"></line><text x="490" y="421" text-anchor="middle" font-size="11.5" fill="#111111">40</text></g><g><line x1="570" x2="570" y1="400" y2="406" stroke="#111111" stroke-width="1.5"></line><text x="570" y="421" text-anchor="middle" font-size="11.5" fill="#111111">50</text></g><g><line x1="650" x2="650" y1="400" y2="406" stroke="#111111" stroke-width="1.5"></line><text x="650" y="421" text-anchor="middle" font-size="11.5" fill="#111111">60</text></g><text x="690" y="440" text-anchor="end" font-size="11.5" fill="#444444">time (ms)</text><text x="24" y="462" font-size="11.5" fill="#444444">Debounce rule: accept a new level only after it has stayed the same for 20 ms.</text></svg>
