<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 600" role="img" aria-label="Low-side MOSFET switch: 3.3 V logic switches a 12 V motor" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><defs><marker id="mos-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111111"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#111111">Low-side MOSFET switch: 3.3 V logic switches a 12 V motor</text><text x="24" y="50" font-size="11.5" fill="#444444">Lesson 3. The MOSFET sits between the load and ground; the load always connects to +12 V</text><g fill="none" stroke="#111111" stroke-width="1.5"><path d="M400 90H650V180"></path><path d="M650 260V400"></path><path d="M400 90V128"></path><path d="M400 172V237H362"></path><path d="M400 106H480V140"></path><path d="M480 166V196H400"></path><path d="M170 260H210"></path><path d="M250 260H352"></path><path d="M300 260V300"></path><path d="M300 340V400"></path><path d="M362 283H400V400"></path><path d="M400 260V283"></path><path d="M105 330V400H650"></path></g><g><circle cx="400" cy="106" r="3.5" fill="#111111"></circle><circle cx="400" cy="196" r="3.5" fill="#111111"></circle><circle cx="300" cy="260" r="3.5" fill="#111111"></circle><circle cx="400" cy="283" r="3.5" fill="#111111"></circle><circle cx="300" cy="400" r="3.5" fill="#111111"></circle><circle cx="400" cy="400" r="3.5" fill="#111111"></circle><circle cx="220" cy="400" r="3.5" fill="#111111"></circle></g><g stroke="#111111" stroke-width="1.5"><line x1="220" x2="220" y1="400" y2="410"></line><line x1="208" x2="232" y1="410" y2="410"></line><line x1="212" x2="228" y1="415" y2="415"></line><line x1="216" x2="224" y1="420" y2="420"></line></g><text x="520" y="82" font-weight="600" fill="#111111">+12 V</text><g><rect x="40" y="200" width="130" height="130" rx="4" fill="#ececec" stroke="#111111" stroke-width="1.5"></rect><text x="105" y="226" text-anchor="middle" font-weight="600" fill="#111111">ESP32</text><text x="105" y="242" text-anchor="middle" font-size="11.5" fill="#444444">3.3 V logic</text><text x="162" y="264" text-anchor="end" font-size="11.5" fill="#111111">GPIO19</text><text x="105" y="322" text-anchor="middle" font-size="11.5" fill="#111111">GND</text></g><g><rect x="210" y="252" width="40" height="16" fill="none" stroke="#111111" stroke-width="1.5"></rect><text x="230" y="242" text-anchor="middle" font-weight="600" fill="#111111">R1 100 Ω</text></g><g><rect x="292" y="300" width="16" height="40" fill="none" stroke="#111111" stroke-width="1.5"></rect><text x="286" y="316" text-anchor="end" font-weight="600" fill="#111111">R2</text><text x="286" y="332" text-anchor="end" font-size="11.5" fill="#444444">10 kΩ</text></g><g stroke="#111111" fill="none"><line x1="352" x2="352" y1="232" y2="288" stroke-width="2"></line><line x1="362" x2="362" y1="228" y2="246" stroke-width="2.5"></line><line x1="362" x2="362" y1="251" y2="269" stroke-width="2.5"></line><line x1="362" x2="362" y1="274" y2="292" stroke-width="2.5"></line><path d="M400 260H366" stroke-width="1.5" marker-end="url(#mos-arrow)"></path></g><text x="336" y="252" text-anchor="middle" font-weight="600" fill="#111111">G</text><text x="408" y="228" font-weight="600" fill="#111111">D</text><text x="408" y="302" font-weight="600" fill="#111111">S</text><text x="424" y="254" font-weight="600" fill="#111111">Q1 IRLB8721</text><text x="424" y="270" font-size="11.5" fill="#444444">N-channel, logic-level</text><g><circle cx="400" cy="150" r="22" fill="#ffffff" stroke="#111111" stroke-width="1.5"></circle><text x="400" y="155" text-anchor="middle" font-weight="600" fill="#111111">M</text><text x="392" y="120" text-anchor="end" font-size="11.5" fill="#111111">+</text><text x="392" y="190" text-anchor="end" font-size="11.5" fill="#111111">−</text></g><path d="M356 116V186" fill="none" stroke="#111111" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#mos-arrow)"></path><text x="348" y="146" text-anchor="end" font-size="11.5" fill="#111111">load current</text><text x="348" y="161" text-anchor="end" font-size="11.5" fill="#444444">when Q1 is on</text><g><polygon points="468,166 492,166 480,142" fill="none" stroke="#111111" stroke-width="1.5"></polygon><line x1="466" x2="494" y1="140" y2="140" stroke="#111111" stroke-width="2.5"></line><text x="502" y="150" font-weight="600" fill="#111111">D1 1N5819</text><text x="502" y="166" font-size="11.5" fill="#444444">band to +12 V</text></g><g><rect x="600" y="180" width="100" height="80" rx="4" fill="#ececec" stroke="#111111" stroke-width="1.5"></rect><text x="650" y="212" text-anchor="middle" font-weight="600" fill="#111111">12 V</text><text x="650" y="228" text-anchor="middle" font-size="11.5" fill="#444444">adapter</text><text x="610" y="196" font-size="11.5" fill="#111111">+</text><text x="610" y="252" font-size="11.5" fill="#111111">−</text></g><text x="412" y="390" font-weight="600" fill="#111111">common ground: essential</text><text x="412" y="420" font-size="11.5" fill="#444444">adapter − joined to ESP32 GND</text><text x="24" y="452" font-weight="600" fill="#111111">Why each part is there</text><text x="24" y="474" fill="#111111">R1 100 Ω: limits the gate charging current and damps ringing.</text><text x="24" y="494" fill="#111111">R2 10 kΩ: holds Q1 off while the ESP32 boots, resets or is unplugged.</text><text x="24" y="514" fill="#111111">D1: catches the motor turn-off spike. LED strips need none (harmless).</text><text x="24" y="540" font-weight="600" fill="#111111">V_GS is only 3.3 V:</text><text x="24" y="560" fill="#111111">pick a MOSFET whose R_DS(on) is specified</text><text x="24" y="580" fill="#111111">at V_GS = 4.5 V or lower (IRLB8721: yes).</text><g transform="translate(-30,0)"><text x="640" y="446" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111111">IRLB8721, TO-220</text><rect x="612" y="456" width="56" height="30" fill="#ececec" stroke="#111111" stroke-width="1.5"></rect><circle cx="640" cy="471" r="6" fill="#ffffff" stroke="#111111" stroke-width="1.5"></circle><rect x="608" y="486" width="64" height="40" fill="#ffffff" stroke="#111111" stroke-width="1.5"></rect><line x1="622" x2="622" y1="526" y2="556" stroke="#111111" stroke-width="3"></line><line x1="640" x2="640" y1="526" y2="556" stroke="#111111" stroke-width="3"></line><line x1="658" x2="658" y1="526" y2="556" stroke="#111111" stroke-width="3"></line><text x="622" y="574" text-anchor="middle" font-weight="600" fill="#111111">G</text><text x="640" y="574" text-anchor="middle" font-weight="600" fill="#111111">D</text><text x="658" y="574" text-anchor="middle" font-weight="600" fill="#111111">S</text><text x="684" y="471" font-size="11.5" fill="#444444">tab = D</text><text x="684" y="502" font-size="11.5" fill="#444444">printed side</text><text x="684" y="517" font-size="11.5" fill="#444444">facing you</text></g></svg>
