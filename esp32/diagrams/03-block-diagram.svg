<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 470" role="img" aria-label="Block diagram of the ESP32 development board" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><defs><marker id="blk-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111111"></path></marker></defs><text x="24" y="30" font-size="15" font-weight="600" fill="#111111">What is on the board, and how the parts talk</text><text x="24" y="50" font-size="11.5" fill="#444444">The module (right) is the computer; the rest of the board only powers it and connects it to your Mac</text><g><rect x="24" y="80" width="104" height="62" rx="4" fill="#ececec" stroke="#111111" stroke-width="1.5"></rect><text x="34" y="100" font-weight="600" fill="#111111">micro-USB</text><text x="34" y="118" font-size="11.5" fill="#444444">from your Mac</text></g><g><rect x="168" y="80" width="140" height="78" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.5"></rect><text x="178" y="100" font-weight="600" fill="#111111">USB-UART</text><text x="178" y="118" font-size="11.5" fill="#444444">bridge (CP2102N)</text><text x="178" y="134" font-size="11.5" fill="#444444">USB ⇄ serial</text></g><g><rect x="168" y="196" width="140" height="78" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.5"></rect><text x="178" y="216" font-weight="600" fill="#111111">Auto-reset</text><text x="178" y="234" font-size="11.5" fill="#444444">2 transistors:</text><text x="178" y="250" font-size="11.5" fill="#444444">DTR/RTS → EN, IO0</text></g><g><rect x="168" y="312" width="140" height="62" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.5"></rect><text x="178" y="332" font-weight="600" fill="#111111">Buttons</text><text x="178" y="350" font-size="11.5" fill="#444444">EN, BOOT (IO0)</text></g><g><rect x="24" y="312" width="104" height="78" rx="4" fill="#ececec" stroke="#111111" stroke-width="1.5"></rect><text x="34" y="332" font-weight="600" fill="#111111">LDO</text><text x="34" y="350" font-size="11.5" fill="#444444">5 V → 3.3 V</text><text x="34" y="366" font-size="11.5" fill="#444444">AMS1117-class</text></g><g><path d="M128 111H166" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#blk-arrow)"></path></g><g><path d="M238 158V194" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#blk-arrow)"></path><text x="246" y="182" text-anchor="start" font-size="11.5" fill="#111111">DTR, RTS</text></g><g><path d="M76 142V310" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#blk-arrow)"></path><text x="84" y="230" text-anchor="start" font-size="11.5" fill="#111111">5 V</text></g><text x="84" y="246" font-size="11.5" fill="#444444">(VBUS)</text><rect x="400" y="72" width="336" height="318" rx="6" fill="none" stroke="#111111" stroke-width="2" stroke-dasharray="7 4"></rect><text x="412" y="92" font-weight="600" fill="#111111">ESP32-WROOM-32E module</text><rect x="410" y="104" width="186" height="196" rx="4" fill="#ececec" stroke="#111111" stroke-width="1.5"></rect><text x="420" y="126" font-weight="600" fill="#111111">ESP32 chip</text><text x="420" y="146" font-size="11.5" fill="#111111">2 cores (LX6), 240 MHz</text><text x="420" y="166" font-size="11.5" fill="#111111">520 KB SRAM</text><text x="420" y="186" font-size="11.5" fill="#111111">GPIO, ADC, DAC, touch</text><text x="420" y="206" font-size="11.5" fill="#111111">LEDC PWM, timers</text><text x="420" y="226" font-size="11.5" fill="#111111">UART ×3, I2C ×2, SPI</text><text x="420" y="246" font-size="11.5" fill="#111111">RTC + ULP (deep sleep)</text><text x="420" y="266" font-size="11.5" fill="#111111">Wi-Fi 2.4 GHz, Bluetooth</text><g><rect x="610" y="104" width="116" height="62" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.5"></rect><text x="620" y="124" font-weight="600" fill="#111111">SPI flash</text><text x="620" y="142" font-size="11.5" fill="#444444">4 MB, IO6–11</text></g><g><rect x="610" y="176" width="116" height="52" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.5"></rect><text x="620" y="196" font-weight="600" fill="#111111">40 MHz</text><text x="620" y="214" font-size="11.5" fill="#444444">crystal</text></g><g><rect x="610" y="238" width="116" height="62" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.5"></rect><text x="620" y="258" font-weight="600" fill="#111111">Antenna</text><text x="620" y="276" font-size="11.5" fill="#444444">PCB trace</text></g><g><path d="M596 135H608" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#blk-arrow)"></path></g><g><path d="M596 202H608" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#blk-arrow)"></path></g><g><path d="M596 269H608" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#blk-arrow)"></path></g><g><path d="M308 120H408" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#blk-arrow)"></path><text x="354" y="112" text-anchor="middle" font-size="11.5" fill="#111111">TX/RX</text></g><text x="354" y="138" text-anchor="middle" font-size="11.5" fill="#444444">IO1/3</text><g><path d="M308 235H408" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#blk-arrow)"></path><text x="354" y="226" text-anchor="middle" font-size="11.5" fill="#111111">EN, IO0</text></g><path d="M308 343H354V235" fill="none" stroke="#111111" stroke-width="1.5"></path><circle cx="354" cy="235" r="3.5" fill="#111111"></circle><rect x="410" y="318" width="316" height="60" rx="4" fill="#ffffff" stroke="#111111" stroke-width="1.5"></rect><text x="420" y="340" font-weight="600" fill="#111111">34 GPIOs → headers J2 and J3</text><text x="420" y="358" font-size="11.5" fill="#444444">24 free for your circuits (see the pinout)</text><path d="M76 390V430H568V380" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#blk-arrow)"></path><text x="150" y="424" font-size="11.5" fill="#111111">3.3 V rail: powers the module, and the 3V3 header pin</text><text x="24" y="456" font-size="11.5" fill="#444444">Arrows show the direction of power or of the main signal. IO = GPIO.</text></svg>
