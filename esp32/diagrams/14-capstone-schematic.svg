<svg viewBox="0 0 760 526" role="img" aria-label="Capstone schematic: room climate monitor" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif"><text x="24" y="30" font-size="15" font-weight="600" fill="#111111">Capstone schematic: the room climate monitor</text><text x="24" y="50" font-size="11.5" fill="#444444">Everything runs from the board 3V3; the sensor and display share the I2C bus; pull-ups are on the modules</text><rect x="24" y="130" width="70" height="60" rx="4" fill="#ececec" stroke="#111111" stroke-width="1.5"></rect><text x="59" y="154" text-anchor="middle" font-size="11.5" font-weight="600" fill="#111111">USB</text><text x="59" y="170" text-anchor="middle" font-size="11.5" fill="#111111">charger</text><text x="59" y="184" text-anchor="middle" font-size="10" fill="#444444">5 V, 1 A</text><path d="M94 160H110" fill="none" stroke="#111111" stroke-width="1.5"></path><rect x="110" y="90" width="120" height="320" rx="6" fill="#ffffff" stroke="#111111" stroke-width="2"></rect><text x="122" y="112" font-weight="600" fill="#111111">ESP32</text><text x="122" y="128" font-size="11.5" fill="#444444">DevKitC V4</text><text x="118" y="164" font-size="10" fill="#444444">micro-USB</text><g><line x1="230" x2="244" y1="120" y2="120" stroke="#111111" stroke-width="1.5"></line><text x="222" y="124.5" text-anchor="end" font-size="11.5" fill="#111111">3V3</text></g><g><line x1="230" x2="244" y1="180" y2="180" stroke="#111111" stroke-width="1.5"></line><text x="222" y="184.5" text-anchor="end" font-size="11.5" fill="#111111">GPIO22</text></g><g><line x1="230" x2="244" y1="220" y2="220" stroke="#111111" stroke-width="1.5"></line><text x="222" y="224.5" text-anchor="end" font-size="11.5" fill="#111111">GPIO21</text></g><g><line x1="230" x2="244" y1="300" y2="300" stroke="#111111" stroke-width="1.5"></line><text x="222" y="304.5" text-anchor="end" font-size="11.5" fill="#111111">GPIO25</text></g><g><line x1="230" x2="244" y1="350" y2="350" stroke="#111111" stroke-width="1.5"></line><text x="222" y="354.5" text-anchor="end" font-size="11.5" fill="#111111">GPIO33</text></g><text x="170" y="402" text-anchor="middle" font-size="11.5" fill="#111111">GND</text><path d="M170 410V450" fill="none" stroke="#111111" stroke-width="1.5"></path><path d="M244 120H720" fill="none" stroke="#111111" stroke-width="2.5"></path><text x="724" y="116" text-anchor="end" font-weight="600" fill="#111111">3V3</text><path d="M244 180H720" fill="none" stroke="#111111" stroke-width="1.5"></path><text x="724" y="174" text-anchor="end" font-weight="600" fill="#111111">SCL</text><path d="M244 220H720" fill="none" stroke="#111111" stroke-width="1.5"></path><text x="724" y="214" text-anchor="end" font-weight="600" fill="#111111">SDA</text><path d="M170 450H720" fill="none" stroke="#111111" stroke-width="2.5"></path><text x="724" y="444" text-anchor="end" font-weight="600" fill="#111111">GND</text><g><rect x="360" y="276" width="150" height="74" rx="4" fill="#ececec" stroke="#111111" stroke-width="1.5"></rect><text x="435" y="318" text-anchor="middle" font-weight="600" fill="#111111">BME280</text><text x="435" y="336" text-anchor="middle" font-size="11.5" fill="#111111">address 0x76</text><text x="380" y="292" text-anchor="middle" font-size="10" fill="#111111">VCC</text><text x="430" y="292" text-anchor="middle" font-size="10" fill="#111111">SCL</text><text x="480" y="292" text-anchor="middle" font-size="10" fill="#111111">SDA</text><text x="444" y="366" font-size="10" fill="#111111">GND</text></g><path d="M380 120V276" fill="none" stroke="#111111" stroke-width="1.5"></path><circle cx="380" cy="120" r="3.5" fill="#111111"></circle><path d="M430 180V276" fill="none" stroke="#111111" stroke-width="1.5"></path><circle cx="430" cy="180" r="3.5" fill="#111111"></circle><path d="M480 220V276" fill="none" stroke="#111111" stroke-width="1.5"></path><circle cx="480" cy="220" r="3.5" fill="#111111"></circle><path d="M435 350V450" fill="none" stroke="#111111" stroke-width="1.5"></path><circle cx="435" cy="450" r="3.5" fill="#111111"></circle><g><rect x="560" y="276" width="150" height="74" rx="4" fill="#ececec" stroke="#111111" stroke-width="1.5"></rect><text x="635" y="318" text-anchor="middle" font-weight="600" fill="#111111">SSD1306 OLED</text><text x="635" y="336" text-anchor="middle" font-size="11.5" fill="#111111">128 × 64, 0x3C</text><text x="580" y="292" text-anchor="middle" font-size="10" fill="#111111">VCC</text><text x="630" y="292" text-anchor="middle" font-size="10" fill="#111111">SCL</text><text x="680" y="292" text-anchor="middle" font-size="10" fill="#111111">SDA</text><text x="644" y="366" font-size="10" fill="#111111">GND</text></g><path d="M580 120V276" fill="none" stroke="#111111" stroke-width="1.5"></path><circle cx="580" cy="120" r="3.5" fill="#111111"></circle><path d="M630 180V276" fill="none" stroke="#111111" stroke-width="1.5"></path><circle cx="630" cy="180" r="3.5" fill="#111111"></circle><path d="M680 220V276" fill="none" stroke="#111111" stroke-width="1.5"></path><circle cx="680" cy="220" r="3.5" fill="#111111"></circle><path d="M635 350V450" fill="none" stroke="#111111" stroke-width="1.5"></path><circle cx="635" cy="450" r="3.5" fill="#111111"></circle><path d="M244 300H310V312" fill="none" stroke="#111111" stroke-width="1.5"></path><rect x="302" y="312" width="16" height="36" fill="#ffffff" stroke="#111111" stroke-width="1.5"></rect><text x="296" y="326" text-anchor="end" font-size="11.5" font-weight="600" fill="#111111">R1</text><text x="296" y="342" text-anchor="end" font-size="10" fill="#444444">330 Ω</text><path d="M310 348V372" fill="none" stroke="#111111" stroke-width="1.5"></path><polygon points="298,372 322,372 310,394" fill="#ffffff" stroke="#111111" stroke-width="1.5"></polygon><line x1="298" x2="322" y1="394" y2="394" stroke="#111111" stroke-width="2"></line><text x="328" y="388" font-size="11.5" font-weight="600" fill="#111111">LED1</text><path d="M310 394V450" fill="none" stroke="#111111" stroke-width="1.5"></path><circle cx="310" cy="450" r="3.5" fill="#111111"></circle><path d="M244 350H262V372" fill="none" stroke="#111111" stroke-width="1.5"></path><circle cx="262" cy="376" r="4" fill="#ffffff" stroke="#111111" stroke-width="1.5"></circle><circle cx="262" cy="412" r="4" fill="#ffffff" stroke="#111111" stroke-width="1.5"></circle><line x1="250" x2="250" y1="368" y2="420" stroke="#111111" stroke-width="2"></line><path d="M250 394H238" fill="none" stroke="#111111" stroke-width="1.5"></path><text x="272" y="404" font-size="11.5" font-weight="600" fill="#111111">S1</text><path d="M262 416V450" fill="none" stroke="#111111" stroke-width="1.5"></path><circle cx="262" cy="450" r="3.5" fill="#111111"></circle><text x="24" y="478" font-size="11.5" fill="#111111">GPIO25: status LED (on while saving, toggled from the web page). GPIO33: button, next display page (INPUT_PULLUP).</text><text x="24" y="496" font-size="11.5" fill="#111111">I2C: Wire.begin(21, 22). Add 4.7 kΩ pull-ups to 3V3 only if neither module has them.</text><text x="24" y="514" font-size="11.5" fill="#444444">Keep the BME280 away from the ESP32 module and the LDO: both warm the air around them.</text></svg>
